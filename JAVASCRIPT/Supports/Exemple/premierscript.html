<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Premier Script</title>
</head>
<body>
    <h1 id="titre">Bienvenue</h1>
    <button id="monBouton">Cliquez-moi</button>
    
    <script>

// On affiche un message dans la console
console.log("Script JavaScript chargé avec succès !");

// On modifie le contenu du titre
let titre = document.getElementById("titre");
// Je sélectionne l'élément avec l'ID "titre" et change le texte
titre.textContent = "Bonjour JavaScript !";

// On ajoute un événement au bouton
let bouton = document.getElementById("monBouton");

//On ajoute un gestionnaire d'événement au bouton qui affiche une alerte au clic
bouton.addEventListener("click", function() {
    alert("Vous avez cliqué sur le bouton !");
    console.log("Clic détecté");
});


    </script>
</body>
</html>
