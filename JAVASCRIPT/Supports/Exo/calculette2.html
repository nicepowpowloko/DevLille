<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .calculatrice {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #ecran {
            background-color: #222;
            color: #0f0;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            min-height: 50px;
            word-wrap: break-word;
        }

        .ligne {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            width: 70px;
            height: 70px;
            font-size: 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #555;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background-color: #666;
        }

        button:active {
            transform: scale(0.95);
        }

        .operateur {
            background-color: #ff9500;
        }

        .operateur:hover {
            background-color: #ffb143;
        }

        #btnC {
            background-color: #d4380d;
        }

        #btnC:hover {
            background-color: #ff6b45;
        }

        #btnEgal {
            background-color: #4CAF50;
        }

        #btnEgal:hover {
            background-color: #66BB6A;
        }
    </style>
</head>
<body>
    <div class="calculatrice">
        <div id="ecran">0</div>
        
        <div class="ligne">
            <button id="btn7">7</button>
            <button id="btn8">8</button>
            <button id="btn9">9</button>
            <button id="btn/" class="operateur">/</button>
        </div>
        
        <div class="ligne">
            <button id="btn4">4</button>
            <button id="btn5">5</button>
            <button id="btn6">6</button>
            <button id="btn*" class="operateur">*</button>
        </div>
        
        <div class="ligne">
            <button id="btn1">1</button>
            <button id="btn2">2</button>
            <button id="btn3">3</button>
            <button id="btn-" class="operateur">-</button>
        </div>
        
        <div class="ligne">
            <button id="btnC">C</button>
            <button id="btn0">0</button>
            <button id="btnEgal">=</button>
            <button id="btn+" class="operateur">+</button>
        </div>
    </div>

    <script>
        
        let calcul = "";

        //  0 à 9
        for (let i = 0; i <= 9; i++) {
            document.getElementById("btn" + i).onclick = function() {
               
                if (calcul === "") {
                    calcul = this.innerHTML;
                } else {
                    calcul += this.innerHTML; 
                }
                document.getElementById("ecran").innerHTML = calcul;
            };
        }

        // BOUCLE 2 : Tous les opérateurs
        let operateurs = ["+", "-", "*", "/"];
        for (let i = 0; i < operateurs.length; i++) {
            document.getElementById("btn" + operateurs[i]).onclick = function() {
                calcul += this.innerHTML; // Ajoute l'opérateur
                document.getElementById("ecran").innerHTML = calcul;
            };
        }

        // Bouton = (égal)
        document.getElementById("btnEgal").onclick = function() {
            try {
                let resultat = eval(calcul); // Calcule le résultat
                document.getElementById("ecran").innerHTML = resultat;
                calcul = resultat.toString(); // Stocke le résultat pour continuer
            } catch (erreur) {
                document.getElementById("ecran").innerHTML = "Erreur";
                calcul = "";
            }
        };

        // Bouton C (Clear/Effacer)
        document.getElementById("btnC").onclick = function() {
            calcul = ""; // Vide tout
            document.getElementById("ecran").innerHTML = "0";
        };
    </script>
</body>
</html>
