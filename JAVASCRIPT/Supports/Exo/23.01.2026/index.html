    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .section {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #667eea;
            border-left: 4px solid #667eea;
            padding-left: 10px;
            margin-top: 0;
        }
        .fichiers {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
        }
        a {
            color: #007bff;
            text-decoration: none;
            display: block;
            padding: 12px;
            background-color: #f8f9fa;
            border-left: 3px solid #007bff;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a:hover {
            background-color: #e9ecef;
            padding-left: 20px;
        }
        .retour {
            text-align: center;
            margin: 30px 0;
        }
        .retour a {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            display: inline-block;
            border: none;
        }
        .retour a:hover {
            background-color: #218838;
        }
    </style>
</head>
