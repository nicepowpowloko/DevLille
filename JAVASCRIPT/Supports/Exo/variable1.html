<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. Créez une variable `prenom` avec votre prénom
let prenom = "Thomas";

// 2. Créez une variable `age` avec votre âge
let age = 35;

// 3. Créez une variable `ville` avec votre ville
let ville = "Paris";

// 4. Affichez ces trois variables avec `typeof`
console.log(prenom, "est de type :", typeof prenom);
console.log(age, "est de type :", typeof age);
console.log(ville, "est de type :", typeof ville);

// Résultat dans la console :
// Thomas est de type : string
// 35 est de type : number
// Paris est de type : string

// 5. Créez une constante `PAYS` avec la valeur "France"
const PAYS = "France";

console.log(PAYS, "est de type :", typeof PAYS);
// Résultat : France est de type : string
    </script>
</body>
</html>
