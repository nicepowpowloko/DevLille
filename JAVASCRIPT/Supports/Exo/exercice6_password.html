<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 6 - Vérification de mot de passe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            min-height: 100vh;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercice 6 : Vérification de mot de passe</h1>
        
        <div id="resultats"></div>
    </div>

    <script>
        // 1. Créer une variable motDePasse avec une chaîne de caractères
        let motDePasse = "Azerty123";

        // 2. Créer une variable longueur qui stocke le nombre de caractères du mot de passe
        let longueur = motDePasse.length;

        // 3. Créer une variable aChiffres avec true ou false
        let aChiffres = true;

        // 4. Créer une variable aMajuscules avec true ou false
        let aMajuscules = true;

        // 5. Vérifier si le mot de passe est fort
        let estFort = longueur >= 8 && aChiffres && aMajuscules;

        // 6. Vérifier si le mot de passe est moyen
        let estMoyen = longueur >= 6 && (aChiffres || aMajuscules);

        // 7. Afficher tous les résultats
        let html = `
            <div class="result">
                <h2> Mot de passe à analyser</h2>
                <div class="password-display">
                    ${motDePasse}
                </div>
            </div>

            <div class="result">
                <h2>Analyse des critères</h2>
                <div class="info-line">
                    <span>Nombre de caractères</span>
                    <span class="check" style="color: #667eea; font-weight: bold;">${longueur}</span>
                </div>
                <div class="info-line">
                    <span>Contient des chiffres</span>
                    <span class="check">${aChiffres ? '' : ''}</span>
                </div>
                <div class="info-line">
                    <span>Contient des majuscules</span>
                    <span class="check">${aMajuscules ? '' : ''}</span>
                </div>
            </div>
        `;

        // Déterminer et afficher le niveau de sécurité
        if (estFort) {
            html += `
                <div class="level level-fort">
                    MOT DE PASSE FORT !
                </div>
                <div class="success">
                     Votre mot de passe respecte tous les critères de sécurité :<br><br>
                    ✓ Au moins 8 caractères (${longueur})<br>
                    ✓ Contient des chiffres<br>
                    ✓ Contient des majuscules
                </div>
            `;
        } else if (estMoyen) {
            html += `
                <div class="level level-moyen">
                     MOT DE PASSE MOYEN
                </div>
                <div class="warning">
                     Votre mot de passe pourrait être amélioré<br><br>
                    ✓ Au moins 6 caractères (${longueur})<br>
                    ${aChiffres ? '✓ Contient des chiffres<br>' : ''}
                    ${aMajuscules ? '✓ Contient des majuscules<br>' : ''}
                </div>
                <div class="criteria">
                    <strong> Pour un mot de passe fort, il faut :</strong><br>
                    ${longueur < 8 ? ' Au moins 8 caractères<br>' : ''}
                    ${!aChiffres ? ' Des chiffres<br>' : ''}
                    ${!aMajuscules ? ' Des majuscules<br>' : ''}
                </div>
            `;
        } else {
            html += `
                <div class="level level-faible">
                     MOT DE PASSE FAIBLE
                </div>
                <div class="error">
                     Votre mot de passe est trop faible !<br><br>
                    Caractéristiques actuelles :<br>
                    • ${longueur} caractères (< 6)<br>
                    ${aChiffres ? '' : '• Pas de chiffres<br>'}
                    ${aMajuscules ? '' : '• Pas de majuscules<br>'}
                </div>
                <div class="criteria">
                    <strong> Recommandations :</strong><br>
                    ✓ Utilisez au moins 8 caractères<br>
                    ✓ Ajoutez des chiffres<br>
                    ✓ Ajoutez des majuscules<br>
                    ✓ Mélangez lettres, chiffres et majuscules
                </div>
            `;
        }

        // Afficher le code utilisé
        html += `
            <div class="result">
                <h3> Code JavaScript utilisé :</h3>
                <div class="code">
// 1. Mot de passe à vérifier<br>
let motDePasse = "Azerty123";<br>
<br>
// 2. Obtenir la longueur<br>
let longueur = motDePasse.length;<br>
<br>
// 3. Vérifier la présence de chiffres<br>
let aChiffres = true;<br>
<br>
// 4. Vérifier la présence de majuscules<br>
let aMajuscules = true;<br>
<br>
// 5. Mot de passe FORT (ET logique &&)<br>
// Toutes les conditions doivent être vraies<br>
let estFort = longueur >= 8 && aChiffres && aMajuscules;<br>
<br>
// 6. Mot de passe MOYEN (OU logique ||)<br>
// Au moins une condition doit être vraie<br>
let estMoyen = longueur >= 6 && (aChiffres || aMajuscules);<br>
<br>
// 7. Afficher les résultats<br>
console.log("Longueur:", longueur);<br>
console.log("A des chiffres:", aChiffres);<br>
console.log("A des majuscules:", aMajuscules);<br>
console.log("Mot de passe fort:", estFort);<br>
console.log("Mot de passe moyen:", estMoyen);
                </div>
            </div>
        `;

        // Afficher dans la page
        document.getElementById('resultats').innerHTML = html;

        // Afficher aussi dans la console
        console.log("=== VÉRIFICATION DE MOT DE PASSE ===");
        console.log(`Mot de passe : ${motDePasse}`);
        console.log(`Longueur : ${longueur} caractères`);
        console.log(`Contient des chiffres : ${aChiffres}`);
        console.log(`Contient des majuscules : ${aMajuscules}`);
        console.log(`---`);
        console.log(`Mot de passe FORT : ${estFort}`);
        console.log(`Mot de passe MOYEN : ${estMoyen}`);
        if (!estFort && !estMoyen) {
            console.log(" MOT DE PASSE FAIBLE");
        }
    </script>
</body>
</html>
