<!DOCTYPE html>
<html>
<head>
    <title>mode sombre</title>
    <style>
        body { background: white; color: black; }
        body.dark-mode { background: #333; color: white; }
    </style>
</head>
<body>
    <h1>Mon site web</h1>
    <button id="btnMode">Activer mode sombre</button>
    
    <script>
        let bouton = document.getElementById("btnMode");
        
        bouton.onclick = function() {
            document.body.classList.toggle("dark-mode");
            
            if (document.body.classList.contains("dark-mode")) {
                bouton.textContent = "Désactiver mode sombre";
            } else {
                bouton.textContent = "Activer mode sombre";
            }
        };
    </script>
</body>
</html>
