<!DOCTYPE html>
<html>
<head>
  <title>Table de multiplication</title>
</head>
<body>

<script>
function tableMultiplication(n) {
  let i = 1;
  
  while (i <= 10) {
    //// Tant que i est inférieur ou égal à 10, le code à l’intérieur des {} sera exécuté.
    document.write(n + " x " + i + " = " + (n * i) + "<br>");
// crée une chaîne qui ressemble à : 5 x 1 = 5
// (n * i) calcule le produit de n et i.
    i++;
  }
}

// Test de la fonction avec le nombre 5 ( par exemple )
tableMultiplication(7);
</script>

</body>
</html>
