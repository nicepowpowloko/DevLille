<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for</title>
</head>
<body>
    

    <script>

 // Exo 1 //

for (let i = 1; i <= 10; i++) {
  document.write(i + "<br>");
}

for (let a = 0; a <= 20; a += 2) {
  document.write(a + "<br>");
}

for (let b = 10; b >= 1; b--) {
  document.write(b + "<br>");
}

for (let c = 1; c <= 10; c++) {
  document.write("Bonjour <br>");
}

// Exo 2 //

for (let d = 1; d <= 10; d++) {
  document.write("5 x " + d + " = " + (5 * d) + "<br>");
}


let somme = 0;

for (let e = 1; e <= 10; e++) {
  somme += e;
}

document.write(somme);


for (let f = 2; f <= 20; f += 2) {
  document.writeln(f);
}

// Exo 3 //

let fruits = ["<br>", "pomme", "<br>", "banane","<br>", "orange","<br>", "fraise","<br>"];

for (let g = 0; g < fruits.length; g++) {
  document.write(fruits[g]);
}

let legumes = ["<br>","poireaux","<br>", "artichaux","<br>", "haricots"];
for (let h = 0; h < legumes.length; h++) {
  document.write(legumes[h].length + "<br>");
}

</script>


</body>
</html>
