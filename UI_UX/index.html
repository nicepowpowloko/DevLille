<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX Design</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: white;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .section {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #a8edea;
            border-left: 4px solid #a8edea;
            padding-left: 10px;
            margin-top: 0;
        }
        a {
            color: #007bff;
            text-decoration: none;
            display: block;
            padding: 12px;
            background-color: #fff3cd;
            border-left: 3px solid #ffc107;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a:hover {
            background-color: #ffe69c;
            padding-left: 20px;
        }
        .retour {
            text-align: center;
            margin: 30px 0;
        }
        .retour a {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            display: inline-block;
            border: none;
        }
        .retour a:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>UI/UX Design</h1>

    <div class="section">
        <h2>Support de cours</h2>
        <a href="UX-UI-Design.pdf">UX UI Design (PDF)</a>
    </div>

    <div class="retour">
         <a href="../index.html">Retour</a>
    </div>
</body>
</html>
