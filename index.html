<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon-32x32.png" type="image/png">
    <title>Formation DWWM - Real Conseil</title>
    <style>



        :root {
            --bg-deep:       #080b0f;
            --bg-card:       #0d1117;
            --bg-card-hover: #111820;
            --border:        #1e2d3d;
            --border-glow:   #44D62C;
            --accent-green:  #44D62C;
            --accent-blue:   #00b4d8;
            --accent-orange: #ff6b00;
            --text-primary:  #e6edf3;
            --text-muted:    #7d8590;
            --text-dim:      #3d444d;
            --red-btn:       #ff5f57;
            --orange-btn:    #febc2e;
            --green-btn:     #28c840;
            --titlebar:      #161b22;
            --font-mono:     'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
            --font-ui:       -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-ui);
            background: var(--bg-deep);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        /* ── BACKGROUND GRID ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(68,214,44,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(68,214,44,.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── GLOW ORBS ── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.18;
        }
        .orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #44D62C, transparent);
            top: -200px; left: -200px;
            animation: orbFloat 18s ease-in-out infinite;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #00b4d8, transparent);
            bottom: -150px; right: -150px;
            animation: orbFloat 22s ease-in-out infinite reverse;
        }
        .orb-3 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #ff6b00, transparent);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation: orbFloat 15s ease-in-out infinite 5s;
            opacity: 0.08;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%       { transform: translate(30px, -30px) scale(1.05); }
            66%       { transform: translate(-20px, 20px) scale(.95); }
        }

        /* ── PAGE TRANSITION ── */
        .page-transition-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(.4,0,.2,1);
        }
        .page-transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        body.page-out .container {
            transform: scale(0.96) translateY(10px);
            opacity: 0;
        }

        /* ── CONTAINER ── */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 24px 80px;
            transition: transform 0.35s cubic-bezier(.4,0,.2,1), opacity 0.35s cubic-bezier(.4,0,.2,1);
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeDown .6s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo-wrap {
            display: inline-block;
            margin-bottom: 24px;
            position: relative;
        }
        .logo-wrap::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 20px;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
            opacity: 0.3;
            filter: blur(16px);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { opacity: 0.2; }
            50%       { opacity: 0.5; }
        }
        .logo-wrap img {
            position: relative;
            width: 80px;
            background: #fff;
            padding: 10px;
            border-radius: 14px;
            display: block;
        }

        .header h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff 0%, var(--accent-green) 40%, var(--accent-blue) 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes gradientShift {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .header p {
            color: var(--text-muted);
            font-size: .95rem;
            font-family: var(--font-mono);
            letter-spacing: .05em;
        }
        .header p span {
            color: var(--accent-green);
        }

        /* ── LEGEND ── */
        .legend {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 48px;
            flex-wrap: wrap;
            animation: fadeDown .6s ease .1s both;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: .8rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }
        .legend-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .legend-dot.red    { background: var(--red-btn); }
        .legend-dot.orange { background: var(--orange-btn); }
        .legend-dot.green  { background: var(--green-btn); }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        /* ── MAC WINDOW CARD ── */
        .mac-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1),
                        border-color .3s ease,
                        box-shadow .3s ease;
            animation: fadeUp .5s ease both;
            position: relative;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .mac-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: rgba(68,214,44,.35);
            box-shadow:
                0 20px 60px rgba(0,0,0,.6),
                0 0 0 1px rgba(68,214,44,.15),
                inset 0 0 40px rgba(68,214,44,.03);
        }

        /* Stagger animation delays */
        .mac-card:nth-child(1)  { animation-delay: .05s; }
        .mac-card:nth-child(2)  { animation-delay: .10s; }
        .mac-card:nth-child(3)  { animation-delay: .15s; }
        .mac-card:nth-child(4)  { animation-delay: .20s; }
        .mac-card:nth-child(5)  { animation-delay: .25s; }
        .mac-card:nth-child(6)  { animation-delay: .30s; }
        .mac-card:nth-child(7)  { animation-delay: .35s; }
        .mac-card:nth-child(8)  { animation-delay: .40s; }
        .mac-card:nth-child(9)  { animation-delay: .45s; }
        .mac-card:nth-child(10) { animation-delay: .50s; }
        .mac-card:nth-child(11) { animation-delay: .55s; }
        .mac-card:nth-child(12) { animation-delay: .60s; }
        .mac-card:nth-child(13) { animation-delay: .65s; }
        .mac-card:nth-child(14) { animation-delay: .70s; }
        .mac-card:nth-child(15) { animation-delay: .75s; }
        .mac-card:nth-child(16) { animation-delay: .80s; }
        .mac-card:nth-child(17) { animation-delay: .85s; }

        /* ── TITLEBAR ── */
        .titlebar {
            background: var(--titlebar);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .dots {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: filter .15s ease, transform .15s ease;
            flex-shrink: 0;
            border: none;
            outline: none;
        }
        .dot:hover  { filter: brightness(1.2); transform: scale(1.15); }
        .dot:active { transform: scale(.9); }

        .dot-red    { background: var(--red-btn); box-shadow: 0 0 6px rgba(255,95,87,.4); }
        .dot-orange { background: var(--orange-btn); box-shadow: 0 0 6px rgba(254,188,46,.4); }
        .dot-green  { background: var(--green-btn); box-shadow: 0 0 6px rgba(40,200,64,.6); }

        .dot .dot-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            font-size: 9px;
            font-weight: 900;
            color: rgba(0,0,0,.7);
            transition: opacity .15s ease;
            line-height: 1;
        }
        .titlebar:hover .dot .dot-icon { opacity: 1; }

        .titlebar-name {
            flex: 1;
            text-align: center;
            font-family: var(--font-mono);
            font-size: .78rem;
            color: var(--text-muted);
            letter-spacing: .04em;
            margin-right: 39px; /* compensate dots width */
        }

        /* ── CARD BODY ── */
        .card-body {
            padding: 20px 20px 22px;
        }

        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(68,214,44,.08);
            border: 1px solid rgba(68,214,44,.2);
            border-radius: 6px;
            padding: 3px 10px;
            font-family: var(--font-mono);
            font-size: .7rem;
            color: var(--accent-green);
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }
        .card-badge::before {
            content: '▸';
            font-size: .65rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -.01em;
        }

        .card-desc {
            font-size: .83rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 18px;
            min-height: 38px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .card-path {
            font-family: var(--font-mono);
            font-size: .7rem;
            color: var(--text-dim);
        }

        .card-arrow {
            width: 28px; height: 28px;
            border-radius: 7px;
            background: rgba(68,214,44,.1);
            border: 1px solid rgba(68,214,44,.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-green);
            font-size: .9rem;
            cursor: pointer;
            transition: background .2s, transform .2s;
        }
        .card-arrow:hover {
            background: rgba(68,214,44,.25);
            transform: translateX(3px);
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--titlebar);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 20px;
            font-family: var(--font-mono);
            font-size: .82rem;
            color: var(--accent-orange);
            box-shadow: 0 8px 30px rgba(0,0,0,.5);
            z-index: 1000;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
            opacity: 0;
            white-space: nowrap;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── FOOTER ── */
        footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 40px 24px 60px;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }
        footer .footer-logo img {
            width: 60px;
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            margin-bottom: 16px;
            opacity: .8;
        }
        footer p {
            color: var(--text-muted);
            font-size: .82rem;
            margin: 4px 0;
        }
        footer a {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: .82rem;
        }
        footer a:hover { text-decoration: underline; }
        footer .year {
            font-family: var(--font-mono);
            color: var(--text-dim);
            font-size: .72rem;
            margin-top: 16px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .legend { gap: 16px; }
        }
    </style>
</head>
<body>

<!-- Overlay de transition page -->
<div class="page-transition-overlay" id="transitionOverlay"></div>

<!-- Toast notification -->
<div class="toast" id="toast">Lien copié dans le presse-papier !</div>

<!-- Orbs décoratifs -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container" id="mainContainer">

    <!-- Header -->
    <header class="header">
        <div class="logo-wrap">
            <img src="./JAVASCRIPT/Supports/IMG/realconseil_logo-removebg-preview.png" alt="Real Conseil">
        </div>
        <h1>Formation DWWM — Real Conseil</h1>
        <p>Supports de cours &amp; exercices <span>// 2025-2026</span></p>
    </header>

    <!-- Légende boutons -->
    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot red"></div>
            <span>Retour arrière</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot orange"></div>
            <span>Ouvrir dans un nouvel onglet</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot green"></div>
            <span>Accéder au cours</span>
        </div>
    </div>

    <!-- Grille des cours -->
    <div class="grid" id="coursesGrid">

        <!-- Les cartes sont générées par JS ci-dessous -->

    </div>
</div>

<!-- Footer -->
<footer>
    <div class="footer-logo">
        <img src="./JAVASCRIPT/Supports/IMG/realconseil_logo-removebg-preview.png" alt="Real Conseil">
    </div>
    <p><strong style="color:var(--text-primary)">Formation Real Conseil — DWWM</strong></p>
    <p>&copy; DARRAS Thomas</p>
    <p class="year">// Les supports sont mis à jour régulièrement via GitHub</p>
     <a href="https://github.com/nicepowpowloko/Devlille" target="_blank">Voir le repo GitHub</a>
</footer>

<script>
    const courses = [
        {
            title: 'HTML',
            desc: 'Structure sémantique, balises, formulaires et accessibilité.',
            path: './HTML/',
            file: 'index.html'
        },
        {
            title: 'CSS',
            desc: 'Flexbox, Grid, variables CSS et animations.',
            path: './CSS/',
            file: 'index.html'
        },
        {
            title: 'Responsive',
            desc: 'Media queries, mobile-first et design adaptatif.',
            path: './RESPONSIVE/formation-responsive-web-design.html',
            file: ''
        },
        {
            title: 'JavaScript',
            desc: 'ES6+, DOM, async/await, fetch et modules.',
            path: './JAVASCRIPT/',
            file: 'index.html'
        },
         {
            title: 'Glossaire',
            desc: 'Définitions des termes techniques utilisés dans la formation.',
            path: './GLOSSAIRE/glossaire-dwwm.html',
            file: ''
        },
        {
            title: 'Cheat Sheet',
            desc: 'Références rapides pour toutes les technos.',
            path: './CHEAT_SHEET/cheatsheet-dwwm.html',
            file: 'index.html'
        },
        {
            title: 'Révision JS',
            desc: 'Exercices de révision JavaScript et corrections.',
            path: './RÉVISION/',
            file: 'index.html'
        },
        {
            title: 'Api Rest',
            desc: 'Fetch, Axios, méthodes HTTP et gestion des erreurs.',
            path: './API_REST/api-rest.html',
            file: ''
        },
          {
            title: 'Async',
            desc: 'Fonctions asynchrones, Promises, async/await et gestion des erreurs.',
            path: './ASYNC/support-async-js.html',
            file: ''
        },
            {
            title: 'Destructuration',
            desc: 'Destructuration d\'objets et tableaux en JavaScript.',
            path: './DESTRUCTURATION/support-destructuration.html',
            file: ''
        },
          {
            title: 'Chaining',
            desc: 'Découvrez les opérateurs de coalescence nulle et d\'optionnel chaining.',
            path: './CHAINING/support-optionalchaining-nullish.html',
            file: ''
        },
        {
            title: 'Set & Map',
            desc: ' Utilisation avancée des collections Set et Map en JavaScript.',
            path: './SET_MAP/support-set-map.html',
            file: ''
        },
        {
            title: 'Entretien Dev',
            desc: 'Préparation à l\'entretien technique de développeur web.',
            path: './ENTRETIEN/support-entretien.html',
            file: ''
        },
        {
            title: 'Storage',
            desc: 'localStorage, sessionStorage et cookies.',
            path: './STORAGE/cours-localStorage.html',
            file: ''
        },
        {
            title: 'Pagination',
            desc: 'Implémentation côté client et serveur.',
            path: './PAGINATION/pagination_cours_complet.html',
            file: ''
        },
          {
            title: 'React',
            desc: 'Composants, hooks, state, props et routing.',
            path: './REACT/',
            file: 'index.html'
        },
          {
            title: 'Environnement',
            desc: 'Setup Mac, Windows, Linux, VS Code et Terminal.',
            path: './ENVIRONEMENT/support_environnement.html',
            file: ''
        },
        {
            title: 'PHP',
            desc: 'Bases PHP, POO, sessions et connexion BDD.',
            path: './PHP/',
            file: 'index.html'
        },
         {
            title: 'Docker',
            desc: 'Conteneurs, images, docker-compose et déploiement.',
            path: './DOCKER/',
            file: 'index.html'
        },
        {
            title: 'Code',
            desc: 'Exemples de code et snippets réutilisables.',
            path: './CODE/',
            file: 'index.html'
        },
        {
            title: 'Réseaux',
            desc: 'Protocoles, adressage IP, DNS et HTTP/HTTPS.',
            path: './RESEAUX/formation-reseaux.html',
            file: ''
        },
        {
            title: 'Sécurité',
            desc: 'XSS, CSRF, SQL injection et bonnes pratiques.',
            path: './SECURITE/securite-formation.html',
            file: ''
        },
        {
            title: 'UI/UX',
            desc: 'Principes de design, accessibilité et prototypage.',
            path: './UI_UX/',
            file: 'index.html'
        },
          {
            title: 'SVG',
            desc: 'Création et animation de graphiques vectoriels avec SVG.',
            path: './SVG/cours-SVG.html',
            file: ''
        },
          {
            title: 'Path Editor',
            desc: 'Outil interactif pour éditer les courbes SVG et générer du code.',
            path: './PATH_EDITOR/tuto-svg-path-editor.html',
            file: ''
        },
    ];

    /* GÉNÉRATION DES CARTES */
    const grid = document.getElementById('coursesGrid');

    courses.forEach((course, i) => {
        const url = course.path;
        const label = course.title.toLowerCase().replace(/[^a-z0-9]/g, '-');

        const card = document.createElement('div');
        card.className = 'mac-card';
        card.innerHTML = `
            <div class="titlebar">
                <div class="dots">
                    <button class="dot dot-red" title="Retour arrière" onclick="goBack(event)" aria-label="Retour arrière">
                        <span class="dot-icon">✕</span>
                    </button>
                    <button class="dot dot-orange" title="Ouvrir dans un nouvel onglet" onclick="openNewTab(event, '${url}')" aria-label="Ouvrir dans un nouvel onglet">
                        <span class="dot-icon">⊞</span>
                    </button>
                    <button class="dot dot-green" title="Accéder au cours" onclick="navigateTo(event, '${url}')" aria-label="Accéder au cours">
                        <span class="dot-icon">↗</span>
                    </button>
                </div>
                <span class="titlebar-name">${label}.dev</span>
            </div>
            <div class="card-body">
                <div class="card-badge">${course.title}</div>
                <h2 class="card-title">${course.title}</h2>
                <p class="card-desc">${course.desc}</p>
                <div class="card-footer">
                    <span class="card-path">${course.path}${course.file}</span>
                    <div class="card-arrow" onclick="navigateTo(event, '${url}')" title="Accéder">→</div>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });

    function goBack(event) {
        event.stopPropagation();
        if (window.history.length > 1) {
            window.history.back();
        } else {
            showToast('⬅ Pas d\'historique de navigation');
        }
    }

    function openNewTab(event, url) {
        event.stopPropagation();
        window.open(url, '_blank');
        showToast('🟠 Ouvert dans un nouvel onglet !');
    }

    function navigateTo(event, url) {
        event.stopPropagation();
        window.location.href = url;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    window.addEventListener('pageshow', () => {
        const c = document.getElementById('mainContainer');
        c.style.transition = 'none';
        c.style.opacity = '1';
        c.style.transform = 'none';
    });
</script>
<script src="./cursor.js"></script>
</body>
</html>
