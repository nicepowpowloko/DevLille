<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu_deroulant</title>
</head>
<body>
    
<style>
    /* Empêche la liste d'apparaître au début */
.dropdown-menu {
    display: none;
    position: absolute;
    background: white;
    list-style: none;
    padding: 10px 0;
    border-radius: 6px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}

.dropdown-menu li a {
    display: block;
    padding: 8px 20px;
    color: #333;
    text-decoration: none;
}

.dropdown-menu li a:hover {
    background-color: #f0f0f0;
}

/* Le parent doit être relatif */
.dropdown {
    position: relative;
}

</style>



<nav>
    <ul>
        <li><a href="#">Accueil</a></li>

        <!-- MENU DÉROULANT -->
        <li class="dropdown">
            <a href="#" id="btnMenu">Services ▼</a>

            <ul class="dropdown-menu" id="menuDeroulant">
                <li><a href="#">Web</a></li>
                <li><a href="#">Design</a></li>
                <li><a href="#">Formation</a></li>
            </ul>
        </li>

        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<script>


// On récupère dans le HTML l'élément qui sert de bouton pour ouvrir le menu
const btnMenu = document.getElementById('btnMenu');

// On récupère dans le HTML la liste du menu déroulant
const menu = document.getElementById('menuDeroulant');

// On ajoute un "écouteur d'évènement" sur un clic du bouton
btnMenu.addEventListener('click', function(e) {

    // Empêche le comportement par défaut du lien <a>
    // Sinon la page remonte en haut ou recharge
    e.preventDefault(); 

    // Si le menu est visible (display == 'block'), on le cache
    // Sinon (display == 'none' ou vide), on l'affiche
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});



</script>



</body>
</html>
