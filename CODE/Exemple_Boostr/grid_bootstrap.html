<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Image_Grid_Bootstrap</title>
</head>

<style>
/* Padding top pour que le contenu ne soit pas caché derrière la navbar fixe */
body { padding-top: 70px; }
/* Footer stylé simple */
footer { background: #f8f9fa; padding: 1rem 0; text-align: center; border-top: 1px solid #dee2e6; }
/* Images dans les cards avec hauteur fixe et cover */
.img-card { height: 200px; object-fit: cover; }
</style>


<body>
    
<!-- Colonne responsive : 
     col-12 = prend toute la largeur sur mobile
     col-sm-6 = prend la moitié de l'écran sur petits écrans/tablettes
     col-md-4 = prend 1/3 de l'écran sur écrans moyens
     col-lg-3 = prend 1/4 de l'écran sur grands écrans -->

<div class="col-12 col-sm-6 col-md-4 col-lg-3">

    <!-- Card Bootstrap : conteneur pour image + texte -->
    <div class="card">

        <!-- Image en haut de la card -->
        <!-- card-img-top = classe Bootstrap pour image en haut d'une card -->
        <!-- img-card = classe personnalisée pour hauteur fixe et object-fit cover -->
        <img src="./IMG/gratisography-augmented-reality-800x525.jpg" class="card-img-top img-card" alt="Image 2">

        <!-- Corps de la card contenant le texte -->
        <div class="card-body">

            <!-- Texte descriptif de l'image -->
            <p class="card-text">Description image 2</p>
        </div> <!-- fin card-body -->
    </div> <!-- fin card -->
</div> <!-- fin colonne responsive -->



<div class="col-12 col-sm-6 col-md-4 col-lg-3">
<div class="card">
<img src="https://via.placeholder.com/400x200" class="card-img-top img-card" alt="Image 3">
<div class="card-body">
<p class="card-text">Description image 3</p>
</div>
</div>
</div>


<div class="col-12 col-sm-6 col-md-4 col-lg-3">
<div class="card">
<img src="https://via.placeholder.com/400x200" class="card-img-top img-card" alt="Image 4">
<div class="card-body">
<p class="card-text">Description image 4</p>
</div>
</div>
</div>
</div>



</body>
</html>
