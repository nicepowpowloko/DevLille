    <title>Base HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: white;
             background: linear-gradient(135deg, #2C3F77 0%, #A0866B 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .section {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #A0866B;
            border-left: 4px solid #A0866B;
            padding-left: 10px;
            margin-top: 0;
        }
        a {
            color: #2C3F77;
            text-decoration: none;
            display: block;
            padding: 12px;
            margin: 8px 0;
            background-color: #f8f9fa;
            border-left: 3px solid #2C3F77;
            border-radius: 5px;
            transition: all 0.2s;
        }
        a:hover {
            background-color: #e9ecef;
            padding-left: 20px;
        }
        .pdf {
            background-color: #f8f9fa;
            border-left-color:#2C3F77 ;
        }
        .retour {
            text-align: center;
            margin: 30px 0;
        }
        .retour a {
            background-color: #28a745;
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            display: inline-block;
            border: none;
        }
        .retour a:hover {
            background-color: #218838;
        }
    </style>
</head>
