        <h3>. L'IMAGE Docker - Le Template (Modèle)</h3>

        <div class="info-box">
            <div class="title"> Définition claire et précise</div>
            <p>Une <strong>IMAGE Docker</strong> est un fichier <strong>en lecture seule</strong> (immuable) qui contient TOUT ce qu'il faut pour faire tourner une application :</p>
            <ul>
                <li><strong>Un système d'exploitation de base</strong> (généralement une version ultra-légère de Linux comme Alpine, Debian Slim, Ubuntu...)</li>
                <li><strong>Un environnement d'exécution</strong> (Node.js, Python, PHP, Java, Ruby, Go...)</li>
                <li><strong>Toutes les bibliothèques et dépendances</strong> nécessaires (npm packages, pip packages, composer...)</li>
                <li><strong>Votre code d'application</strong> (tous vos fichiers .js, .py, .php...)</li>
                <li><strong>Les fichiers de configuration</strong> (nginx.conf, .env, etc.)</li>
                <li><strong>Les métadonnées</strong> (ports exposés, variables d'environnement, commande de démarrage...)</li>
            </ul>
            <p><strong>IMPORTANT :</strong> L'image est <span class="highlight">INACTIVE</span>. Elle ne fait rien toute seule. C'est juste un fichier sur votre disque dur, comme un fichier ZIP ou ISO.</p>
        </div>

        <h4>Structure en COUCHES (Layers) - Concept TRÈS important !</h4>
        
        <p>Une image Docker n'est PAS un gros fichier monolithique. C'est un <strong>empilement de couches</strong>, comme un millefeuille ou un sandwich :</p>

        <div class="code-block">
┌─────────────────────────────────────────────────┐
│   Couche 4 : Votre code JavaScript           │ ← 500 KB
│     (server.js, routes/, controllers/)          │   (Change SOUVENT)
├─────────────────────────────────────────────────┤
│   Couche 3 : node_modules                     │ ← 50 MB
│     (npm install - toutes les dépendances)      │   (Change PARFOIS)
├─────────────────────────────────────────────────┤
│   Couche 2 : Node.js v18 runtime              │ ← 100 MB
│     (Binaire Node.js + npm)                     │   (Change RAREMENT)
├─────────────────────────────────────────────────┤
│   Couche 1 : Alpine Linux (OS de base)        │ ← 5 MB
│     (Système minimal)                           │   (Change JAMAIS)
└─────────────────────────────────────────────────┘

<span class="code-comment">Caractéristiques importantes :</span>
- Chaque couche est IMMUABLE (ne change jamais)
- Les couches du bas sont PARTAGÉES entre plusieurs images
- Seules les couches modifiées sont reconstruites
        </div>

        <h3>2. Le CONTENEUR - L'Instance Vivante</h3>

        <div class="info-box">
            <div class="title">Définition claire et précise</div>
            <p>Un <strong>CONTENEUR</strong> est une <strong>instance en cours d'exécution</strong> d'une image Docker.</p>
            <p>C'est l'image qui "prend vie" et devient une <strong>application qui tourne réellement</strong> sur votre machine, avec :</p>
            <ul>
                <li>Des processus en cours d'exécution</li>
                <li>De la mémoire RAM allouée</li>
                <li>Un système de fichiers modifiable (en couche au-dessus de l'image)</li>
                <li>Une interface réseau virtuelle</li>
                <li>Des ports mappés vers l'hôte</li>
            </ul>
            <p><strong>Analogie :</strong> Si l'image est le programme d'installation, le conteneur est le programme lancé et actif en mémoire.</p>
        </div>

        <h4>Retour à l'analogie de la recette</h4>

        <div class="comparison">
            <div class="comparison-item">
                <h4>De la RECETTE au GÂTEAU</h4>
                <p><strong>Le processus :</strong></p>
                <p style="text-align: center; font-size: 1.3rem; color: #0DB7ED; font-weight: bold; margin: 1rem 0;">
                    RECETTE → (vous cuisinez) → GÂTEAU
                </p>
                <ul>
                    <li>Une recette peut faire <strong>plusieurs gâteaux</strong></li>
                    <li>Chaque gâteau est <strong>unique</strong> (même si même recette)</li>
                    <li>Vous pouvez faire <strong>10 gâteaux en même temps</strong></li>
                    <li>Si vous mangez un gâteau, <strong>la recette reste intacte</strong></li>
                    <li>Vous pouvez <strong>personnaliser</strong> chaque gâteau (glaçage différent)</li>
                    <li>Chaque gâteau prend de la place dans votre frigo</li>
                </ul>
            </div>
            <div class="comparison-item">
                <h4>De l'IMAGE au CONTENEUR</h4>
                <p><strong>Le processus :</strong></p>
                <p style="text-align: center; font-size: 1.3rem; color: #0DB7ED; font-weight: bold; margin: 1rem 0;">
                    IMAGE → (docker run) → CONTENEUR
                </p>
                <ul>
                    <li>Une image peut créer <strong>plusieurs conteneurs</strong></li>
                    <li>Chaque conteneur est <strong>indépendant</strong></li>
                    <li>Vous pouvez lancer <strong>100 conteneurs en même temps</strong></li>
                    <li>Si vous supprimez un conteneur, <strong>l'image reste intacte</strong></li>
                    <li>Vous pouvez <strong>personnaliser</strong> chaque conteneur (variables ENV)</li>
                    <li>Chaque conteneur consomme de la RAM</li>
                </ul>
            </div>
        </div>

        <h4>Cycle de vie d'un conteneur - États possibles</h4>

        <p>Un conteneur passe par plusieurs états durant sa vie :</p>

        <div class="schema">
            <div style="margin: 20px 0;">
                <div class="schema-item" style="background: #6B7280; font-size: 0.9rem;">
                    <strong>CREATED</strong><br>
                    <span style="font-size: 0.75rem;">Créé mais pas encore démarré</span>
                </div>
                <div class="schema-arrow">→ start</div>
                <div class="schema-item" style="background: #10B981; font-size: 0.9rem;">
                    <strong>RUNNING</strong><br>
                    <span style="font-size: 0.75rem;">Actif, processus en cours</span>
                </div>
                <div class="schema-arrow">→ pause</div>
                <div class="schema-item" style="background: #F59E0B; font-size: 0.9rem;">
                    <strong>PAUSED</strong><br>
                    <span style="font-size: 0.75rem;">En pause, peut reprendre</span>
                </div>
                <div class="schema-arrow">→ stop</div>
                <div class="schema-item" style="background: #EF4444; font-size: 0.9rem;">
                    <strong>STOPPED</strong><br>
                    <span style="font-size: 0.75rem;">Arrêté, peut redémarrer</span>
                </div>
            </div>
        </div>

        <h4>Commandes pratiques pour gérer les conteneurs</h4>

        <div class="code-block">
<span class="code-comment"># 1. Créer et démarrer un conteneur (état = RUNNING)</span>
docker run -d --name mon-nginx nginx:alpine

<span class="code-comment"># Options expliquées :</span>
<span class="code-comment"># -d = détaché (tourne en arrière-plan)</span>
<span class="code-comment"># --name = donner un nom au conteneur</span>
<span class="code-comment"># nginx:alpine = l'image à utiliser</span>

<span class="code-comment"># 2. Voir les conteneurs ACTIFS (RUNNING)</span>
docker ps

<span class="code-comment"># Résultat :</span>
CONTAINER ID   IMAGE          STATUS         PORTS     NAMES
abc123def456   nginx:alpine   Up 2 minutes   80/tcp    mon-nginx

<span class="code-comment"># 3. Voir TOUS les conteneurs (actifs + arrêtés)</span>
docker ps -a

<span class="code-comment"># 4. Mettre en pause (état = PAUSED)</span>
docker pause mon-nginx
<span class="code-comment"># Le conteneur est figé, mais toujours en mémoire</span>

<span class="code-comment"># 5. Reprendre (état = RUNNING)</span>
docker unpause mon-nginx

<span class="code-comment"># 6. Arrêter proprement (état = STOPPED)</span>
docker stop mon-nginx
<span class="code-comment"># Envoie SIGTERM (arrêt propre), attend 10s, puis SIGKILL si nécessaire</span>

<span class="code-comment"># 7. Redémarrer un conteneur arrêté</span>
docker start mon-nginx

<span class="code-comment"># 8. Supprimer un conteneur (doit être arrêté d'abord)</span>
docker rm mon-nginx

<span class="code-comment"># 9. Forcer la suppression (même si actif)</span>
docker rm -f mon-nginx

<span class="code-comment"># IMPORTANT : Supprimer le conteneur NE supprime PAS l'image !</span>
<span class="code-comment"># L'image nginx:alpine existe toujours sur votre disque</span>
        </div>

        <h4>IMAGE vs CONTENEUR - Tableau comparatif COMPLET</h4>

        <table>
            <thead>
                <tr>
                    <th style="width: 20%;">Critère</th>
                    <th style="width: 40%;">IMAGE</th>
                    <th style="width: 40%;">CONTENEUR</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Nature</strong></td>
                    <td>Fichier statique (template / modèle / blueprint)</td>
                    <td>Instance vivante (processus en cours d'exécution)</td>
                </tr>
                <tr>
                    <td><strong>État</strong></td>
                    <td>Inactive (dort sur le disque dur)</td>
                    <td>Active (tourne en mémoire RAM)</td>
                </tr>
                <tr>
                    <td><strong>Modification</strong></td>
                    <td>Lecture seule (immuable, ne change jamais)</td>
                    <td>Modifiable (système de fichiers temporaire en couche)</td>
                </tr>
                <tr>
                    <td><strong>Quantité</strong></td>
                    <td>1 image unique avec un ID spécifique</td>
                    <td>N conteneurs possibles (1, 10, 100, 1000...)</td>
                </tr>
                <tr>
                    <td><strong>Stockage</strong></td>
                    <td>Sur disque dur (dans /var/lib/docker/)</td>
                    <td>En mémoire RAM + disque pour logs/volumes</td>
                </tr>
                <tr>
                    <td><strong>Suppression</strong></td>
                    <td>Supprime le template (peut recréer des conteneurs ensuite)</td>
                    <td>Supprime l'instance (l'image reste intacte)</td>
                </tr>
                <tr>
                    <td><strong>Taille</strong></td>
                    <td>Taille fixe (ex: node:18-alpine = 176 MB)</td>
                    <td>Taille variable (image + données créées)</td>
                </tr>
                <tr>
                    <td><strong>Commandes</strong></td>
                    <td><code>docker images</code><br><code>docker pull</code><br><code>docker build</code><br><code>docker rmi</code></td>
                    <td><code>docker ps</code><br><code>docker run</code><br><code>docker stop</code><br><code>docker rm</code></td>
                </tr>
                <tr>
                    <td><strong>Analogie 1</strong></td>
                    <td>Recette de gâteau écrite</td>
                    <td>Gâteau cuit et prêt à manger</td>
                </tr>
                <tr>
                    <td><strong>Analogie 2</strong></td>
                    <td>Fichier d'installation (.exe, .dmg)</td>
                    <td>Programme en cours d'exécution</td>
                </tr>
            </tbody>
        </table>

        <h4>Exemple concret : 3 conteneurs depuis 1 image</h4>

        <p>Pour bien comprendre la relation 1 image → N conteneurs :</p>

<span class="code-comment"># Conteneur 2 : serveur web sur le port 8081</span>

        <h3> 3. Le REGISTRY - Le Magasin d'Images</h3>

        <div class="info-box">
            <div class="title"> Définition claire et précise</div>
            <p>Un <strong>REGISTRY</strong> (registre en français) est un <strong>dépôt centralisé qui stocke et distribue des images Docker</strong>.</p>
            <p>C'est exactement comme :</p>
            <ul>
                <li><strong>GitHub / GitLab</strong> pour le code source</li>
                <li><strong>App Store / Google Play</strong> pour les applications mobiles</li>
                <li><strong>npm</strong> (npmjs.com) pour les packages JavaScript</li>
                <li><strong>PyPI</strong> (pypi.org) pour les packages Python</li>
                <li><strong>Packagist</strong> pour les packages PHP Composer</li>
            </ul>
        </div>

// CODE JAVASCRIPT DE NAVIGATION
let currentModuleIndex = 0;

function generateNavigation() {
    const navContent = document.getElementById('navContent');
    navContent.innerHTML = '';
    
    modulesData.forEach((module, index) => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn' + (index === 0 ? ' active' : '');
        btn.textContent = module.id + '. ' + module.title;
        btn.onclick = () => showModule(index);
        navContent.appendChild(btn);
    });
}

function showModule(index) {
    currentModuleIndex = index;
    
    document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
    });
    
    const moduleContainer = document.getElementById('moduleContainer');
    let moduleElement = document.querySelector('[data-module-id="' + modulesData[index].id + '"]');
    
    if (!moduleElement) {
        moduleElement = document.createElement('div');
        moduleElement.className = 'module';
        moduleElement.setAttribute('data-module-id', modulesData[index].id);
        
        const prevDisabled = index === 0 ? 'disabled' : '';
        const nextDisabled = index === modulesData.length - 1 ? 'disabled' : '';
        
        moduleElement.innerHTML = '<h2>' + modulesData[index].id + '. ' + modulesData[index].title + '</h2>' +
            modulesData[index].content +
            '<div class="nav-buttons">' +
            '<button class="btn" onclick="previousModule()" ' + prevDisabled + '>← Module précédent</button>' +
            '<button class="btn" onclick="nextModule()" ' + nextDisabled + '>Module suivant →</button>' +
            '</div>';
        
        moduleContainer.appendChild(moduleElement);
    }
    
    moduleElement.classList.add('active');
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextModule() {
    if (currentModuleIndex < modulesData.length - 1) {
        showModule(currentModuleIndex + 1);
    }
}

function previousModule() {
    if (currentModuleIndex > 0) {
        showModule(currentModuleIndex - 1);
    }
}

function updateProgress() {
    const progress = ((currentModuleIndex + 1) / modulesData.length) * 100;
    document.getElementById('progressBar').style.width = progress + '%';
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Formation Docker chargée - ' + modulesData.length + ' modules');
    generateNavigation();
    showModule(0);
});
</script>
