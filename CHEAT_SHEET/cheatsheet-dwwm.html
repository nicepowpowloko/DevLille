\n    \u003cli className=\"card\"\u003e\n      \u003ch3\u003e{product.nom}\u003c/h3\u003e\n      \u003cp\u003e{product.prix} €\u003c/p\u003e\n      \u003cspan className={product.stock \u003e 0 ? \"badge-ok\" : \"badge-ko\"}\u003e\n        {product.stock \u003e 0 ? \"Disponible\" : \"Rupture\"}\n      \u003c/span\u003e\n    \u003c/li\u003e\n  );\n});"}, {"lang": "react", "cat": "Formulaires", "title": "Formulaires contrôlés", "desc": "Chaque champ lié à un état React. Handler générique avec e.target.name pour les formulaires multi-champs.", "code": "import { useState } from \"react\";\n\nfunction RegisterForm({ onSubmit }) {\n  const [form, setForm] = useState({\n    nom: \"\", email: \"\", mdp: \"\", role: \"user\"\n  });\n  const [errors, setErrors] = useState({});\n  const [loading, setLoading] = useState(false);\n\n  const handleChange = ({ target: { name, value, type, checked } }) =\u003e {\n    setForm(prev =\u003e ({\n      ...prev,\n      [name]: type === \"checkbox\" ? checked : value\n    }));\n    if (errors[name]) setErrors(prev =\u003e ({ ...prev, [name]: null }));\n  };\n\n  const validate = () =\u003e {\n    const errs = {};\n    if (!form.nom.trim())             errs.nom   = \"Nom requis\";\n    if (!/\\S+@\\S+/.test(form.email)) errs.email = \"Email invalide\";\n    if (form.mdp.length \u003c 8)         errs.mdp   = \"Min. 8 caractères\";\n    return errs;\n  };\n\n  const handleSubmit = async (e) =\u003e {\n    e.preventDefault();\n    const errs = validate();\n    if (Object.keys(errs).length) { setErrors(errs); return; }\n    setLoading(true);\n    try { await onSubmit(form); }\n    finally { setLoading(false); }\n  };\n\n  return (\n    \u003cform onSubmit={handleSubmit} noValidate\u003e\n      \u003clabel htmlFor=\"nom\"\u003eNom\u003c/label\u003e\n      \u003cinput id=\"nom\" name=\"nom\" value={form.nom}\n             onChange={handleChange}\n             aria-invalid={!!errors.nom}/\u003e\n      {errors.nom \u0026\u0026 \u003cspan role=\"alert\"\u003e{errors.nom}\u003c/span\u003e}\n\n      \u003cbutton type=\"submit\" disabled={loading}\u003e\n        {loading ? \"Envoi…\" : \"S'inscrire\"}\n      \u003c/button\u003e\n    \u003c/form\u003e\n  );\n}"}, {"lang": "react", "cat": "Router", "title": "React Router v6", "desc": "BrowserRouter + Routes/Route pour les pages. Outlet pour les layouts. PrivateRoute pour les routes protégées.", "code": "import {\n  BrowserRouter, Routes, Route, NavLink,\n  useParams, useNavigate, useLocation,\n  Navigate, Outlet\n} from \"react-router-dom\";\n\nfunction App() {\n  return (\n    \u003cBrowserRouter\u003e\n      \u003cRoutes\u003e\n        \u003cRoute path=\"/\" element={\u003cLayout/\u003e}\u003e\n          \u003cRoute index           element={\u003cHome/\u003e}/\u003e\n          \u003cRoute path=\"users\"    element={\u003cUserList/\u003e}/\u003e\n          \u003cRoute path=\"users/:id\" element={\u003cUserDetail/\u003e}/\u003e\n          \u003cRoute path=\"admin\"    element={\n            \u003cPrivateRoute roles={[\"admin\"]}\u003e\n              \u003cAdminPanel/\u003e\n            \u003c/PrivateRoute\u003e\n          }/\u003e\n          \u003cRoute path=\"*\"        element={\u003cNotFound/\u003e}/\u003e\n        \u003c/Route\u003e\n      \u003c/Routes\u003e\n    \u003c/BrowserRouter\u003e\n  );\n}\n\nfunction Layout() {\n  return (\n    \u003cdiv\u003e\n      \u003cnav\u003e\n        \u003cNavLink to=\"/\" end\u003eAccueil\u003c/NavLink\u003e\n        \u003cNavLink to=\"/users\"\u003eUtilisateurs\u003c/NavLink\u003e\n      \u003c/nav\u003e\n      \u003cmain\u003e\u003cOutlet/\u003e\u003c/main\u003e\n    \u003c/div\u003e\n  );\n}\n\nfunction UserDetail() {\n  const { id }   = useParams();\n  const navigate = useNavigate();\n  const { state } = useLocation();\n  return \u003cbutton onClick={() =\u003e navigate(-1)}\u003eRetour\u003c/button\u003e;\n}\n\nfunction PrivateRoute({ children, roles }) {\n  const { user } = useAuth();\n  if (!user) return \u003cNavigate to=\"/login\" replace/\u003e;\n  if (roles \u0026\u0026 !roles.includes(user.role))\n    return \u003cNavigate to=\"/403\" replace/\u003e;\n  return children;\n}"}, {"lang": "react", "cat": "Hooks", "title": "Custom Hooks", "desc": "Un hook (préfixe use) encapsule la logique réutilisable. Il peut retourner état, fonctions, refs...", "code": "import { useState, useEffect, useCallback, useRef } from \"react\";\n\n// useFetch\nfunction useFetch(url) {\n  const [data,    setData]    = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error,   setError]   = useState(null);\n  const refetch = useCallback(async () =\u003e {\n    setLoading(true); setError(null);\n    try {\n      const res = await fetch(url);\n      if (!res.ok) throw new Error(`HTTP ${res.status}`);\n      setData(await res.json());\n    } catch (e) { setError(e.message); }\n    finally { setLoading(false); }\n  }, [url]);\n  useEffect(() =\u003e { refetch(); }, [refetch]);\n  return { data, loading, error, refetch };\n}\n\n// useLocalStorage\nfunction useLocalStorage(key, defaultVal) {\n  const [value, setValue] = useState(() =\u003e {\n    try { return JSON.parse(localStorage.getItem(key) ?? \"null\") ?? defaultVal; }\n    catch { return defaultVal; }\n  });\n  const set = useCallback((val) =\u003e {\n    const next = val instanceof Function ? val(value) : val;\n    setValue(next);\n    localStorage.setItem(key, JSON.stringify(next));\n  }, [key, value]);\n  return [value, set];\n}\n\n// useDebounce\nfunction useDebounce(value, delay = 300) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() =\u003e {\n    const t = setTimeout(() =\u003e setDebounced(value), delay);\n    return () =\u003e clearTimeout(t);\n  }, [value, delay]);\n  return debounced;\n}\n\n// useClickOutside\nfunction useClickOutside(callback) {\n  const ref = useRef(null);\n  useEffect(() =\u003e {\n    const h = (e) =\u003e {\n      if (ref.current \u0026\u0026 !ref.current.contains(e.target))\n        callback();\n    };\n    document.addEventListener(\"mousedown\", h);\n    return () =\u003e document.removeEventListener(\"mousedown\", h);\n  }, [callback]);\n  return ref;\n}"}, {"lang": "react", "cat": "Avancé", "title": "Portails \u0026 Lazy Loading", "desc": "createPortal monte un composant dans un autre nœud DOM. React.lazy + Suspense = chargement à la demande.", "code": "import { lazy, Suspense } from \"react\";\nimport { createPortal } from \"react-dom\";\n\n// ── Lazy Loading ──\nconst Dashboard   = lazy(() =\u003e import(\"./pages/Dashboard\"));\nconst UserProfile = lazy(() =\u003e import(\"./pages/UserProfile\"));\n\nfunction App() {\n  return (\n    \u003cSuspense fallback={\u003cSpinner/\u003e}\u003e\n      \u003cRoutes\u003e\n        \u003cRoute path=\"/dashboard\"  element={\u003cDashboard/\u003e}/\u003e\n        \u003cRoute path=\"/users/:id\"  element={\u003cUserProfile/\u003e}/\u003e\n      \u003c/Routes\u003e\n    \u003c/Suspense\u003e\n  );\n}\n\n// ── Portail (modal dans \u003cbody\u003e) ──\nfunction Modal({ isOpen, onClose, title, children }) {\n  useEffect(() =\u003e {\n    if (!isOpen) return;\n    const close = (e) =\u003e e.key === \"Escape\" \u0026\u0026 onClose();\n    document.addEventListener(\"keydown\", close);\n    document.body.style.overflow = \"hidden\";\n    return () =\u003e {\n      document.removeEventListener(\"keydown\", close);\n      document.body.style.overflow = \"\";\n    };\n  }, [isOpen, onClose]);\n\n  if (!isOpen) return null;\n\n  return createPortal(\n    \u003cdiv className=\"modal-backdrop\" onClick={onClose}\u003e\n      \u003cdiv className=\"modal-box\"\n           onClick={e =\u003e e.stopPropagation()}\n           role=\"dialog\" aria-modal aria-labelledby=\"modal-title\"\u003e\n        \u003ch2 id=\"modal-title\"\u003e{title}\u003c/h2\u003e\n        \u003cbutton onClick={onClose} aria-label=\"Fermer\"\u003e✕\u003c/button\u003e\n        {children}\n      \u003c/div\u003e\n    \u003c/div\u003e,\n    document.body\n  );\n}"}, {"lang": "git", "cat": "Bases", "title": "Configuration \u0026 Init", "desc": "--global s'applique à tous les dépôts. Ces infos apparaissent dans chaque commit.", "code": "# Identité (obligatoire)\ngit config --global user.name  \"Prénom Nom\"\ngit config --global user.email \"email@exemple.fr\"\n\n# Éditeur et outils\ngit config --global core.editor \"code --wait\"\ngit config --global merge.tool vscode\n\n# Comportement\ngit config --global color.ui auto\ngit config --global pull.rebase false   # merge (défaut)\ngit config --global init.defaultBranch main\n\n# Alias utiles\ngit config --global alias.lg \\\n  \"log --oneline --graph --all --decorate\"\ngit config --global alias.st  \"status -s\"\ngit config --global alias.undo \"reset HEAD~1 --mixed\"\n\n# Voir la config\ngit config --list\ngit config user.email\n\n# Initialiser\ngit init\ngit init --initial-branch=main\n\n# Cloner\ngit clone https://github.com/user/repo.git\ngit clone https://github.com/user/repo.git dossier\ngit clone --depth=1 https://github.com/user/repo.git  # shallow"}, {"lang": "git", "cat": "Workflow", "title": "Workflow quotidien", "desc": "Status → add → commit. Chaque commit doit être atomique. git diff --staged avant de commiter.", "code": "# État\ngit status            # fichiers modifiés\ngit status -s         # compact\ngit diff              # diff non stagé\ngit diff --staged     # diff stagé\ngit diff HEAD         # tous les changements\n\n# Stage\ngit add fichier.js    # un fichier\ngit add src/          # un dossier\ngit add .             # tout\ngit add -p            # interactif (hunk par hunk)\ngit add -u            # fichiers suivis seulement\n\n# Déstaguer\ngit restore --staged fichier.js\ngit restore --staged .\n\n# Commit\ngit commit -m \"feat: ajout formulaire contact\"\ngit commit             # ouvre l'éditeur\ngit commit -am \"fix\"   # add (suivis) + commit\n\n# Historique\ngit log --oneline\ngit log --oneline --graph --all\ngit log --oneline -20\ngit log --author=\"Alice\" --since=\"1 week ago\"\ngit log --grep=\"feat\"\ngit log -p fichier.js  # diff par commit\ngit show HEAD          # dernier commit\ngit show abc1234       # commit précis"}, {"lang": "git", "cat": "Branches", "title": "Branches \u0026 Merge", "desc": "Une branche par feature. git switch (moderne) remplace git checkout. --no-ff conserve l'historique.", "code": "# Créer et basculer\ngit switch -c feature/login    # créer + basculer\ngit switch main                # basculer\ngit switch -                   # branche précédente\ngit branch nouvelle-branche    # créer sans basculer\n\n# Lister\ngit branch                     # locales\ngit branch -a                  # toutes + distantes\ngit branch -v                  # avec dernier commit\ngit branch --merged            # déjà mergées\n\n# Fusionner\ngit switch main\ngit merge feature/login\ngit merge --no-ff feature/login     # conserve historique\ngit merge --squash feature/login    # 1 seul commit\n\n# Résoudre un conflit\ngit status                     # voir les fichiers en conflit\n# Éditer les fichiers (\u003c\u003c\u003c\u003c  ====  \u003e\u003e\u003e\u003e)\ngit add fichier_resolu.js\ngit commit -m \"merge: feature/login\"\n\n# Rebase\ngit switch feature/login\ngit rebase main                # rejouer commits sur main\ngit rebase -i HEAD~3           # interactif\n\n# Supprimer\ngit branch -d feature/login    # si mergée\ngit branch -D feature/login    # forcer\ngit push origin --delete feature/login"}, {"lang": "git", "cat": "Remote", "title": "Dépôts distants", "desc": "origin = remote conventionnel. -u = définir l'upstream. Toujours pull --rebase avant de push.", "code": "# Gérer les remotes\ngit remote add origin https://github.com/user/repo.git\ngit remote -v\ngit remote set-url origin nouvelle-url\ngit remote remove origin\n\n# Premier push\ngit push -u origin main           # -u = définir upstream\n\n# Push / Pull courants\ngit push\ngit push origin feature/login\ngit push --force-with-lease       # force SÉCURISÉ\ngit pull\ngit pull --rebase\ngit fetch                         # récupérer sans merger\ngit fetch --prune                 # supprimer branches mortes\n\n# Synchroniser un fork\ngit remote add upstream https://github.com/original/repo.git\ngit fetch upstream\ngit merge upstream/main\n\n# Tags\ngit tag v1.0.0\ngit tag -a v1.0.0 -m \"Release 1.0\"\ngit push origin v1.0.0\ngit push origin --tags\ngit tag -d v1.0.0\ngit push origin --delete v1.0.0"}, {"lang": "git", "cat": "Corrections", "title": "Annuler \u0026 Corriger", "desc": "revert = sûr (crée un commit). reset = dangereux si déjà pushé. stash = mettre de côté temporairement.", "code": "# Annuler les modifications\ngit restore fichier.js             # discard modifs non stagées\ngit restore .\ngit restore --staged fichier.js    # déstaguer\n\n# Corriger le dernier commit\ngit commit --amend -m \"nouveau message\"\ngit commit --amend --no-edit       # ajouter des fichiers oubliés\n\n# Revert (SÛUR — crée un commit)\ngit revert HEAD\ngit revert HEAD~3..HEAD\ngit revert abc1234\n\n# Reset (DANGEREUX si pushé)\ngit reset --soft  HEAD~1  # défait commit → staged\ngit reset --mixed HEAD~1  # défait commit → untracked\ngit reset --hard  HEAD~1  # défait TOUT (perd les modifs)\ngit reset --hard origin/main\n\n# Stash\ngit stash                          # mettre de côté\ngit stash push -m \"wip: login\"    # avec description\ngit stash list\ngit stash pop                      # appliquer + supprimer\ngit stash apply stash@{1}          # appliquer sans supprimer\ngit stash drop stash@{1}\ngit stash clear\n\n# Cherry-pick\ngit cherry-pick abc1234\ngit cherry-pick abc1234..def5678"}, {"lang": ".gitignore", "cat": "Fichiers", "title": ".gitignore \u0026 Nettoyage", "desc": "Créer le .gitignore avant le 1er commit. gitignore.io génère des templates complets.", "code": "# ── .gitignore ──\n\n# Dépendances\nnode_modules/\nvendor/\n\n# Variables d'environnement — JAMAIS commiter !\n.env\n.env.local\n.env.*.local\n\n# Build\ndist/\nbuild/\n.next/   .nuxt/   .svelte-kit/\n*.min.js   *.min.css\n\n# OS\n.DS_Store\nThumbs.db   desktop.ini\n\n# IDE\n.vscode/settings.json\n.idea/   *.swp   *.swo\n\n# Logs\nlogs/   *.log   npm-debug.log*\n\n# Caches\n.cache/   .parcel-cache/   .eslintcache\n\n# Exception (forcer le suivi)\n!.env.example\n!.gitkeep\n\n# ── Déboguer ──\ngit check-ignore -v fichier.js\ngit ls-files --others --ignored --exclude-standard\n\n# ── Nettoyer ──\ngit rm --cached fichier.js\ngit rm --cached -r node_modules/\ngit clean -fd           # supprimer non-suivis\ngit clean -fdx          # + ignorés (DANGER)"}, {"lang": "git", "cat": "Convention", "title": "Convention Commits \u0026 Semver", "desc": "Commits conventionnels permettent de générer des CHANGELOG et de versionner automatiquement.", "code": "# Format : type(scope): description (max 72 chars)\n# [corps optionnel]\n# [pied optionnel]\n\n# Types\nfeat:     # nouvelle fonctionnalité → MINOR (1.x.0)\nfix:      # correction de bug → PATCH (1.0.x)\ndocs:     # documentation\nstyle:    # formatage, espaces (0 logique)\nrefactor: # ni fix ni feat\nperf:     # amélioration performance\ntest:     # ajout/correction tests\nbuild:    # build, dépendances\nci:       # configuration CI/CD\nchore:    # maintenance\nrevert:   # annulation\n\n# Exemples\ngit commit -m \"feat(auth): ajout authentification JWT\"\ngit commit -m \"fix(ui): bouton désactivé après clic\"\ngit commit -m \"docs(readme): ajout section installation\"\n\n# Commit complet avec corps\ngit commit -m \"feat(api): endpoint création utilisateur\n\nAjoute POST /api/users avec validation Zod.\nEnvoi email de bienvenue via Resend.\n\nCloses #42\nReviewed-by: Alice\"\n\n# Breaking change (→ MAJOR x.0.0)\ngit commit -m \"feat!: suppression /api/v1\n\nBREAKING CHANGE: utiliser /api/v2\"\n\n# Scopes courants : auth, ui, api, db, config, ci"}, {"lang": "git", "cat": "Avancé", "title": "Git avancé — Outils utiles", "desc": "git bisect trouve le commit bugué. git stash drop nettoie. git reflog récupère après un reset.", "code": "# ── Recherche dans l'historique ──\ngit log -S \"function maFonction\"   # commits ajoutant/supprimant\ngit log --grep=\"JIRA-42\"           # par message\ngit log --all --full-history -- fichier.js  # fichier supprimé\ngit blame fichier.js               # qui a écrit quoi\n\n# ── Bisect (trouver le commit bugué) ──\ngit bisect start\ngit bisect bad                     # commit actuel = bugué\ngit bisect good v1.0.0             # ce tag = OK\n# Git checkout un commit entre les deux\n# Tester, puis :\ngit bisect good  # ou git bisect bad\n# Répéter jusqu'à trouver\ngit bisect reset\n\n# ── Reflog (récupérer après erreur) ──\ngit reflog                         # historique des HEAD\ngit reset --hard HEAD@{3}          # restaurer un état précédent\n\n# ── Sous-modules ──\ngit submodule add https://github.com/... libs/nom\ngit submodule update --init --recursive\ngit submodule foreach git pull\n\n# ── Worktree (plusieurs branches en même temps) ──\ngit worktree add ../hotfix hotfix/bug-critique\ngit worktree list\ngit worktree remove ../hotfix\n\n# ── Hooks Git (scripts auto) ──\n# .git/hooks/pre-commit (chmod +x)\n#!/bin/sh\nnpm run lint \u0026\u0026 npm run test\nexit $?\n\n# ── Archive ──\ngit archive --format=zip HEAD \u003e release.zip"}, {"lang": "mysql", "cat": "Structure", "title": "Créer BDD \u0026 Tables", "desc": "Toujours utf8mb4. AUTO_INCREMENT pour les IDs. ON UPDATE CURRENT_TIMESTAMP = audit automatique.", "code": "-- Base de données\nCREATE DATABASE IF NOT EXISTS mabase\n  CHARACTER SET utf8mb4\n  COLLATE utf8mb4_unicode_ci;\n\nUSE mabase;\n\n-- Table utilisateurs\nCREATE TABLE users (\n  id         INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  nom        VARCHAR(100)  NOT NULL,\n  email      VARCHAR(255)  NOT NULL UNIQUE,\n  mdp        VARCHAR(255)  NOT NULL,\n  role       ENUM(\"user\",\"editor\",\"admin\") DEFAULT \"user\",\n  actif      BOOLEAN       DEFAULT 1,\n  created_at TIMESTAMP     DEFAULT CURRENT_TIMESTAMP,\n  updated_at TIMESTAMP     DEFAULT CURRENT_TIMESTAMP\n                          ON UPDATE CURRENT_TIMESTAMP,\n  INDEX idx_email (email),\n  INDEX idx_role  (role)\n);\n\n-- Modifier une table\nALTER TABLE users ADD    COLUMN phone VARCHAR(20) AFTER email;\nALTER TABLE users MODIFY COLUMN nom   VARCHAR(150) NOT NULL;\nALTER TABLE users CHANGE COLUMN nom full_name VARCHAR(150);\nALTER TABLE users DROP   COLUMN phone;\n\n-- Infos\nSHOW TABLES;\nDESC users;\nSHOW CREATE TABLE users;\nSHOW INDEX FROM users;"}, {"lang": "mysql", "cat": "CRUD", "title": "INSERT, UPDATE, DELETE", "desc": "TOUJOURS WHERE dans UPDATE et DELETE. LIMIT 1 en sécurité. INSERT ON DUPLICATE KEY pour l'upsert.", "code": "-- INSERT simple\nINSERT INTO users (nom, email, mdp)\nVALUES (\"Alice\", \"alice@ex.fr\", \"hash\");\n\n-- INSERT multi-lignes\nINSERT INTO users (nom, email, mdp) VALUES\n  (\"Bob\",   \"bob@ex.fr\",   \"hash1\"),\n  (\"Carol\", \"carol@ex.fr\", \"hash2\");\n\n-- UPSERT\nINSERT INTO compteurs (cle, valeur) VALUES (\"vues\", 1)\n  ON DUPLICATE KEY UPDATE valeur = valeur + 1;\n\n-- INSERT depuis SELECT\nINSERT INTO archive SELECT * FROM users WHERE actif = 0;\n\n-- UPDATE — TOUJOURS avec WHERE !\nUPDATE users\nSET   actif = 0,\n      role  = \"editor\"\nWHERE id = 42\nLIMIT 1;\n\n-- Soft delete (recommandé en prod)\nALTER TABLE users ADD COLUMN deleted_at TIMESTAMP NULL;\nUPDATE users SET deleted_at = NOW() WHERE id = 42;\nSELECT * FROM users WHERE deleted_at IS NULL;\n\n-- DELETE — TOUJOURS avec WHERE !\nDELETE FROM users WHERE id = 42 LIMIT 1;\n\n-- Vider (IRRÉVERSIBLE)\nTRUNCATE TABLE logs;"}, {"lang": "mysql", "cat": "SELECT", "title": "SELECT, Filtres \u0026 Pagination", "desc": "WHERE filtre, ORDER BY trie, LIMIT+OFFSET pagine. DISTINCT dédoublonne. LIKE % = tout, _ = 1 char.", "code": "-- Sélection\nSELECT id, nom, email FROM users;\nSELECT * FROM users;\nSELECT DISTINCT role FROM users;\n\n-- Alias\nSELECT nom AS name, email AS mail FROM users;\nSELECT CONCAT(nom, \" \u003c\", email, \"\u003e\") AS identite FROM users;\n\n-- WHERE\nWHERE role = \"admin\"\nWHERE age \u003e= 18 AND actif = 1\nWHERE role IN (\"admin\", \"editor\")\nWHERE role NOT IN (\"user\")\nWHERE nom LIKE \"Ali%\"         -- commence par Ali\nWHERE nom LIKE \"%ice\"         -- finit par ice\nWHERE email IS NOT NULL\nWHERE age BETWEEN 18 AND 65\nWHERE created_at \u003e= \"2024-01-01\"\nWHERE created_at BETWEEN \"2024-01-01\" AND \"2024-12-31\"\nWHERE nom REGEXP \"^[A-Z]\"\n\n-- Tri\nORDER BY nom ASC\nORDER BY created_at DESC, nom ASC\nORDER BY FIELD(role, \"admin\",\"editor\",\"user\")\n\n-- Pagination\nLIMIT 10\nLIMIT 10 OFFSET 20        -- page 3 (10/page)\n\n-- Exemple complet\nSELECT id, nom, email, role\nFROM   users\nWHERE  actif = 1\n  AND  deleted_at IS NULL\n  AND  created_at \u003e= DATE_SUB(NOW(), INTERVAL 30 DAY)\nORDER BY nom ASC\nLIMIT 10 OFFSET 0;"}, {"lang": "mysql", "cat": "SELECT", "title": "Agrégation \u0026 GROUP BY", "desc": "HAVING filtre après GROUP BY (contrairement à WHERE). GROUP_CONCAT combine les valeurs en string.", "code": "-- Agrégations\nSELECT COUNT(*)              AS total    FROM users;\nSELECT COUNT(DISTINCT role)  AS nb_roles FROM users;\nSELECT AVG(prix)             AS moyenne  FROM produits;\nSELECT SUM(prix * qte)       AS chiffre  FROM lignes;\nSELECT MIN(prix), MAX(prix)              FROM produits;\nSELECT GROUP_CONCAT(nom ORDER BY nom SEPARATOR \", \") AS liste\n  FROM users;\n\n-- GROUP BY simple\nSELECT   role, COUNT(*) AS nb\nFROM     users\nGROUP BY role\nORDER BY nb DESC;\n\n-- GROUP BY multi-colonnes\nSELECT   YEAR(created_at)  AS annee,\n         MONTH(created_at) AS mois,\n         COUNT(*)          AS nb,\n         SUM(montant)      AS total\nFROM     ventes\nGROUP BY annee, mois\nORDER BY annee, mois;\n\n-- HAVING (filtre sur les groupes)\nSELECT   categorie,\n         COUNT(*)  AS nb,\n         AVG(prix) AS prix_moyen\nFROM     produits\nWHERE    actif = 1             -- avant GROUP BY\nGROUP BY categorie\nHAVING   nb \u003e 5                -- après GROUP BY\n  AND    prix_moyen \u003c 100\nORDER BY prix_moyen ASC;\n\n-- ROLLUP (sous-totaux)\nSELECT   role, COUNT(*) AS nb\nFROM     users\nGROUP BY role WITH ROLLUP;"}, {"lang": "mysql", "cat": "Jointures", "title": "JOINs — Types et exemples", "desc": "INNER JOIN = intersection. LEFT JOIN = tout à gauche. Self JOIN = table jointe à elle-même.", "code": "-- Tables exemples :\n-- users(id, nom, email)\n-- commandes(id, user_id, montant, date)\n-- produits(id, libelle, prix, categorie_id)\n\n-- INNER JOIN\nSELECT u.nom, c.date, c.montant\nFROM       users     u\nINNER JOIN commandes c ON c.user_id = u.id\nWHERE c.date \u003e= \"2024-01-01\"\nORDER BY c.date DESC;\n\n-- LEFT JOIN (tous les users, même sans commande)\nSELECT u.nom,\n       COUNT(c.id)   AS nb_commandes,\n       SUM(c.montant) AS total\nFROM      users     u\nLEFT JOIN commandes c ON c.user_id = u.id\nGROUP BY u.id, u.nom\nORDER BY total DESC;\n\n-- 3 tables\nSELECT u.nom, c.date, p.libelle, p.prix\nFROM       users     u\nINNER JOIN commandes c ON c.user_id    = u.id\nINNER JOIN produits  p ON c.produit_id = p.id;\n\n-- Self JOIN (hiérarchie)\nSELECT e.nom AS employe, m.nom AS manager\nFROM   employes e\nLEFT JOIN employes m ON m.id = e.manager_id;\n\n-- USING (noms de colonnes identiques)\nSELECT u.nom, c.date\nFROM users u\nJOIN commandes c USING (id);"}, {"lang": "mysql", "cat": "Structure", "title": "Clés étrangères \u0026 Contraintes", "desc": "FK assurent l'intégrité. ON DELETE CASCADE : supprime les enfants. ON DELETE SET NULL : met à NULL.", "code": "CREATE TABLE articles (\n  id           INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  titre        VARCHAR(255) NOT NULL,\n  contenu      TEXT,\n  slug         VARCHAR(255) NOT NULL UNIQUE,\n  user_id      INT UNSIGNED NOT NULL,\n  categorie_id INT UNSIGNED,\n  published    BOOLEAN DEFAULT 0,\n  created_at   TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n\n  FOREIGN KEY (user_id)\n    REFERENCES users(id)\n    ON DELETE CASCADE,       -- supprime les articles si user supprimé\n    -- ON DELETE RESTRICT    -- interdit la suppression du user\n    -- ON DELETE SET NULL    -- met user_id à NULL\n\n  FOREIGN KEY (categorie_id)\n    REFERENCES categories(id)\n    ON DELETE SET NULL\n    ON UPDATE CASCADE,\n\n  INDEX idx_user_id       (user_id),\n  INDEX idx_categorie_id  (categorie_id),\n  INDEX idx_published     (published, created_at)\n);\n\n-- CHECK (MySQL 8.0.16+)\nCREATE TABLE produits (\n  id    INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,\n  sku   VARCHAR(50) NOT NULL UNIQUE,\n  prix  DECIMAL(10,2) CHECK (prix \u003e= 0),\n  stock INT DEFAULT 0 CHECK (stock \u003e= 0)\n);"}, {"lang": "mysql", "cat": "SELECT", "title": "Sous-requêtes, CTE \u0026 Vues", "desc": "CTE = WITH = requête nommée temporaire. EXISTS \u003e IN pour les grands ensembles. Vue = requête sauvegardée.", "code": "-- Sous-requête scalaire\nSELECT nom, prix,\n  prix - (SELECT AVG(prix) FROM produits) AS ecart\nFROM produits\nWHERE prix \u003e (SELECT AVG(prix) FROM produits);\n\n-- EXISTS (performant)\nSELECT * FROM users u\nWHERE EXISTS (\n  SELECT 1 FROM commandes c\n  WHERE c.user_id = u.id\n    AND c.date \u003e= \"2024-01-01\"\n);\n\n-- CTE (MySQL 8+)\nWITH clients_actifs AS (\n  SELECT user_id,\n         COUNT(*)     AS nb,\n         SUM(montant) AS total\n  FROM commandes\n  WHERE date \u003e= DATE_SUB(NOW(), INTERVAL 1 YEAR)\n  GROUP BY user_id\n),\ntop_clients AS (\n  SELECT * FROM clients_actifs WHERE total \u003e 1000\n)\nSELECT u.nom, c.total\nFROM users u\nJOIN top_clients c ON c.user_id = u.id\nORDER BY c.total DESC;\n\n-- Vues\nCREATE OR REPLACE VIEW v_users_actifs AS\n  SELECT id, nom, email, role\n  FROM users\n  WHERE actif = 1 AND deleted_at IS NULL;\n\nSELECT * FROM v_users_actifs WHERE role = \"admin\";\n\nDROP VIEW IF EXISTS v_users_actifs;"}, {"lang": "mysql", "cat": "SELECT", "title": "Fonctions SQL utiles", "desc": "DATE_FORMAT, CONCAT, IFNULL, CASE WHEN pour transformer les données directement dans la requête.", "code": "-- Chaînes\nCONCAT(prenom, \" \", nom)\nUPPER(nom)   LOWER(email)\nLENGTH(\"Bonjour\")           -- 7 octets\nCHAR_LENGTH(\"Bonjour\")      -- 7 caractères\nSUBSTRING(texte, 1, 100)\nTRIM(\" texte \")\nREPLACE(col, \"a\", \"b\")\nLPAD(id, 5, \"0\")            -- \"00042\"\n\n-- Dates\nNOW()                       -- 2024-06-15 14:30:00\nCURDATE()                   -- 2024-06-15\nYEAR(d)   MONTH(d)   DAY(d)\nDATE_FORMAT(d, \"%d/%m/%Y\")\nDATE_FORMAT(d, \"%d %M %Y\")\nDATEDIFF(NOW(), created_at) AS jours\nDATE_ADD(NOW(), INTERVAL 7 DAY)\nDATE_SUB(NOW(), INTERVAL 1 MONTH)\nTIMESTAMPDIFF(YEAR, naissance, NOW()) AS age\n\n-- NULL\nIFNULL(phone, \"N/A\")\nCOALESCE(a, b, c, \"défaut\")  -- premier non-NULL\nNULLIF(score, 0)              -- NULL si égal\n\n-- Conditionnels\nSELECT nom,\n  CASE\n    WHEN prix \u003e 100 THEN \"Premium\"\n    WHEN prix \u003e 50  THEN \"Standard\"\n    ELSE \"Économique\"\n  END AS gamme,\n  IF(stock \u003e 0, \"Dispo\", \"Rupture\") AS statut\nFROM produits;"}, {"lang": "mysql", "cat": "Avancé", "title": "Index \u0026 EXPLAIN", "desc": "Les index accélèrent SELECT mais ralentissent INSERT/UPDATE. Toujours EXPLAIN avant d'optimiser.", "code": "-- Créer des index\nCREATE INDEX idx_nom ON users (nom);\nCREATE UNIQUE INDEX idx_email ON users (email);\n\n-- Index composite (ordre des colonnes crucial !)\nCREATE INDEX idx_role_date ON users (role, created_at);\n-- ✓ WHERE role = ? ORDER BY created_at\n-- ✗ WHERE created_at = ? (sans role = pas utilisé)\n\n-- Index sur partie de colonne\nCREATE INDEX idx_titre ON articles (titre(50));\n\n-- Lister / Supprimer\nSHOW INDEX FROM users;\nDROP INDEX idx_nom ON users;\n\n-- EXPLAIN — analyser une requête\nEXPLAIN SELECT * FROM users WHERE email = \"a@b.fr\";\n-- type=const → index utilisé ✓\n-- type=ALL   → full table scan ✗ (problème de perf)\n\nEXPLAIN ANALYZE  -- MySQL 8 : exécution réelle\n  SELECT u.nom, COUNT(c.id)\n  FROM users u LEFT JOIN commandes c ON c.user_id = u.id\n  GROUP BY u.id;\n\n-- Bonnes pratiques\n-- ✓ Indexer les colonnes utilisées dans WHERE, JOIN, ORDER BY\n-- ✓ Colonnes NOT NULL = index plus efficace\n-- ✗ Éviter les fonctions sur colonnes indexées dans WHERE\n--    WHERE YEAR(created_at) = 2024         → pas d'index\n--    WHERE created_at BETWEEN ... AND ...  → index utilisé\n-- ✗ Éviter SELECT * (spécifier les colonnes)\n-- ✓ Utiliser LIMIT sur les grandes tables"}, {"lang": "mysql", "cat": "Avancé", "title": "Transactions \u0026 Procédures", "desc": "BEGIN...COMMIT pour les opérations atomiques. ROLLBACK annule tout. Procédures pour encapsuler la logique.", "code": "-- Transaction\nSTART TRANSACTION;\n\n  INSERT INTO commandes (user_id, total)\n  VALUES (42, 150.00);\n  SET @cmd_id = LAST_INSERT_ID();\n\n  UPDATE produits\n  SET stock = stock - 2\n  WHERE id = 7 AND stock \u003e= 2;\n\n  -- Vérifier que le stock était suffisant\n  SET @rows = ROW_COUNT();\nCOMMIT;  -- ou ROLLBACK si @rows = 0\n\n-- Procédure stockée\nDELIMITER //\nCREATE PROCEDURE get_users(IN p_role VARCHAR(50))\nBEGIN\n  SELECT id, nom, email\n  FROM   users\n  WHERE  role = p_role AND actif = 1\n  ORDER  BY nom;\nEND //\nDELIMITER ;\n\nCALL get_users(\"admin\");\n\n-- Procédure avec OUT\nDELIMITER //\nCREATE PROCEDURE create_user(\n  IN  p_nom   VARCHAR(100),\n  IN  p_email VARCHAR(255),\n  OUT p_id    INT\n)\nBEGIN\n  INSERT INTO users (nom, email) VALUES (p_nom, p_email);\n  SET p_id = LAST_INSERT_ID();\nEND //\nDELIMITER ;\n\nCALL create_user(\"Alice\", \"a@b.fr\", @new_id);\nSELECT @new_id;"}, {"lang": "mysql", "cat": "Structure", "title": "Types de données", "desc": "DECIMAL pour les prix (précision exacte). VARCHAR adapte sa taille. ENUM pour les valeurs fixes.", "code": "-- Entiers\nTINYINT    -- -128 à 127   (1 octet)\nSMALLINT   -- -32768 à 32767\nMEDIUMINT  -- -8M à 8M\nINT        -- -2.1G à 2.1G (4 octets)\nBIGINT     -- très grand   (8 octets)\nINT UNSIGNED  -- 0 à 4.3G (double le max)\n\n-- Décimaux\nDECIMAL(10,2)  -- prix : 12345678.90  EXACT ← utiliser\nFLOAT          -- approx 7 chiffres    ← éviter pour prix\nDOUBLE         -- approx 15 chiffres\n\n-- Chaînes\nCHAR(10)         -- longueur fixe (code pays)\nVARCHAR(255)     -- longueur variable\nTINYTEXT         -- max 255 octets\nTEXT             -- max 65 535 octets\nMEDIUMTEXT       -- max 16 Mo\nLONGTEXT         -- max 4 Go\nENUM(\"a\",\"b\",\"c\") -- valeur parmi une liste\nSET(\"a\",\"b\")     -- combinaison de valeurs\n\n-- Dates\nDATE             -- 2024-06-15\nTIME             -- 14:30:00\nDATETIME         -- 2024-06-15 14:30:00 (pas de timezone)\nTIMESTAMP        -- stocké en UTC, affiché en timezone locale\nYEAR             -- 2024\n\n-- Autres\nBOOLEAN          -- alias TINYINT(1)\nJSON             -- MySQL 5.7+ (avec fonctions JSON_*)\nBLOB             -- données binaires"}, {"lang": "docker", "cat": "Concepts", "title": "Concepts fondamentaux", "desc": "Image = modèle en lecture seule. Container = instance d'une image en cours d'exécution. Volume = données persistantes.", "code": "# ── Les 4 concepts clés ──\n\nImage\n  → Modèle figé (comme une classe)\n  → Construite depuis un Dockerfile\n  → Stockée sur Docker Hub ou en local\n\nContainer\n  → Instance d'une image (comme un objet)\n  → Processus isolé avec son propre système de fichiers\n  → Éphémère : s'arrête = données perdues (sans volume)\n\nVolume\n  → Dossier partagé entre hôte et container\n  → Persiste même si le container est supprimé\n  → Indispensable pour BDD, uploads, logs\n\nNetwork\n  → Réseau virtuel entre containers\n  → Les containers se voient par leur nom de service\n  → Isolés du réseau hôte par défaut\n\n# ── Workflow typique ──\n# 1. Écrire un Dockerfile\n# 2. Builder l'image :  docker build -t mon-app .\n# 3. Lancer le container : docker run mon-app\n# OU\n# 1. Écrire un docker-compose.yml\n# 2. Tout lancer : docker-compose up"}, {"lang": "docker", "cat": "Commandes", "title": "Commandes Docker essentielles", "desc": "docker run lance un container. docker ps liste les actifs. exec permet d'entrer dans un container en cours.", "code": "# ── Images ──\ndocker images                     # lister les images locales\ndocker pull nginx                  # télécharger une image\ndocker pull node:20-alpine         # version spécifique\ndocker rmi mon-image               # supprimer une image\ndocker build -t mon-app .          # construire depuis Dockerfile\ndocker build -t mon-app:v1.0 .    # avec tag de version\n\n# ── Containers ──\ndocker ps                          # containers actifs\ndocker ps -a                       # tous (y compris stoppés)\ndocker run nginx                   # lancer (foreground)\ndocker run -d nginx                # lancer en arrière-plan\ndocker run -d -p 8080:80 nginx    # avec port mapping\ndocker run -d --name mon-nginx -p 8080:80 nginx\ndocker stop mon-nginx              # arrêter proprement\ndocker start mon-nginx             # redémarrer\ndocker restart mon-nginx\ndocker rm mon-nginx                # supprimer (arrêté)\ndocker rm -f mon-nginx             # forcer la suppression\n\n# ── Interagir ──\ndocker exec -it mon-nginx bash     # entrer dans le container\ndocker exec -it mon-nginx sh       # (si bash absent)\ndocker logs mon-nginx              # voir les logs\ndocker logs -f mon-nginx           # suivre en temps réel\ndocker inspect mon-nginx           # détails complets\ndocker stats                       # CPU/RAM en temps réel\n\n# ── Nettoyage ──\ndocker system prune                # supprimer inutilisés\ndocker system prune -a             # tout supprimer\ndocker volume prune                # volumes inutilisés"}, {"lang": "docker", "cat": "Dockerfile", "title": "Dockerfile — Instructions", "desc": "Chaque instruction crée une couche. Ordonner du moins au plus changeant. .dockerignore = .gitignore du Docker.", "code": "# Dockerfile pour une app Node.js\n\n# Image de base (toujours préciser la version)\nFROM node:20-alpine\n\n# Métadonnées\nLABEL maintainer=\"thomas@realconseil.fr\"\nLABEL version=\"1.0\"\n\n# Variables d'environnement\nENV NODE_ENV=production\nENV PORT=3000\n\n# Dossier de travail dans le container\nWORKDIR /app\n\n# Copier d'abord package.json (optimisation cache)\nCOPY package*.json ./\n\n# Installer les dépendances\nRUN npm ci --only=production\n\n# Copier le reste du code\nCOPY . .\n\n# Exposer le port (documentation seulement)\nEXPOSE 3000\n\n# Créer un utilisateur non-root (sécurité)\nRUN addgroup -S appgroup \u0026\u0026 adduser -S appuser -G appgroup\nUSER appuser\n\n# Healthcheck\nHEALTHCHECK --interval=30s --timeout=3s \\\n  CMD wget -qO- http://localhost:3000/health || exit 1\n\n# Commande de démarrage\nCMD [\"node\", \"server.js\"]\n# ou\nENTRYPOINT [\"node\"]\nCMD [\"server.js\"]"}, {"lang": "docker", "cat": "Dockerfile", "title": "Dockerfile PHP + Apache", "desc": "Image php:apache intègre Apache. COPY --chown transfère les droits. RUN enchaîne les commandes avec \u0026\u0026.", "code": "# Dockerfile pour une app PHP\nFROM php:8.2-apache\n\n# Installer extensions PHP\nRUN apt-get update \u0026\u0026 apt-get install -y \\\n    libpng-dev libjpeg-dev libzip-dev git unzip \\\n  \u0026\u0026 docker-php-ext-install \\\n    pdo pdo_mysql mysqli \\\n    gd zip opcache \\\n  \u0026\u0026 apt-get clean \u0026\u0026 rm -rf /var/lib/apt/lists/*\n\n# Activer mod_rewrite (pour les URLs propres)\nRUN a2enmod rewrite\n\n# Configurer Apache\nCOPY docker/apache.conf /etc/apache2/sites-available/000-default.conf\n\n# Configurer PHP\nCOPY docker/php.ini /usr/local/etc/php/conf.d/custom.ini\n\n# Installer Composer\nCOPY --from=composer:latest /usr/bin/composer /usr/bin/composer\n\nWORKDIR /var/www/html\n\n# Copier composer.json en premier (cache)\nCOPY composer.json composer.lock ./\nRUN composer install --no-dev --no-scripts --optimize-autoloader\n\n# Copier le code avec les bons droits\nCOPY --chown=www-data:www-data . .\n\nEXPOSE 80\n\nCMD [\"apache2-foreground\"]\n\n# ── .dockerignore ──\n# node_modules/\n# .env\n# .git/\n# tests/\n# *.md"}, {"lang": "docker", "cat": "Compose", "title": "docker-compose.yml — Structure", "desc": "docker-compose orchestre plusieurs containers. Les services se joignent par leur nom. depends_on gère l'ordre.", "code": "# docker-compose.yml\nversion: \"3.9\"\n\nservices:\n\n  # ── Application web ──\n  app:\n    build: .                         # construire depuis Dockerfile\n    # image: mon-image:latest        # ou utiliser une image existante\n    container_name: mon_app\n    restart: unless-stopped\n    ports:\n      - \"8080:80\"                    # hôte:container\n    volumes:\n      - .:/var/www/html              # code source (dev)\n      - uploads:/var/www/html/uploads # volume nommé (persistant)\n    environment:\n      DB_HOST: db                    # nom du service = hostname !\n      DB_NAME: mabase\n      DB_USER: user\n      DB_PASS: secret\n    env_file:\n      - .env                         # charger depuis .env\n    depends_on:\n      db:\n        condition: service_healthy   # attendre que la BDD soit prête\n    networks:\n      - app-network\n\n  # ── Base de données ──\n  db:\n    image: mysql:8.0\n    container_name: mon_mysql\n    restart: unless-stopped\n    environment:\n      MYSQL_ROOT_PASSWORD: rootsecret\n      MYSQL_DATABASE: mabase\n      MYSQL_USER: user\n      MYSQL_PASSWORD: secret\n    volumes:\n      - mysql_data:/var/lib/mysql    # persister les données\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql\n    ports:\n      - \"3306:3306\"                  # accès depuis l'hôte (dev)\n    healthcheck:\n      test: [\"CMD\", \"mysqladmin\", \"ping\", \"-h\", \"localhost\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - app-network\n\n  # ── phpMyAdmin (dev seulement) ──\n  phpmyadmin:\n    image: phpmyadmin\n    ports:\n      - \"8081:80\"\n    environment:\n      PMA_HOST: db\n      PMA_USER: user\n      PMA_PASSWORD: secret\n    depends_on:\n      - db\n    networks:\n      - app-network\n\nvolumes:\n  mysql_data:    # volume géré par Docker (persistant)\n  uploads:\n\nnetworks:\n  app-network:\n    driver: bridge"}, {"lang": "docker", "cat": "Compose", "title": "Commandes docker-compose", "desc": "up lance tout. down arrête et supprime. logs -f suit en temps réel. exec entre dans un service.", "code": "# ── Démarrer ──\ndocker-compose up                  # foreground (logs visibles)\ndocker-compose up -d               # arrière-plan (daemon)\ndocker-compose up --build          # reconstruire les images\ndocker-compose up -d --build       # rebuild + daemon\n\n# ── Arrêter ──\ndocker-compose stop                # arrêter (garder les containers)\ndocker-compose down                # arrêter + supprimer containers\ndocker-compose down -v             # + supprimer les volumes !\ndocker-compose down --rmi all      # + supprimer les images\n\n# ── État ──\ndocker-compose ps                  # état des services\ndocker-compose logs                # logs de tous les services\ndocker-compose logs -f             # suivre en temps réel\ndocker-compose logs -f app         # un seul service\ndocker-compose logs --tail=50 app  # 50 dernières lignes\n\n# ── Interagir ──\ndocker-compose exec app bash       # entrer dans le service \"app\"\ndocker-compose exec db mysql -u user -p\n\n# ── Gérer ──\ndocker-compose restart app         # redémarrer un service\ndocker-compose pull                # mettre à jour les images\ndocker-compose build               # reconstruire sans lancer\n\n# ── Commandes dans le container ──\ndocker-compose exec app composer install\ndocker-compose exec app php artisan migrate\ndocker-compose exec app npm run build\n\n# ── Fichiers multiples (environnements) ──\ndocker-compose -f docker-compose.yml \\\n               -f docker-compose.prod.yml up -d"}, {"lang": "docker", "cat": "Volumes", "title": "Volumes \u0026 Variables d'environnement", "desc": "Bind mount = dossier hôte partagé (dev). Volume nommé = géré par Docker (prod). Ne jamais commiter .env.", "code": "# ── Types de volumes ──\n\n# 1. Bind mount (chemin hôte → container)\nvolumes:\n  - ./src:/app/src            # code source en dev\n  - ./logs:/app/logs\n  - /etc/localtime:/etc/localtime:ro  # fuseau horaire\n\n# 2. Volume nommé (géré par Docker, persistant)\nvolumes:\n  - mysql_data:/var/lib/mysql\n  - redis_data:/data\n\n# 3. Volume anonyme (temporaire)\nvolumes:\n  - /tmp/cache                # chemin container seulement\n\n# ── Variables d'environnement ──\n\n# .env (JAMAIS commiter, dans .gitignore et .dockerignore)\nDB_HOST=db\nDB_NAME=mabase\nDB_USER=user\nDB_PASS=supersecret\nAPP_SECRET=changeme_in_production\n\n# docker-compose.yml — utiliser .env\nenvironment:\n  DB_HOST: ${DB_HOST}\n  DB_PASS: ${DB_PASS}\n# ou\nenv_file:\n  - .env\n\n# Dans le Dockerfile\nARG BUILD_ENV=production          # argument de build\nENV NODE_ENV=${BUILD_ENV}         # variable runtime\n\n# Passer à la construction\ndocker build --build-arg BUILD_ENV=dev .\n\n# ── .env.example (commiter celui-là !) ──\nDB_HOST=db\nDB_NAME=mabase\nDB_USER=user\nDB_PASS=change_me\nAPP_SECRET=change_me"}, {"lang": "docker", "cat": "Avancé", "title": "Multi-stage build \u0026 Bonnes pratiques", "desc": "Multi-stage = image de build séparée de l'image finale. Résultat : image légère sans les outils de dev.", "code": "# ── Multi-stage build (Node.js) ──\n\n# Stage 1 : builder\nFROM node:20-alpine AS builder\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build          # compile le code\n\n# Stage 2 : image finale (légère)\nFROM node:20-alpine AS production\nENV NODE_ENV=production\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci --only=production  # sans devDependencies\nCOPY --from=builder /app/dist ./dist  # seulement le build\nEXPOSE 3000\nUSER node\nCMD [\"node\", \"dist/server.js\"]\n\n# Résultat : image sans TypeScript, Webpack, tests, etc.\n\n# ── Bonnes pratiques ──\n\n# ✓ Utiliser des images officielle et légères\nFROM node:20-alpine    # pas node:20 (plus lourd)\nFROM php:8.2-cli-alpine\n\n# ✓ .dockerignore (copier seulement le nécessaire)\nnode_modules/\n.git/  .env  tests/  docs/  *.md\ndist/  coverage/  .DS_Store\n\n# ✓ Ordonner les COPY du moins au plus changeant\nCOPY package*.json ./   # change rarement → cache\nRUN npm install         # long → mis en cache si package.json intact\nCOPY . .                # change souvent → en dernier\n\n# ✓ Un seul processus par container\n# ✓ Logs sur stdout/stderr (pas dans des fichiers)\n# ✓ Jamais de secrets dans l'image (utiliser .env ou secrets)\n# ✓ Non-root user en production\nRUN adduser -D appuser\nUSER appuser"}, {"lang": "api", "cat": "Concepts", "title": "Principes REST", "desc": "REST = architecture stateless. Chaque URL représente une ressource. Le verbe HTTP définit l'action.", "code": "# ── Les 6 contraintes REST ──\n\n# 1. Client-Serveur   → séparation front/back\n# 2. Stateless        → chaque requête est indépendante\n#                       (pas de session serveur)\n# 3. Cache            → les réponses peuvent être mises en cache\n# 4. Interface uniforme → conventions prévisibles\n# 5. Système en couches → load balancer, proxy transparents\n# 6. Code à la demande  → optionnel (JS envoyé au client)\n\n# ── Conventions d'URL ──\n\n# Ressource = nom au pluriel\nGET    /api/users          # lister tous les utilisateurs\nPOST   /api/users          # créer un utilisateur\nGET    /api/users/42       # lire l'utilisateur #42\nPUT    /api/users/42       # remplacer l'utilisateur #42\nPATCH  /api/users/42       # modifier partiellement\nDELETE /api/users/42       # supprimer l'utilisateur #42\n\n# Sous-ressources\nGET    /api/users/42/posts     # posts de l'user #42\nPOST   /api/users/42/posts     # créer un post pour l'user #42\n\n# Filtres, tri, pagination (query string)\nGET /api/users?role=admin\u0026actif=1\nGET /api/users?sort=nom\u0026order=asc\nGET /api/users?page=2\u0026limit=10\nGET /api/products?search=cahier\u0026categorie=bureau\n\n# ── À ne PAS faire ──\n# ✗ /api/getUsers\n# ✗ /api/users/delete/42\n# ✗ /api/createUser\n# ✓ Les verbes HTTP expriment l'action, pas l'URL"}, {"lang": "api", "cat": "HTTP", "title": "Codes de statut HTTP", "desc": "Toujours retourner le bon code. 2xx = succès. 4xx = erreur client. 5xx = erreur serveur.", "code": "# ── 2xx — Succès ──\n200 OK            → GET, PUT, PATCH réussis\n201 Created       → POST réussi (ressource créée)\n                    + header Location: /api/users/43\n204 No Content    → DELETE réussi (rien à retourner)\n\n# ── 3xx — Redirection ──\n301 Moved Permanently  → URL changée définitivement\n302 Found              → Redirection temporaire\n304 Not Modified       → Cache encore valide\n\n# ── 4xx — Erreurs CLIENT ──\n400 Bad Request        → Données invalides (validation)\n401 Unauthorized       → Non authentifié (pas de token)\n403 Forbidden          → Authentifié mais pas autorisé\n404 Not Found          → Ressource inexistante\n405 Method Not Allowed → Verbe HTTP non supporté\n409 Conflict           → Conflit (email déjà utilisé)\n422 Unprocessable      → Données syntaxiquement ok mais invalides\n429 Too Many Requests  → Rate limiting\n\n# ── 5xx — Erreurs SERVEUR ──\n500 Internal Server Error  → Bug serveur\n502 Bad Gateway            → Serveur amont indisponible\n503 Service Unavailable    → Serveur surchargé ou maintenance\n\n# ── Format de réponse standard ──\n# Succès\n{ \"data\": { \"id\": 42, \"nom\": \"Alice\" } }\n\n# Erreur\n{\n  \"error\": {\n    \"code\": \"VALIDATION_ERROR\",\n    \"message\": \"Email invalide\",\n    \"details\": { \"field\": \"email\" }\n  }\n}\n\n# Liste paginée\n{\n  \"data\": [...],\n  \"meta\": {\n    \"total\": 150,\n    \"page\": 2,\n    \"limit\": 10,\n    \"pages\": 15\n  }\n}"}, {"lang": "api", "cat": "JWT", "title": "JWT — Fonctionnement", "desc": "JWT = token signé contenant les infos utilisateur. Pas chiffré (lisible), mais impossible à falsifier sans la clé.", "code": "# ── Structure d'un token JWT ──\n\n# Un JWT = 3 parties séparées par des points\neyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9    ← HEADER\n.eyJ1c2VySWQiOjQyLCJyb2xlIjoiYWRtaW4ifQ ← PAYLOAD\n.xyzABC123signatureImpossibleAFalsifier    ← SIGNATURE\n\n# HEADER (Base64) — algo de signature\n{\n  \"alg\": \"HS256\",   # algorithme HMAC SHA-256\n  \"typ\": \"JWT\"\n}\n\n# PAYLOAD (Base64) — les données (claims)\n{\n  \"userId\": 42,\n  \"role\":   \"admin\",\n  \"email\":  \"alice@ex.fr\",\n  \"iat\": 1718457600,  # issued at (timestamp)\n  \"exp\": 1718461200,  # expiration (timestamp)\n  # NE JAMAIS mettre le mot de passe ici !\n}\n\n# SIGNATURE — garantit l'intégrité\nHMAC_SHA256(base64(header) + \".\" + base64(payload), SECRET_KEY)\n\n# ── Flux d'authentification ──\n\n# 1. Login\nPOST /api/auth/login\nBody: { \"email\": \"alice@ex.fr\", \"password\": \"...\" }\n\n# 2. Serveur répond avec le token\n{ \"token\": \"eyJ...\", \"expiresIn\": 3600 }\n\n# 3. Client stocke le token\nlocalStorage.setItem(\"token\", \"eyJ...\")\n\n# 4. Requêtes suivantes : envoyer le token\nGET /api/users/me\nAuthorization: Bearer eyJhbGciOiJIUzI1NiJ9...\n\n# 5. Serveur vérifie la signature → identifie l'user\n\n# ── Refresh Token ──\n# Access token : durée courte (15min - 1h)\n# Refresh token : durée longue (30 jours), stocké en httpOnly cookie\n# Quand l'access token expire → utiliser le refresh token pour en obtenir un nouveau"}, {"lang": "api", "cat": "JWT", "title": "JWT en PHP", "desc": "Utiliser firebase/php-jwt via Composer. La clé secrète doit être longue et aléatoire. Vérifier exp automatiquement.", "code": "\u003c?php\n// composer require firebase/php-jwt\n\nuse Firebase\\JWT\\JWT;\nuse Firebase\\JWT\\Key;\n\n$SECRET = $_ENV['JWT_SECRET']; // min. 32 chars aléatoires\n\n// ── Créer un token ──\nfunction createToken(array $user): string {\n    global $SECRET;\n    $payload = [\n        'iat'    =\u003e time(),\n        'exp'    =\u003e time() + 3600,  // expire dans 1h\n        'userId' =\u003e $user['id'],\n        'role'   =\u003e $user['role'],\n        'email'  =\u003e $user['email'],\n    ];\n    return JWT::encode($payload, $SECRET, 'HS256');\n}\n\n// ── Vérifier un token ──\nfunction verifyToken(): object {\n    global $SECRET;\n    $header = getallheaders()['Authorization'] ?? '';\n    if (!str_starts_with($header, 'Bearer ')) {\n        http_response_code(401);\n        die(json_encode(['error' =\u003e 'Token manquant']));\n    }\n    $token = substr($header, 7);\n    try {\n        return JWT::decode($token, new Key($SECRET, 'HS256'));\n        // Lance une exception si expiré ou invalide\n    } catch (Exception $e) {\n        http_response_code(401);\n        die(json_encode(['error' =\u003e 'Token invalide']));\n    }\n}\n\n// ── Endpoint login ──\n// POST /api/auth/login\n$data  = json_decode(file_get_contents('php://input'), true);\n$user  = $pdo-\u003eprepare('SELECT * FROM users WHERE email = ?');\n$user-\u003eexecute([$data['email']]);\n$user  = $user-\u003efetch();\n\nif (!$user || !password_verify($data['password'], $user['mdp'])) {\n    http_response_code(401);\n    die(json_encode(['error' =\u003e 'Identifiants incorrects']));\n}\n\necho json_encode(['token' =\u003e createToken($user)]);\n\n// ── Middleware d'auth ──\n// GET /api/users/me  (protégé)\n$decoded = verifyToken();         // stoppe si invalide\n$userId  = $decoded-\u003euserId;\n\n$stmt = $pdo-\u003eprepare('SELECT id,nom,email FROM users WHERE id=?');\n$stmt-\u003eexecute([$userId]);\necho json_encode(['data' =\u003e $stmt-\u003efetch()]);"}, {"lang": "api", "cat": "JWT", "title": "JWT côté JavaScript", "desc": "Stocker le token en mémoire ou sessionStorage en priorité. Envoyer dans le header Authorization.", "code": "// ── Stocker le token ──\n// Option 1 : mémoire (le + sécurisé, perdu au refresh)\nlet token = null;\n\n// Option 2 : sessionStorage (onglet seulement)\nsessionStorage.setItem('token', data.token);\n\n// Option 3 : localStorage (persiste, risque XSS)\nlocalStorage.setItem('token', data.token);\n\n// ── Appel login ──\nconst login = async (email, password) =\u003e {\n  const res = await fetch('/api/auth/login', {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify({ email, password })\n  });\n\n  if (!res.ok) throw new Error('Identifiants incorrects');\n\n  const { token } = await res.json();\n  localStorage.setItem('token', token);\n  return token;\n};\n\n// ── Requête authentifiée ──\nconst authFetch = async (url, options = {}) =\u003e {\n  const token = localStorage.getItem('token');\n\n  const res = await fetch(url, {\n    ...options,\n    headers: {\n      'Content-Type': 'application/json',\n      'Authorization': `Bearer ${token}`,\n      ...options.headers\n    }\n  });\n\n  // Token expiré → rediriger vers login\n  if (res.status === 401) {\n    localStorage.removeItem('token');\n    window.location.href = '/login';\n    return;\n  }\n\n  return res.json();\n};\n\n// ── Utilisation ──\nconst profile = await authFetch('/api/users/me');\nconst users   = await authFetch('/api/users');\n\n// ── Lire le payload (sans lib) ──\nconst decodeToken = (token) =\u003e {\n  const payload = token.split('.')[1];\n  return JSON.parse(atob(payload));\n};\n\nconst { userId, role, exp } = decodeToken(token);\nconst isExpired = Date.now() / 1000 \u003e exp;\n\n// ── Déconnexion ──\nconst logout = () =\u003e {\n  localStorage.removeItem('token');\n  window.location.href = '/login';\n};"}, {"lang": "api", "cat": "PHP", "title": "API REST en PHP — Structure", "desc": "Router simple en PHP natif. json_encode pour les réponses. header() pour les codes HTTP et CORS.", "code": "\u003c?php\n// ── index.php — Point d'entrée unique ──\nheader('Content-Type: application/json; charset=utf-8');\n\n// CORS (Cross-Origin Resource Sharing)\nheader('Access-Control-Allow-Origin: http://localhost:3000');\nheader('Access-Control-Allow-Methods: GET,POST,PUT,PATCH,DELETE,OPTIONS');\nheader('Access-Control-Allow-Headers: Content-Type,Authorization');\n\n// Répondre aux preflight OPTIONS\nif ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') {\n    http_response_code(204);\n    exit;\n}\n\n// ── Helper : envoyer une réponse JSON ──\nfunction respond(mixed $data, int $code = 200): void {\n    http_response_code($code);\n    echo json_encode(['data' =\u003e $data]);\n    exit;\n}\nfunction error(string $msg, int $code = 400,\n               string $errCode = 'ERROR'): void {\n    http_response_code($code);\n    echo json_encode(['error' =\u003e [\n        'code' =\u003e $errCode, 'message' =\u003e $msg\n    ]]);\n    exit;\n}\n\n// ── Router ──\n$method = $_SERVER['REQUEST_METHOD'];\n$uri    = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);\n$parts  = explode('/', trim($uri, '/'));\n// /api/users/42 → ['api','users','42']\n\n$resource = $parts[1] ?? '';\n$id       = isset($parts[2]) ? (int)$parts[2] : null;\n\nmatch ([$method, $resource]) {\n    ['GET',    'users'] =\u003e getUsers(),\n    ['POST',   'users'] =\u003e createUser(),\n    ['GET',    'users'] =\u003e getUser($id),    // avec $id\n    ['PUT',    'users'] =\u003e updateUser($id),\n    ['DELETE', 'users'] =\u003e deleteUser($id),\n    default =\u003e error('Route introuvable', 404, 'NOT_FOUND')\n};\n\n// ── Lire le body JSON ──\n$body = json_decode(file_get_contents('php://input'), true);"}, {"lang": "api", "cat": "Fetch", "title": "Fetch API — CRUD complet vers une API REST", "desc": "Utilitaire authFetch réutilisable. Toujours vérifier res.ok. Gérer les erreurs de façon centralisée.", "code": "// ── Utilitaire API centralisé ──\nconst API_URL = 'http://localhost:8080/api';\n\nconst api = {\n  _fetch: async (path, options = {}) =\u003e {\n    const token = localStorage.getItem('token');\n    const res = await fetch(API_URL + path, {\n      ...options,\n      headers: {\n        'Content-Type': 'application/json',\n        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),\n        ...options.headers,\n      },\n    });\n\n    if (res.status === 401) {\n      localStorage.removeItem('token');\n      window.location.href = '/login';\n      return;\n    }\n\n    const json = await res.json();\n\n    if (!res.ok) {\n      throw new Error(json.error?.message || `HTTP ${res.status}`);\n    }\n\n    return json.data;\n  },\n\n  get:    (path)         =\u003e api._fetch(path),\n  post:   (path, body)   =\u003e api._fetch(path, {\n    method: 'POST', body: JSON.stringify(body) }),\n  put:    (path, body)   =\u003e api._fetch(path, {\n    method: 'PUT',  body: JSON.stringify(body) }),\n  patch:  (path, body)   =\u003e api._fetch(path, {\n    method: 'PATCH', body: JSON.stringify(body) }),\n  delete: (path)         =\u003e api._fetch(path, { method: 'DELETE' }),\n};\n\n// ── Utilisation ──\n// Authentification\nconst { token } = await api.post('/auth/login', {\n  email: 'alice@ex.fr', password: 'secret'\n});\nlocalStorage.setItem('token', token);\n\n// CRUD Utilisateurs\nconst users  = await api.get('/users');\nconst user   = await api.get('/users/42');\n\nconst newUser = await api.post('/users', {\n  nom: 'Alice', email: 'alice@ex.fr'\n});\n\nawait api.put('/users/42', {\n  nom: 'Alice Dupont', email: 'alice@ex.fr', role: 'admin'\n});\n\nawait api.patch('/users/42', { role: 'editor' }); // partiel\n\nawait api.delete('/users/42');\n\n// Dans React\nconst [users, setUsers] = useState([]);\nuseEffect(() =\u003e {\n  api.get('/users').then(setUsers).catch(console.error);\n}, []);"}, {"lang": "api", "cat": "Sécurité", "title": "Sécurité API REST", "desc": "Valider toutes les entrées. Rate limiting contre le brute force. HTTPS obligatoire en production.", "code": "\u003c?php\n// ── Validation des entrées ──\nfunction validateUser(array $data): array {\n    $errors = [];\n\n    if (empty($data['nom']) || strlen($data['nom']) \u003c 2)\n        $errors['nom'] = \"Nom requis (min. 2 chars)\";\n\n    if (!filter_var($data['email'] ?? '', FILTER_VALIDATE_EMAIL))\n        $errors['email'] = \"Email invalide\";\n\n    if (!empty($data['mdp']) \u0026\u0026 strlen($data['mdp']) \u003c 8)\n        $errors['mdp'] = \"Mot de passe min. 8 chars\";\n\n    return $errors;\n}\n\n$body   = json_decode(file_get_contents('php://input'), true);\n$errors = validateUser($body);\nif ($errors) {\n    http_response_code(422);\n    echo json_encode(['error' =\u003e [\n        'code' =\u003e 'VALIDATION_ERROR',\n        'details' =\u003e $errors\n    ]]);\n    exit;\n}\n\n// ── Rate Limiting (basique avec Redis/APCu) ──\n// Limiter à 5 tentatives de login par IP sur 15min\n$ip      = $_SERVER['REMOTE_ADDR'];\n$key     = \"login_attempts_$ip\";\n$attempts = apcu_fetch($key) ?: 0;\n\nif ($attempts \u003e= 5) {\n    http_response_code(429);\n    die(json_encode(['error' =\u003e 'Trop de tentatives. Réessayer dans 15 min.']));\n}\napcu_store($key, $attempts + 1, 900); // 15 minutes\n\n// ── Headers de sécurité ──\nheader('X-Content-Type-Options: nosniff');\nheader('X-Frame-Options: DENY');\nheader('Strict-Transport-Security: max-age=31536000'); // HTTPS\n\n// ── CORS restrictif (prod) ──\n$allowedOrigins = ['https://monsite.fr', 'https://www.monsite.fr'];\n$origin = $_SERVER['HTTP_ORIGIN'] ?? '';\nif (in_array($origin, $allowedOrigins)) {\n    header(\"Access-Control-Allow-Origin: $origin\");\n}\n\n// ── Checklist sécurité API ──\n// ✓ HTTPS en production (jamais HTTP)\n// ✓ Valider toutes les entrées côté serveur\n// ✓ Requêtes préparées (pas de concaténation SQL)\n// ✓ JWT avec durée courte (1h max)\n// ✓ Rate limiting sur /auth/login\n// ✓ Logs des actions sensibles (connexion, suppression)\n// ✗ Jamais de données sensibles dans les logs\n// ✗ Jamais de stack trace en production"}]
</script>

<script>
const RAW = JSON.parse(document.getElementById('D').textContent);

// ════════════════════════════════════════════════════
//  SYNTAX HIGHLIGHTING ENGINE
// ════════════════════════════════════════════════════

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function wrapLine(line, lang) {
  if (!line.trim()) return line;
  switch(lang) {
    case 'html': return hlHTML(line);
    case 'css':  return hlCSS(line);
    case 'js':   return hlJS(line);
    case 'php':  return hlPHP(line);
    case 'react':return hlReact(line);
    case 'git':  return hlGit(line);
    case 'mysql':  return hlSQL(line);
    case 'docker': return hlDocker(line);
    case 'api':    return hlAPI(line);
    default:       return line;
  }
}

// ── HTML ──────────────────────────────────────────
function hlHTML(line) {
  // Commentaires HTML
  if (/<!--/.test(line)) {
    return line.replace(/(&lt;!--.*?--&gt;)/g, '<span class="hcmt">$1</span>')
               .replace(/(&lt;!--.*$)/, '<span class="hcmt">$1</span>');
  }
  // DOCTYPE
  if (/&lt;!DOCTYPE/i.test(line)) {
    return '<span class="hcmt">' + line + '</span>';
  }
  // Tags + attributs
  return line.replace(
    /(&lt;\/?)([\w:-]+)((?:\s+[\w:-]+(?:=(?:"[^"]*"|'[^']*'|[^\s>]*))?)*)\s*(\/?&gt;)?/g,
    function(m, open, tag, attrs, close) {
      let out = '<span class="lt">' + open + '</span>';
      out += '<span class="htag">' + tag + '</span>';
      if (attrs) {
        out += attrs.replace(/([\w:-]+)(=)("([^"]*)")/g,
          '<span class="hattr">$1</span>' +
          '<span class="lt">$2</span>' +
          '<span class="hval">&quot;$4&quot;</span>');
      }
      if (close) out += '<span class="lt">' + close + '</span>';
      return out;
    }
  );
}

// ── CSS ──────────────────────────────────────────
function hlCSS(line) {
  if (/^\s*\/\*/.test(line)) return '<span class="ccmt">' + line + '</span>';
  // At-rules
  if (/^\s*@/.test(line)) return '<span class="cat">' + line + '</span>';
  // Propriété: valeur
  if (/^\s*[\w-]+\s*:/.test(line)) {
    return line.replace(/^(\s*)([\w-]+)(\s*:\s*)(.*)$/, function(m,sp,prop,col,val) {
      return sp + '<span class="cprop">' + prop + '</span>' +
             '<span class="lt">' + col + '</span>' +
             '<span class="cval">' + val + '</span>';
    });
  }
  // Sélecteur
  if (/[{}]/.test(line) || /^\s*[.#:*\w\[\(]/.test(line)) {
    return line.replace(/([.#][\w-]+|:[\w-]+(?:\([^)]*\))?|::[\w-]+|\*|[\w-]+)/g,
      function(m, s) {
        if (/^[.#]/.test(s)) return '<span class="csel">' + s + '</span>';
        if (/^::?/.test(s))  return '<span class="cpseudo">' + s + '</span>';
        return '<span class="htag">' + s + '</span>';
      });
  }
  return line;
}

// ── JS ──────────────────────────────────────────
const JS_KW = /\b(const|let|var|function|return|if|else|else if|for|while|do|switch|case|break|continue|new|class|extends|super|import|export|default|from|async|await|try|catch|finally|throw|typeof|instanceof|in|of|delete|void|static|get|set|null|undefined|true|false|this|yield|debugger)\b/g;

function hlJS(line) {
  if (/^\s*\/\//.test(line)) return '<span class="jcmt">' + line + '</span>';
  if (/^\s*\/\*/.test(line)) return '<span class="jcmt">' + line + '</span>';
  return line
    .replace(/(`[^`]*`)/g, '<span class="jtpl">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="jstr">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="jnum">$1</span>')
    .replace(JS_KW, '<span class="jkw">$1</span>')
    .replace(/\b([A-Z][a-zA-Z0-9]*)\b(?=\s*[({])/g, '<span class="jclass">$1</span>')
    .replace(/\b([a-z_][a-zA-Z0-9_]*)(?=\s*\()/g, '<span class="jfn">$1</span>')
    .replace(/(\/\/.*$)/g, '<span class="jcmt">$1</span>');
}

// ── PHP ──────────────────────────────────────────
const PHP_KW = /\b(if|else|elseif|for|foreach|while|do|switch|case|break|continue|return|function|class|interface|trait|abstract|extends|implements|new|echo|print|var_dump|isset|empty|unset|null|true|false|use|namespace|public|protected|private|static|readonly|match|default|throw|try|catch|finally|fn|enum)\b/g;

function hlPHP(line) {
  if (/^\s*\/\//.test(line)) return '<span class="pcmt">' + line + '</span>';
  if (/^\s*#/.test(line))    return '<span class="pcmt">' + line + '</span>';
  if (/^\s*\/\*/.test(line)) return '<span class="pcmt">' + line + '</span>';
  if (/^\s*\?&gt;&lt;\?/.test(line)) return line;
  return line
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="pstr">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="pnum">$1</span>')
    .replace(PHP_KW, '<span class="pkw">$1</span>')
    .replace(/(\$[\w]+)/g, '<span class="pvar">$1</span>')
    .replace(/\b(int|string|float|bool|array|void|null|mixed|never|self|static|callable)\b/g,
      '<span class="ptype">$1</span>')
    .replace(/\b([a-z_][a-zA-Z0-9_]*)(?=\s*\()/g, '<span class="pfn">$1</span>')
    .replace(/(\/\/.*$)/g, '<span class="pcmt">$1</span>');
}

// ── React / JSX ──────────────────────────────────
function hlReact(line) {
  if (/^\s*\/\//.test(line)) return '<span class="jcmt">' + line + '</span>';
  if (/\{\/\*/.test(line))   return '<span class="jcmt">' + line + '</span>';
  // JSX tags
  let out = hlJS(line);
  out = out.replace(/(&lt;\/?)([\w.]+)/g, function(m, lt, tag) {
    const cls = /^[A-Z]/.test(tag) ? 'jclass' : 'htag';
    return '<span class="lt">' + lt + '</span><span class="' + cls + '">' + tag + '</span>';
  });
  return out;
}

// ── Git ──────────────────────────────────────────
const GIT_KW = /^(\s*)(git|#)([\s\S]*)/;
function hlGit(line) {
  if (/^\s*#/.test(line)) return '<span class="jcmt">' + line + '</span>';
  if (/^\s*git\b/.test(line)) {
    return line
      .replace(/\b(git)\b/, '<span class="jkw">$1</span>')
      .replace(/\b(add|commit|push|pull|fetch|clone|init|status|log|diff|branch|merge|rebase|switch|restore|remote|stash|tag|reset|revert|config|checkout|cherry-pick|bisect|blame|show|worktree|submodule|rm|mv|archive|clean)\b/, '<span class="jfn">$1</span>')
      .replace(/(-{1,2}[\w-]+)/g, '<span class="jattr">$1</span>')
      .replace(/"([^"]*)"/g, '<span class="jstr">"$1"</span>');
  }
  if (/^\s*[A-Z_]+=/.test(line)) {
    return line.replace(/^(\s*)([\w]+)(=)(.*)$/, function(m,sp,k,eq,v){
      return sp+'<span class="pvar">'+k+'</span><span class="lt">'+eq+'</span><span class="jstr">'+v+'</span>';
    });
  }
  return line;
}

// ── SQL ──────────────────────────────────────────
const SQL_KW = /\b(SELECT|FROM|WHERE|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|DATABASE|DROP|ALTER|ADD|COLUMN|INDEX|PRIMARY|KEY|FOREIGN|REFERENCES|ON|JOIN|INNER|LEFT|RIGHT|OUTER|CROSS|USING|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|DISTINCT|AS|NOT|IN|NULL|IS|LIKE|BETWEEN|AND|OR|CASE|WHEN|THEN|ELSE|END|IF|USE|SHOW|DESC|EXPLAIN|ANALYZE|CALL|PROCEDURE|TRIGGER|VIEW|AFTER|BEFORE|FOR|EACH|BEGIN|COMMIT|ROLLBACK|TRANSACTION|WITH|UNION|DELIMITER|START|TRUNCATE)\b/gi;

function hlSQL(line) {
  if (/^\s*--/.test(line)) return '<span class="scmt">' + line + '</span>';
  if (/^\s*\/\*/.test(line)) return '<span class="scmt">' + line + '</span>';
  return line
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="sstr">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="snum">$1</span>')
    .replace(SQL_KW, '<span class="skw">$&</span>')
    .replace(/\b(INT|BIGINT|VARCHAR|TEXT|BOOLEAN|DECIMAL|FLOAT|DATE|DATETIME|TIMESTAMP|ENUM|JSON|UNSIGNED|AUTO_INCREMENT|DEFAULT|NOT|NULL|CURRENT_TIMESTAMP|UNIQUE)\b/gi, '<span class="stype">$&</span>')
    .replace(/\b([A-Z_]+)\s*(?=\()/g, function(m, fn) {
      if (/^(COUNT|AVG|SUM|MIN|MAX|GROUP_CONCAT|CONCAT|UPPER|LOWER|LENGTH|CHAR_LENGTH|SUBSTRING|TRIM|REPLACE|NOW|CURDATE|DATE_FORMAT|DATE_ADD|DATE_SUB|DATEDIFF|TIMESTAMPDIFF|YEAR|MONTH|DAY|IFNULL|COALESCE|NULLIF|IF|LAST_INSERT_ID|ROW_COUNT|FIELD|LPAD|STR_TO_DATE|ROUND|FLOOR|CEIL)$/i.test(fn))
        return '<span class="sfn">' + m + '</span>';
      return m;
    })
    .replace(/(--.*$)/g, '<span class="scmt">$1</span>');
}

// ── Docker ──────────────────────────────────────────
function hlDocker(line) {
  if (/^\s*#/.test(line)) return '<span class="jcmt">' + line + '</span>';
  // Dockerfile instructions
  if (/^(FROM|RUN|COPY|ADD|WORKDIR|EXPOSE|ENV|ARG|CMD|ENTRYPOINT|LABEL|USER|VOLUME|HEALTHCHECK|ONBUILD|SHELL|STOPSIGNAL)\b/.test(line.trim())) {
    return line.replace(/^(\s*)(FROM|RUN|COPY|ADD|WORKDIR|EXPOSE|ENV|ARG|CMD|ENTRYPOINT|LABEL|USER|VOLUME|HEALTHCHECK|ONBUILD)/, function(m,sp,kw){
      return sp + '<span class="jkw">' + kw + '</span>';
    })
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="jstr">$1</span>');
  }
  // docker-compose YAML
  if (/^\s+(image|build|ports|volumes|environment|depends_on|networks|restart|container_name|healthcheck|env_file|command|entrypoint):\s/.test(line)) {
    return line.replace(/^(\s+)([\w_-]+)(:\s*)(.*)$/, function(m,sp,k,col,v){
      return sp+'<span class="cprop">'+k+'</span>'+'<span class="lt">'+col+'</span>'+'<span class="jstr">'+v+'</span>';
    });
  }
  // docker commands
  return line.replace(/\b(docker|docker-compose)\b/, '<span class="jkw">$1</span>')
    .replace(/\b(run|build|push|pull|ps|stop|start|rm|rmi|exec|logs|inspect|prune|images|up|down|restart|stats|system|volume|network|create|ls)\b/, '<span class="jfn">$1</span>')
    .replace(/(-{1,2}[\w-]+)/g, '<span class="hattr">$1</span>')
    .replace(/("(?:[^"]*)"|'(?:[^']*)')/, '<span class="jstr">$1</span>');
}

// ── API / JWT ────────────────────────────────────────
function hlAPI(line) {
  if (/^\s*#/.test(line)) return '<span class="jcmt">' + line + '</span>';
  if (/^\s*\/\//.test(line)) return '<span class="jcmt">' + line + '</span>';
  if (/^\s*\/\*/.test(line)) return '<span class="jcmt">' + line + '</span>';
  // HTTP methods
  if (/^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)\s/.test(line.trim())) {
    return line.replace(/^(\s*)(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)(\s+)(.*)$/,
      function(m,sp,method,sep,path){
        return sp+'<span class="jkw">'+method+'</span>'+sep+'<span class="jstr">'+path+'</span>';
      });
  }
  // HTTP codes
  if (/^\d{3}\s/.test(line.trim())) {
    return line.replace(/^(\s*)(\d{3})(\s+)(.*)$/,
      function(m,sp,code,sep,msg){
        const cls = code.startsWith('2') ? 'jfn' : code.startsWith('4') ? 'syn-op' : 'jattr';
        return sp+'<span class="'+cls+'">'+code+'</span>'+sep+'<span class="jcmt">'+msg+'</span>';
      });
  }
  // JSON-like
  return hlJS(line);
}

// ════════════════════════════════════════════════════
//  HIGHLIGHT UN BLOC DE CODE
// ════════════════════════════════════════════════════

function highlight(code, lang) {
  const escaped = esc(code);
  const lines = escaped.split('\n');
  return lines.map(l => wrapLine(l, lang)).join('\n');
}

// ════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════

const LC = {
  html:'var(--html)',css:'var(--css)',js:'var(--js)',
  php:'var(--php)',react:'var(--react)',git:'var(--git)',
  mysql:'var(--mysql)',docker:'var(--docker)',api:'var(--api)',
  '.gitignore':'var(--git)'
};
const LN = {
  html:'HTML',css:'CSS',js:'JavaScript',php:'PHP',
  react:'React',git:'Git',mysql:'MySQL',
  docker:'Docker',api:'API / JWT','.gitignore':'Git'
};

let lang = 'all', search = '', filtered = [];

function setLang(l) {
  lang = l;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabCls = l === '.gitignore' ? 'git' : l;
  const tabEl = document.querySelector('.tab.' + tabCls);
  if (tabEl) tabEl.classList.add('active');
  render();
}
function doSearch() {
  search = document.getElementById('search').value.toLowerCase();
  render();
}

function copyCard(btn, idx) {
  navigator.clipboard.writeText(filtered[idx].code)
    .then(() => { btn.textContent='✓ Copié !'; btn.classList.add('ok'); })
    .catch(() => {
      const ta=document.createElement('textarea');
      ta.value=filtered[idx].code;
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent='✓ Copié !'; btn.classList.add('ok');
    });
  setTimeout(() => { btn.textContent='Copier'; btn.classList.remove('ok'); }, 2000);
}

function render() {
  const main  = document.getElementById('main');
  const badge = document.getElementById('badge');

  filtered = RAW.filter(d => {
    if (lang !== 'all' && d.lang !== lang) return false;
    if (!search) return true;
    const q = search;
    return d.title.toLowerCase().includes(q) ||
           d.cat.toLowerCase().includes(q)   ||
           (d.desc||'').toLowerCase().includes(q) ||
           d.code.toLowerCase().includes(q);
  });

  badge.textContent = filtered.length + ' fiche' + (filtered.length !== 1 ? 's' : '');

  if (!filtered.length) {
    main.innerHTML = '<div class="no-result"><div class="ico">🔍</div>'
      + '<p style="font-size:.9rem">Aucun résultat pour <strong style="color:var(--text)">'
      + esc(search) + '</strong></p></div>';
    return;
  }

  const groups = {};
  filtered.forEach((d, i) => {
    const k = d.lang + '|' + d.cat;
    if (!groups[k]) groups[k] = { lang: d.lang, cat: d.cat, items: [] };
    groups[k].items.push({ d, i });
  });

  let html = '';
  for (const g of Object.values(groups)) {
    html += '<div class="section">';
    html += '<div class="section-title">'
          + '<div class="dot" style="background:' + LC[g.lang] + '"></div>'
          + LN[g.lang] + ' &bull; ' + esc(g.cat)
          + '</div>';
    html += '<div class="cards">';

    for (const { d, i } of g.items) {
      const highlighted = highlight(d.code, d.lang);
      html += '<div class="card">'
            + '<div class="card-header">'
            + '<span class="card-title">' + esc(d.title) + '</span>'
            + '<span class="card-tag tag-' + d.lang + '">' + LN[d.lang] + '</span>'
            + '</div>'
            + '<div class="card-code">'
            + '<button class="copy-btn" onclick="copyCard(this,' + i + ')">Copier</button>'
            + '<pre>' + highlighted + '</pre>'
            + '</div>';
      if (d.desc) {
        html += '<div class="card-desc">'
              + '<span class="card-desc-icon">💡</span>'
              + esc(d.desc)
              + '</div>';
      }
      html += '</div>';
    }

    html += '</div></div>';
  }

  main.innerHTML = html;
}

render();
</script>
