<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Cheatsheet DWWM — Real Conseil</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:#30363d;
  --text:#e6edf3;--muted:#8b949e;--muted2:#6e7681;
  --html:#f97316;--css:#60a5fa;--js:#fbbf24;--php:#a78bfa;
  --react:#38bdf8;--git:#fb7185;--mysql:#34d399;
  --green:#22c55e;--accent:#f59e0b;
  /* Syntax highlighting */
  --syn-kw:   #ff7b72;   /* keywords */
  --syn-fn:   #d2a8ff;   /* functions */
  --syn-str:  #a5d6ff;   /* strings */
  --syn-num:  #79c0ff;   /* numbers */
  --syn-cmt:  #8b949e;   /* comments */
  --syn-tag:  #7ee787;   /* html tags */
  --syn-attr: #ffa657;   /* attributes */
  --syn-sel:  #ff7b72;   /* css selectors */
  --syn-prop: #79c0ff;   /* css properties */
  --syn-val:  #a5d6ff;   /* css values */
  --syn-var:  #e6edf3;   /* variables */
  --syn-op:   #ff7b72;   /* operators */
  --syn-sql:  #ff7b72;   /* sql keywords */
  --syn-php:  #f97316;   /* php keywords */
  --docker:   #2496ed;   /* Docker blue */
  --api:      #a3e635;   /* API green */
}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#0d1117 0%,#161b22 100%);
  border-bottom:1px solid var(--border);
  padding:.8rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg,var(--accent),#f97316);
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.brand-text{line-height:1.2}
.brand-title{font-size:.88rem;font-weight:700}
.brand-sub{font-size:.6rem;color:var(--muted);letter-spacing:.05em}
.search-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:6px 14px;flex:1;max-width:380px;
  transition:border-color .2s;
}
.search-wrap:focus-within{border-color:#555}
.search-wrap svg{flex-shrink:0;opacity:.5}
.search-wrap input{
  background:none;border:none;color:var(--text);
  font-family:'Sora',sans-serif;font-size:.82rem;
  width:100%;outline:none;
}
.search-wrap input::placeholder{color:var(--muted)}
.badge{
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);padding:4px 10px;border-radius:20px;
  font-size:.65rem;font-weight:600;white-space:nowrap;
}

/* ── TABS ── */
.tabs{
  display:flex;gap:4px;padding:.8rem 1.5rem .4rem;
  border-bottom:1px solid var(--border);background:var(--bg);
  position:sticky;top:57px;z-index:99;overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:5px 13px;border-radius:7px;border:1px solid transparent;
  cursor:pointer;font-family:'Sora',sans-serif;font-size:.74rem;font-weight:600;
  transition:all .15s;color:var(--muted);background:none;
  white-space:nowrap;flex-shrink:0;
}
.tab:hover{color:var(--text);background:var(--surface)}
.tab.all.active  {background:var(--surface2);color:var(--accent);border-color:var(--accent)}
.tab.html.active {background:rgba(249,115,22,.2);color:var(--html);border-color:var(--html)}
.tab.css.active  {background:rgba(96,165,250,.15);color:var(--css);border-color:var(--css)}
.tab.js.active   {background:rgba(251,191,36,.15);color:var(--js);border-color:var(--js)}
.tab.php.active  {background:rgba(167,139,250,.15);color:var(--php);border-color:var(--php)}
.tab.react.active{background:rgba(56,189,248,.12);color:var(--react);border-color:var(--react)}
.tab.git.active  {background:rgba(251,113,133,.15);color:var(--git);border-color:var(--git)}
.tab.mysql.active{background:rgba(52,211,153,.12);color:var(--mysql);border-color:var(--mysql)}
.tab.docker.active{background:rgba(36,150,237,.15);color:var(--docker);border-color:var(--docker)}
.tab.api.active   {background:rgba(163,230,53,.12);color:var(--api);border-color:var(--api)}

/* ── LAYOUT ── */
.main{padding:1.2rem 1.5rem;max-width:1600px;margin:0 auto}

/* ── SECTIONS ── */
.section{margin-bottom:1.8rem}
.section-title{
  font-size:.6rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.12em;color:var(--muted);
  margin-bottom:.7rem;padding-bottom:5px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── GRILLE DE CARTES ── */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:.65rem;
}

/* ── CARTE ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;
  transition:border-color .15s,transform .12s,box-shadow .15s;
  display:flex;flex-direction:column;
}
.card:hover{
  border-color:#555;
  transform:translateY(-2px);
  box-shadow:0 8px 28px rgba(0,0,0,.5);
}
.card-header{
  padding:.55rem .85rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);gap:8px;
}
.card-title{font-size:.78rem;font-weight:600;line-height:1.3}
.card-tag{
  font-size:.55rem;font-weight:700;padding:2px 7px;
  border-radius:5px;text-transform:uppercase;flex-shrink:0;
}
.tag-html {background:rgba(249,115,22,.15);color:var(--html)}
.tag-css  {background:rgba(96,165,250,.12);color:var(--css)}
.tag-js   {background:rgba(251,191,36,.12);color:var(--js)}
.tag-php  {background:rgba(167,139,250,.15);color:var(--php)}
.tag-react{background:rgba(56,189,248,.1);color:var(--react)}
.tag-git  {background:rgba(251,113,133,.12);color:var(--git)}
.tag-mysql {background:rgba(52,211,153,.1);color:var(--mysql)}
.tag-docker{background:rgba(36,150,237,.12);color:var(--docker)}
.tag-api   {background:rgba(163,230,53,.1);color:var(--api)}
.tag--gitignore{background:rgba(251,113,133,.12);color:var(--git)}

/* ── BLOC CODE ── */
.card-code{
  padding:.7rem .85rem;
  font-family:'JetBrains Mono',monospace;font-size:.68rem;
  line-height:1.8;position:relative;flex:1;
  background:rgba(0,0,0,.2);
  overflow-x:auto;
}
pre{white-space:pre;tab-size:2}

/* ── BOUTON COPIER ── */
.copy-btn{
  position:absolute;top:6px;right:6px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--muted);padding:2px 8px;border-radius:5px;
  font-size:.58rem;cursor:pointer;font-family:'Sora',sans-serif;
  transition:all .15s;opacity:0;font-weight:600;
}
.card:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--text);border-color:#777}
.copy-btn.ok{color:var(--green);border-color:var(--green);opacity:1}

/* ── DESCRIPTION ── */
.card-desc{
  padding:.4rem .85rem .65rem;font-size:.67rem;
  color:var(--muted);line-height:1.55;
  border-top:1px solid var(--border);
}
.card-desc-icon{color:var(--accent);margin-right:4px}

/* ── NO RESULT ── */
.no-result{
  text-align:center;padding:5rem 2rem;color:var(--muted);
}
.no-result .ico{font-size:3rem;margin-bottom:1rem;opacity:.5}

/* ─── SYNTAX HIGHLIGHTING ─── */
/* HTML */
.lt{color:var(--muted2)}
.htag{color:var(--syn-tag)}
.hattr{color:var(--syn-attr)}
.hval{color:var(--syn-str)}
.hcmt{color:var(--syn-cmt);font-style:italic}

/* CSS */
.csel{color:var(--syn-sel)}
.cprop{color:var(--syn-prop)}
.cval{color:var(--syn-val)}
.ccmt{color:var(--syn-cmt);font-style:italic}
.cpseudo{color:var(--syn-fn)}
.cat{color:var(--accent)}

/* JS */
.jkw{color:var(--syn-kw)}
.jfn{color:var(--syn-fn)}
.jstr{color:var(--syn-str)}
.jnum{color:var(--syn-num)}
.jcmt{color:var(--syn-cmt);font-style:italic}
.jop{color:var(--syn-kw)}
.jclass{color:#ffa657}
.jtpl{color:var(--syn-str)}

/* PHP */
.pkw{color:var(--syn-php)}
.pfn{color:var(--syn-fn)}
.pstr{color:var(--syn-str)}
.pnum{color:var(--syn-num)}
.pcmt{color:var(--syn-cmt);font-style:italic}
.pvar{color:#79c0ff}
.ptype{color:#ffa657}

/* React */
.rtag{color:var(--syn-tag)}
.rprop{color:var(--syn-attr)}

/* SQL */
.skw{color:var(--syn-sql);font-weight:600}
.sfn{color:var(--syn-fn)}
.sstr{color:var(--syn-str)}
.snum{color:var(--syn-num)}
.scmt{color:var(--syn-cmt);font-style:italic}
.stype{color:#ffa657}

@media(max-width:640px){
  .header{padding:.6rem 1rem}
  .tabs{padding:.6rem 1rem .3rem;top:52px}
  .main{padding:.8rem 1rem}
  .cards{grid-template-columns:1fr}
}
</style>
</head>

cinput type=\"radio\" name=\"plan\" value=\"pro\"/\u003e\n    Pro\n  \u003c/label\u003e\n\u003c/fieldset\u003e\n\n\u003c!-- Bouton avec icône uniquement --\u003e\n\u003cbutton type=\"button\" aria-label=\"Fermer\"\u003e✕\u003c/button\u003e"}, {"lang": "html", "cat": "Tableaux", "title": "Tableau HTML complet", "desc": "caption décrit le tableau. scope améliore l'accessibilité. colspan/rowspan fusionnent des cellules.", "code": "\u003ctable\u003e\n  \u003ccaption\u003eRésultats des étudiants\u003c/caption\u003e\n  \u003cthead\u003e\n    \u003ctr\u003e\n      \u003cth scope=\"col\"\u003eNom\u003c/th\u003e\n      \u003cth scope=\"col\"\u003eNote\u003c/th\u003e\n      \u003cth scope=\"col\"\u003eMention\u003c/th\u003e\n    \u003c/tr\u003e\n  \u003c/thead\u003e\n  \u003ctbody\u003e\n    \u003ctr\u003e\n      \u003ctd\u003eAlice Dupont\u003c/td\u003e\n      \u003ctd\u003e18/20\u003c/td\u003e\n      \u003ctd rowspan=\"2\"\u003eTrès bien\u003c/td\u003e\n    \u003c/tr\u003e\n    \u003ctr\u003e\n      \u003ctd\u003eBob Martin\u003c/td\u003e\n      \u003ctd\u003e17/20\u003c/td\u003e\n    \u003c/tr\u003e\n  \u003c/tbody\u003e\n  \u003ctfoot\u003e\n    \u003ctr\u003e\n      \u003cth scope=\"row\"\u003eMoyenne\u003c/th\u003e\n      \u003ctd colspan=\"2\"\u003e17.5/20\u003c/td\u003e\n    \u003c/tr\u003e\n  \u003c/tfoot\u003e\n\u003c/table\u003e"}, {"lang": "html", "cat": "SEO", "title": "Balises meta \u0026 Open Graph", "desc": "Les meta influencent le SEO. Open Graph contrôle l'aperçu sur les réseaux sociaux.", "code": "\u003chead\u003e\n  \u003ctitle\u003eTitre (50-60 cars) · Site\u003c/title\u003e\n  \u003cmeta name=\"description\" content=\"Description (150-160 cars)\"/\u003e\n  \u003clink rel=\"canonical\" href=\"https://site.fr/page\"/\u003e\n\n  \u003c!-- Open Graph (Facebook, LinkedIn) --\u003e\n  \u003cmeta property=\"og:type\"        content=\"website\"/\u003e\n  \u003cmeta property=\"og:title\"       content=\"Titre\"/\u003e\n  \u003cmeta property=\"og:description\" content=\"Description\"/\u003e\n  \u003cmeta property=\"og:image\"       content=\"img.jpg\"/\u003e\n  \u003cmeta property=\"og:url\"         content=\"https://…\"/\u003e\n\n  \u003c!-- Twitter Card --\u003e\n  \u003cmeta name=\"twitter:card\"  content=\"summary_large_image\"/\u003e\n  \u003cmeta name=\"twitter:title\" content=\"Titre\"/\u003e\n\n  \u003c!-- Favicon --\u003e\n  \u003clink rel=\"icon\" href=\"/favicon.ico\"/\u003e\n\u003c/head\u003e"}, {"lang": "html", "cat": "Avancé", "title": "Attributs data-* \u0026 ARIA", "desc": "data-* stocke des données accessibles via JS dataset. Les attributs ARIA améliorent l'accessibilité.", "code": "\u003c!-- data-* : stocker des données --\u003e\n\u003cbutton class=\"btn-delete\"\n        data-user-id=\"42\"\n        data-confirm=\"Supprimer cet utilisateur ?\"\u003e\n  Supprimer\n\u003c/button\u003e\n\n\u003c!-- btn.dataset.userId  → \"42\" --\u003e\n\u003c!-- btn.dataset.confirm → \"Supprimer…\" --\u003e\n\n\u003c!-- ARIA : accessibilité --\u003e\n\u003cnav aria-label=\"Navigation principale\"\u003e\n  \u003ca href=\"/\" aria-current=\"page\"\u003eAccueil\u003c/a\u003e\n\u003c/nav\u003e\n\n\u003cbutton aria-expanded=\"false\"\n        aria-controls=\"menu\"\n        aria-haspopup=\"true\"\u003eMenu\u003c/button\u003e\n\u003cul id=\"menu\" role=\"menu\" hidden\u003e\n  \u003cli role=\"menuitem\"\u003e\u003ca href=\"/a\"\u003eLien\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003c!-- Rôles ARIA courants --\u003e\n\u003c!-- role=\"alert\"       → message urgent --\u003e\n\u003c!-- role=\"dialog\"      → modal --\u003e\n\u003c!-- aria-live=\"polite\" → zone mise à jour --\u003e\n\u003c!-- aria-hidden=\"true\" → masquer aux SR --\u003e"}, {"lang": "html", "cat": "Avancé", "title": "details, dialog \u0026 template", "desc": "details/summary = accordéon natif. dialog = modal native HTML. template = HTML inerte clonable en JS.", "code": "\u003c!-- Accordéon natif --\u003e\n\u003cdetails open\u003e\n  \u003csummary\u003eCliquer pour développer\u003c/summary\u003e\n  \u003cp\u003eContenu affiché/masqué par le navigateur.\u003c/p\u003e\n\u003c/details\u003e\n\n\u003c!-- Dialog (modal native) --\u003e\n\u003cdialog id=\"modal\"\u003e\n  \u003ch2\u003eTitre de la modal\u003c/h2\u003e\n  \u003cp\u003eContenu de la modal.\u003c/p\u003e\n  \u003cform method=\"dialog\"\u003e\n    \u003cbutton\u003eFermer\u003c/button\u003e\n  \u003c/form\u003e\n\u003c/dialog\u003e\n\u003cbutton onclick=\"document.getElementById('modal').showModal()\"\u003e\n  Ouvrir\n\u003c/button\u003e\n\n\u003c!-- Template (non rendu, clonable) --\u003e\n\u003ctemplate id=\"card-tpl\"\u003e\n  \u003carticle class=\"card\"\u003e\n    \u003ch3 class=\"card-title\"\u003e\u003c/h3\u003e\n    \u003cp  class=\"card-body\"\u003e\u003c/p\u003e\n  \u003c/article\u003e\n\u003c/template\u003e\n\n\u003c!-- Cloner en JS --\u003e\n\u003c!--\nconst tpl   = document.getElementById(\"card-tpl\");\nconst clone = tpl.content.cloneNode(true);\nclone.querySelector(\".card-title\").textContent = titre;\ncontainer.appendChild(clone);\n--\u003e"}, {"lang": "css", "cat": "Bases", "title": "Sélecteurs CSS", "desc": "Spécificité : id(100) \u003e classe(10) \u003e élément(1). :is(), :where(), :has() = sélecteurs modernes.", "code": ":root { }           /* document entier */\n* { }               /* tous les éléments */\np { }               /* élément */\n.classe { }         /* classe */\n#id { }             /* id */\n\n/* Combinateurs */\nnav a { }           /* descendant */\nnav \u003e a { }         /* enfant direct */\nh2 + p { }          /* adjacent immédiat */\nh2 ~ p { }          /* frères suivants */\n\n/* Attributs */\n[disabled] { }              /* existe */\n[type=\"text\"] { }           /* valeur exacte */\n[href^=\"https\"] { }         /* commence par */\n[href$=\".pdf\"] { }          /* finit par */\n[class*=\"btn\"] { }          /* contient */\n\n/* Pseudo-classes */\na:hover { }   a:focus { }   a:focus-visible { }\n:nth-child(2n) { }          /* éléments pairs */\n:nth-child(3n+1) { }        /* 1,4,7… */\n:first-child { }  :last-child { }\n:not(.active) { }\n:is(h1, h2, h3) { }         /* groupe */\n.parent:has(\u003e .child) { }   /* parent d'un enfant */\n\n/* Pseudo-éléments */\np::before { content: \"→ \"; }\np::after  { content: \"\"; display: block; }\n::selection { background: #fbbf24; }\n::placeholder { color: #9ca3af; }"}, {"lang": "css", "cat": "Bases", "title": "Box Model \u0026 Reset", "desc": "box-sizing: border-box = padding + border inclus dans width. À appliquer universellement.", "code": "/* Reset moderne */\n*, *::before, *::after {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\n.box {\n  /* Dimensions */\n  width: 300px;\n  height: 200px;\n  max-width: 100%;\n  min-height: 100px;\n\n  /* Padding (espace interne) */\n  padding: 20px;               /* tous côtés */\n  padding: 10px 20px;          /* haut/bas  gauche/droite */\n  padding: 5px 10px 15px 20px; /* haut droite bas gauche */\n\n  /* Margin (espace externe) */\n  margin: auto;                /* centrer horizontalement */\n  margin: 20px 0;              /* haut/bas seulement */\n\n  /* Bordure */\n  border: 2px solid #333;\n  border-radius: 8px;\n\n  /* Débordement */\n  overflow: hidden;\n  overflow-x: auto;\n}"}, {"lang": "css", "cat": "Positionnement", "title": "Display \u0026 Position", "desc": "Chaque display et position a un comportement précis. z-index ne fonctionne que sur éléments positionnés.", "code": "/* DISPLAY */\n.el { display: block; }         /* pleine largeur */\n.el { display: inline; }        /* dans le flux texte */\n.el { display: inline-block; }  /* les deux */\n.el { display: none; }          /* masqué et retiré */\n.el { visibility: hidden; }     /* masqué, garde la place */\n.el { opacity: 0; }             /* invisible, garde la place */\n\n/* POSITION */\n.el { position: static; }       /* défaut */\n.el { position: relative; }     /* repère pour enfants */\n.el { position: absolute; }     /* par rapport au parent positionné */\n.el { position: fixed; }        /* par rapport au viewport */\n.el { position: sticky; top: 0; }  /* colle au scroll */\n\n/* Décalage */\n.abs { position: absolute; top: 0; right: 0; }\n\n/* Centrage absolu */\n.centré {\n  position: absolute;\n  top: 50%; left: 50%;\n  transform: translate(-50%, -50%);\n}\n\n/* z-index */\n.modal   { z-index: 1000; }\n.overlay { z-index: 999; }"}, {"lang": "css", "cat": "Flexbox", "title": "Flexbox — Conteneur", "desc": "justify-content = axe principal (horizontal si row). align-items = axe secondaire. gap = espacement.", "code": ".container {\n  display: flex;\n\n  /* Direction */\n  flex-direction: row;            /* → (défaut) */\n  flex-direction: column;         /* ↓ */\n\n  /* Axe principal */\n  justify-content: flex-start;   /* ← */\n  justify-content: flex-end;     /* → */\n  justify-content: center;\n  justify-content: space-between;\n  justify-content: space-around;\n  justify-content: space-evenly;\n\n  /* Axe secondaire */\n  align-items: stretch;          /* défaut */\n  align-items: flex-start;\n  align-items: center;\n  align-items: flex-end;\n  align-items: baseline;\n\n  /* Retour à la ligne */\n  flex-wrap: wrap;\n\n  /* Espacement */\n  gap: 16px;\n  gap: 8px 16px;                 /* ligne colonne */\n}\n\n/* Centrage parfait */\n.center {\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 100vh;\n}"}, {"lang": "css", "cat": "Flexbox", "title": "Flexbox — Éléments", "desc": "flex: 1 = grandit. flex: 0 0 Xpx = taille fixe. align-self surcharge align-items du parent.", "code": ".item {\n  /* Raccourci flex: grow shrink basis */\n  flex: 1;           /* grandit pour occuper l'espace */\n  flex: 0 0 200px;   /* taille fixe 200px */\n  flex: 2;           /* grandit 2x plus que flex:1 */\n  flex: none;        /* ne grandit ni ne rétrécit */\n\n  /* Séparément */\n  flex-grow: 1;      /* facteur de croissance */\n  flex-shrink: 0;    /* ne rétrécit pas */\n  flex-basis: 150px; /* taille de base */\n\n  /* Alignement individuel */\n  align-self: center;\n  align-self: flex-end;\n  align-self: stretch;\n\n  /* Ordre (ne change pas le DOM) */\n  order: -1;         /* avant les autres */\n}\n\n/* Pattern : navbar */\n.navbar {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n\n/* Pattern : pousser dernier à droite */\n.nav-item:last-child { margin-left: auto; }"}, {"lang": "css", "cat": "Grid", "title": "CSS Grid — Conteneur", "desc": "repeat() + fr simplifient les colonnes. auto-fill + minmax() = grille responsive sans media queries.", "code": ".container {\n  display: grid;\n\n  /* Colonnes */\n  grid-template-columns: 200px 1fr 1fr;     /* mixte */\n  grid-template-columns: repeat(3, 1fr);    /* 3 égales */\n  grid-template-columns: repeat(auto-fill,\n    minmax(250px, 1fr));                    /* responsive ! */\n\n  /* Rangées */\n  grid-template-rows: auto 1fr auto;\n  grid-auto-rows: minmax(100px, auto);\n\n  /* Espacement */\n  gap: 20px;\n\n  /* Zones nommées */\n  grid-template-areas:\n    \"header  header  header\"\n    \"sidebar main    main\"\n    \"footer  footer  footer\";\n}\n\n.header  { grid-area: header; }\n.sidebar { grid-area: sidebar; }\n.main    { grid-area: main; }\n.footer  { grid-area: footer; }"}, {"lang": "css", "cat": "Grid", "title": "CSS Grid — Placement", "desc": "Numéros de ligne commencent à 1 (ou -1 depuis la fin). span = étendre sur N cases.", "code": ".item {\n  grid-column: 1 / 3;     /* de ligne 1 à 3 (2 colonnes) */\n  grid-column: 2 / -1;    /* de 2 jusqu'à la fin */\n  grid-column: span 2;    /* s'étend sur 2 colonnes */\n\n  grid-row: 1 / 3;        /* 2 rangées */\n  grid-row: span 2;\n\n  /* Alignement dans la cellule */\n  justify-self: center;   /* horizontal */\n  align-self: center;     /* vertical */\n  place-self: center;     /* raccourci */\n}\n\n/* Pleine largeur */\n.hero { grid-column: 1 / -1; }\n\n/* Alignement global */\n.container {\n  justify-items: center;\n  align-items: center;\n  place-items: center;    /* raccourci */\n}"}, {"lang": "css", "cat": "Responsive", "title": "Media Queries Mobile First", "desc": "Mobile First : styles de base = mobile, puis agrandir avec min-width. prefers-color-scheme = mode sombre.", "code": "/* Mobile = styles de base */\n.grid { grid-template-columns: 1fr; }\n\n/* Tablette ≥ 640px */\n@media (min-width: 640px) {\n  .grid { grid-template-columns: 1fr 1fr; }\n}\n\n/* Desktop ≥ 1024px */\n@media (min-width: 1024px) {\n  .grid { grid-template-columns: repeat(3, 1fr); }\n}\n\n/* Large ≥ 1280px */\n@media (min-width: 1280px) {\n  .container { max-width: 1200px; margin: auto; }\n}\n\n/* Mode sombre */\n@media (prefers-color-scheme: dark) {\n  :root { --bg: #111; --text: #eee; }\n}\n\n/* Mouvement réduit */\n@media (prefers-reduced-motion: reduce) {\n  * { animation: none !important; }\n}\n\n/* Impression */\n@media print {\n  .nav, .btn { display: none; }\n}"}, {"lang": "css", "cat": "Bases", "title": "Variables CSS \u0026 Thème", "desc": "Définir dans :root, utiliser avec var(). Surchargeables localement. JS peut les modifier.", "code": ":root {\n  --color-primary:  #3b82f6;\n  --color-success:  #22c55e;\n  --color-danger:   #ef4444;\n  --color-bg:       #ffffff;\n  --color-text:     #1f2937;\n  --color-muted:    #6b7280;\n  --color-border:   #e5e7eb;\n\n  --font-sans:  \"Inter\", system-ui, sans-serif;\n  --text-sm:    0.875rem;\n  --text-base:  1rem;\n  --text-xl:    1.25rem;\n\n  --space-2: 8px;   --space-4: 16px;\n  --space-6: 24px;  --space-8: 32px;\n\n  --radius: 8px;\n  --shadow: 0 1px 3px rgba(0,0,0,.1);\n  --shadow-lg: 0 10px 25px rgba(0,0,0,.15);\n}\n\n/* Thème sombre */\n[data-theme=\"dark\"] {\n  --color-bg:   #0f172a;\n  --color-text: #f1f5f9;\n}\n\n.btn {\n  background: var(--color-primary);\n  padding: var(--space-2) var(--space-4);\n  border-radius: var(--radius);\n}"}, {"lang": "css", "cat": "Animations", "title": "Transitions \u0026 Keyframes", "desc": "transition = changements d'état (hover, focus). @keyframes = animations autonomes répétables.", "code": ".btn {\n  transition:\n    background 0.2s ease,\n    transform  0.15s ease,\n    box-shadow 0.2s ease;\n}\n.btn:hover {\n  background: darkblue;\n  transform: translateY(-2px);\n  box-shadow: 0 8px 25px rgba(0,0,0,.2);\n}\n\n/* Timings disponibles */\n/* ease | ease-in | ease-out | ease-in-out | linear */\n/* cubic-bezier(0.4, 0, 0.2, 1) */\n\n@keyframes fadeUp {\n  from { opacity: 0; transform: translateY(30px); }\n  to   { opacity: 1; transform: translateY(0); }\n}\n\n.card {\n  animation: fadeUp 0.5s ease forwards;\n  animation-delay: 0.1s;\n}\n\n/* Spinner */\n@keyframes spin { to { transform: rotate(360deg); } }\n.loader { animation: spin 1s linear infinite; }\n\n/* Pulse */\n@keyframes pulse {\n  0%, 100% { transform: scale(1); }\n  50%       { transform: scale(1.05); }\n}\n.badge { animation: pulse 2s ease infinite; }"}, {"lang": "css", "cat": "Bases", "title": "Couleurs \u0026 Typographie", "desc": "clamp() pour une taille fluide. line-height sans unité = valeur relative. ellipsis pour le débordement.", "code": "/* Couleurs */\n.el {\n  color: #1f2937;\n  color: rgba(0, 0, 0, 0.5);\n  color: hsl(220, 13%, 18%);\n  background: linear-gradient(135deg, #667eea, #764ba2);\n  background: radial-gradient(circle, #fff, #000);\n}\n\n/* Typographie */\nbody {\n  font-family: \"Inter\", system-ui, sans-serif;\n  font-size: clamp(1rem, 2.5vw, 1.25rem); /* fluide */\n  font-weight: 400;\n  line-height: 1.6;\n  letter-spacing: 0.01em;\n}\n\nh1 {\n  font-size: clamp(2rem, 5vw, 4rem);\n  font-weight: 700;\n  line-height: 1.2;\n  letter-spacing: -0.02em;\n}\n\n/* Troncature 1 ligne */\n.truncate {\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n/* Troncature multi-lignes */\n.clamp-3 {\n  display: -webkit-box;\n  -webkit-line-clamp: 3;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n}"}, {"lang": "css", "cat": "Avancé", "title": "Ombres, Filtres \u0026 Glassmorphism", "desc": "box-shadow multi-couches. backdrop-filter = effet verre. filter applique des effets visuels.", "code": ".card {\n  box-shadow:\n    0 1px 3px rgba(0,0,0,.1),\n    0 10px 40px rgba(0,0,0,.08);\n  text-shadow: 0 2px 4px rgba(0,0,0,.3);\n}\n\n/* Glassmorphism */\n.glass {\n  background: rgba(255, 255, 255, 0.15);\n  backdrop-filter: blur(12px) saturate(180%);\n  border: 1px solid rgba(255,255,255,0.25);\n  border-radius: 16px;\n}\n\n/* Filtres image */\n.image {\n  filter: grayscale(100%);\n  filter: brightness(1.2) contrast(1.1);\n  filter: blur(4px);\n  filter: hue-rotate(90deg);\n  filter: sepia(50%);\n  filter: drop-shadow(0 4px 8px rgba(0,0,0,.3));\n}\nimg { filter: grayscale(100%); transition: filter 0.3s; }\nimg:hover { filter: grayscale(0%); }\n\n/* object-fit */\n.img-cover {\n  width: 100%; height: 300px;\n  object-fit: cover;\n  object-position: center;\n}\n\n/* aspect-ratio */\n.video { aspect-ratio: 16 / 9; width: 100%; }\n.avatar { aspect-ratio: 1; border-radius: 50%; }"}, {"lang": "css", "cat": "Avancé", "title": "Transforms 2D \u0026 3D", "desc": "Les transforms ne perturbent pas le flux. Combiner plusieurs dans le bon ordre. transform-origin contrôle le pivot.", "code": "/* Transforms 2D */\n.el {\n  transform: translateX(50px);\n  transform: translateY(-20px);\n  transform: translate(50px, -20px);\n  transform: rotate(45deg);\n  transform: scale(1.5);\n  transform: scaleX(2);\n  transform: skew(10deg, 5deg);\n\n  /* Combiner (ordre compte !) */\n  transform: translateY(-10px) scale(1.1) rotate(5deg);\n\n  /* Point d'origine */\n  transform-origin: top left;\n  transform-origin: 50% 100%;\n}\n\n/* Flip 3D */\n.card-3d {\n  perspective: 1000px;\n}\n.card-inner {\n  transform-style: preserve-3d;\n  transition: transform 0.6s;\n}\n.card-3d:hover .card-inner {\n  transform: rotateY(180deg);\n}\n.face-front, .face-back {\n  backface-visibility: hidden;\n}\n.face-back {\n  transform: rotateY(180deg);\n}"}, {"lang": "css", "cat": "Avancé", "title": "Scroll Snap", "desc": "Scroll snap crée des transitions fluides sans JavaScript. Idéal pour les sliders et pages full-scroll.", "code": ".slider {\n  display: flex;\n  overflow-x: auto;\n  scroll-snap-type: x mandatory;\n  scroll-behavior: smooth;\n  -webkit-overflow-scrolling: touch;\n  /* Masquer la scrollbar */\n  scrollbar-width: none;\n}\n.slider::-webkit-scrollbar { display: none; }\n\n.slide {\n  flex: 0 0 100%;\n  scroll-snap-align: start;\n  scroll-snap-stop: always;\n}\n\n/* Full-page scroll vertical */\n.pages {\n  height: 100vh;\n  overflow-y: scroll;\n  scroll-snap-type: y mandatory;\n}\n.page {\n  height: 100vh;\n  scroll-snap-align: start;\n}\n\n/* Grille avec snap horizontal */\n.gallery {\n  display: grid;\n  grid-auto-flow: column;\n  overflow-x: auto;\n  scroll-snap-type: x proximity;\n}\n.gallery \u003e * { scroll-snap-align: center; }"}, {"lang": "css", "cat": "Avancé", "title": "Pseudo-éléments décoratifs", "desc": "::before et ::after créent des éléments graphiques sans HTML. content est obligatoire (peut être vide).", "code": "/* Trait décoratif sous un titre */\n.titre {\n  position: relative;\n  display: inline-block;\n}\n.titre::after {\n  content: \"\";\n  position: absolute;\n  left: 0; bottom: -4px;\n  width: 100%; height: 3px;\n  background: var(--color-primary);\n  border-radius: 2px;\n}\n\n/* Badge */\n.badge-wrapper {\n  position: relative;\n  display: inline-block;\n}\n.badge-wrapper::after {\n  content: attr(data-count);  /* valeur de l'attribut */\n  position: absolute;\n  top: -8px; right: -8px;\n  background: red;\n  color: white;\n  font-size: .7rem;\n  padding: 2px 5px;\n  border-radius: 10px;\n}\n\n/* Séparateur */\n.divider {\n  display: flex;\n  align-items: center;\n  gap: 1rem;\n}\n.divider::before, .divider::after {\n  content: \"\";\n  flex: 1;\n  height: 1px;\n  background: var(--color-border);\n}"}, {"lang": "js", "cat": "Bases", "title": "Variables, Types \u0026 Conversion", "desc": "let et const remplacent var. typeof vérifie le type. Conversion explicite avec Number(), String(), Boolean().", "code": "let   texte   = \"Bonjour\";       // string\nlet   nombre  = 42;              // number\nconst PI      = 3.14159;         // constant\nlet   bool    = true;            // boolean\nlet   vide    = null;            // null\nlet   undef   = undefined;       // undefined\nconst sym     = Symbol(\"id\");    // symbol\nconst grand   = 9007199254740991n; // bigint\n\n// Vérification de type\ntypeof \"texte\"      // \"string\"\ntypeof 42           // \"number\"\ntypeof true         // \"boolean\"\ntypeof null         // \"object\"  ← bug historique !\ntypeof undefined    // \"undefined\"\ntypeof []           // \"object\"  ← utiliser Array.isArray()\ntypeof function(){} // \"function\"\nArray.isArray([])   // true\n\n// Conversion\nNumber(\"42\")     // 42\nNumber(\"\")       // 0\nNumber(\"abc\")    // NaN\nString(42)       // \"42\"\nBoolean(0)       // false\nBoolean(\"\")      // false\nBoolean(null)    // false\nBoolean({})      // true  (objet = toujours truthy !)\nBoolean([])      // true\n\n// Vérifier NaN\nisNaN(Number(\"abc\"))       // true\nNumber.isNaN(Number(\"abc\")) // true (plus strict)\nNumber.isFinite(Infinity)   // false"}, {"lang": "js", "cat": "Bases", "title": "Conditions \u0026 Opérateurs", "desc": "=== compare valeur ET type. ?? = null/undefined seulement. ?. = optional chaining (ne plante pas).", "code": "if (score \u003e= 90)      { console.log(\"A\"); }\nelse if (score \u003e= 70) { console.log(\"B\"); }\nelse                  { console.log(\"C\"); }\n\n// Ternaire\nconst msg = age \u003e= 18 ? \"Majeur\" : \"Mineur\";\n\n// Nullish coalescing ?? (null ou undefined seulement)\nconst nom = data.nom ?? \"Inconnu\";\nconst val = 0 ?? \"défaut\";  // → 0  (0 n'est pas null)\n\n// Optional chaining ?. (ne plante pas si undefined)\nconst cp   = user?.adresse?.cp;\nconst fn   = obj?.methode?.();\n\n// Nullish assignment\nobj.valeur  ??= \"défaut\";   // assigne si null/undefined\nobj.count   ||= 0;          // assigne si falsy\nobj.count   \u0026\u0026= obj.count + 1; // assigne si truthy\n\n// Opérateurs de comparaison\n===  // égalité stricte (valeur + type)  ← toujours utiliser ça\n!==  // inégalité stricte\n==   // égalité laxe  ← éviter\n\u003e  \u003e=  \u003c  \u003c=\n\n// Switch\nswitch (statut) {\n  case \"actif\":   traiter(); break;\n  case \"inactif\": archiver(); break;\n  default: console.warn(\"Inconnu\");\n}"}, {"lang": "js", "cat": "Bases", "title": "Boucles \u0026 Itération", "desc": "for...of = valeurs (tableaux, Map, Set). for...in = clés (objets). entries() pour avoir index + valeur.", "code": "const fruits = [\"pomme\", \"poire\", \"kiwi\"];\nconst user   = { nom: \"Alice\", age: 25 };\n\n// for classique\nfor (let i = 0; i \u003c fruits.length; i++) {\n  console.log(i, fruits[i]);\n}\n\n// for...of (valeurs)\nfor (const fruit of fruits) {\n  if (fruit === \"poire\") continue;\n  console.log(fruit);\n}\n\n// for...of avec index\nfor (const [i, v] of fruits.entries()) {\n  console.log(i, v);\n}\n\n// for...in (clés d'objet)\nfor (const cle in user) {\n  if (!user.hasOwnProperty(cle)) continue;\n  console.log(cle, \":\", user[cle]);\n}\n\n// forEach\nfruits.forEach((fruit, index) =\u003e {\n  console.log(index, fruit);\n});\n\n// while\nlet n = 0;\nwhile (n \u003c 5) { n++; }\n\n// break avec label\nouter: for (let i = 0; i \u003c 3; i++) {\n  for (let j = 0; j \u003c 3; j++) {\n    if (i === j) break outer;\n  }\n}"}, {"lang": "js", "cat": "Fonctions", "title": "Fonctions \u0026 Arrow Functions", "desc": "Déclarées = hoistées. Arrow functions = this lexical. Paramètres rest avec ... (doit être le dernier).", "code": "// Déclaration (hoistée)\nfunction add(a, b) { return a + b; }\n\n// Expression\nconst multiply = function(a, b) { return a * b; };\n\n// Arrow — corps court (return implicite)\nconst add2   = (a, b) =\u003e a + b;\nconst double = x =\u003e x * 2;\nconst greet  = () =\u003e \"Bonjour !\";\n\n// Arrow — corps long\nconst log = (msg, level = \"info\") =\u003e {\n  console.log(`[${level}] ${msg}`);\n};\n\n// Paramètre rest (...)\nconst sum = (...nums) =\u003e nums.reduce((a, b) =\u003e a + b, 0);\nsum(1, 2, 3, 4); // 10\n\n// Spread à l'appel\nconst args = [1, 2, 3];\nMath.max(...args); // 3\n\n// Déstructuration dans les paramètres\nconst greetUser = ({ nom, age = 18 }) =\u003e\n  `${nom} a ${age} ans`;\n\n// Retour d'objet (parenthèses obligatoires)\nconst toObj = (x, y) =\u003e ({ x, y });\n\n// IIFE\n(() =\u003e { console.log(\"exécuté immédiatement\"); })();"}, {"lang": "js", "cat": "Tableaux", "title": "Méthodes tableau — Transformation", "desc": "map/filter/reduce créent de nouveaux tableaux. Enchaînables. find retourne l'élément, findIndex l'index.", "code": "const produits = [\n  { id:1, nom:\"Stylo\",  prix:1.50, stock:100 },\n  { id:2, nom:\"Cahier\", prix:3.20, stock:0   },\n  { id:3, nom:\"Règle\",  prix:2.00, stock:50  },\n];\n\n// map — transformer\nconst noms = produits.map(p =\u003e p.nom);\n// [\"Stylo\", \"Cahier\", \"Règle\"]\n\n// filter — filtrer\nconst dispo = produits.filter(p =\u003e p.stock \u003e 0);\n\n// reduce — accumuler\nconst total = produits.reduce((acc, p) =\u003e acc + p.prix, 0);\n// 6.70\n\n// find — premier correspondant\nconst cahier = produits.find(p =\u003e p.nom === \"Cahier\");\n\n// findIndex\nconst idx = produits.findIndex(p =\u003e p.id === 2);\n\n// some / every\nconst aDesRuptures = produits.some(p =\u003e p.stock === 0);\nconst tousDispo    = produits.every(p =\u003e p.stock \u003e 0);\n\n// Enchaîner\nconst labels = produits\n  .filter(p =\u003e p.stock \u003e 0)\n  .map(p =\u003e `${p.nom} (${p.prix}€)`)\n  .join(\", \");\n\n// flat / flatMap\n[[1,2],[3,4]].flat();              // [1,2,3,4]\n[[1,2]].flatMap(x =\u003e x.map(n =\u003e n*2)); // [2,4]"}, {"lang": "js", "cat": "Tableaux", "title": "Méthodes tableau — Manipulation", "desc": "slice = copie sans modifier. splice = modifie. sort avec comparateur. Array.from() crée depuis itérable.", "code": "let arr = [3, 1, 4, 1, 5, 9, 2, 6];\n\n// Ajouter / supprimer\narr.push(7);           // fin     → retourne nouvelle longueur\narr.unshift(0);        // début\narr.pop();             // supprime fin   → retourne élément\narr.shift();           // supprime début → retourne élément\n\n// slice (copie, non-destructif)\narr.slice(1, 4);       // [1, 4, 1]\narr.slice(-2);         // [2, 6]\n\n// splice (modifie, destructif)\narr.splice(2, 1);           // supprime 1 à l'index 2\narr.splice(1, 0, 99, 100);  // insère sans supprimer\n\n// Trier\narr.sort((a, b) =\u003e a - b);          // croissant\narr.sort((a, b) =\u003e b - a);          // décroissant\nproduits.sort((a, b) =\u003e a.prix - b.prix);\nproduits.sort((a, b) =\u003e a.nom.localeCompare(b.nom, 'fr'));\n\n// Chercher\narr.includes(5);       // true\narr.indexOf(5);        // position ou -1\n\n// Copie\nconst copie = [...arr];\nconst merge = [...arr, ...autre];\n\n// Créer\nArray.from({ length: 5 }, (_, i) =\u003e i + 1); // [1,2,3,4,5]\nArray.from(\"hello\");  // [\"h\",\"e\",\"l\",\"l\",\"o\"]\nArray(5).fill(0);     // [0,0,0,0,0]"}, {"lang": "js", "cat": "Objets", "title": "Objets — Déstructuration \u0026 Spread", "desc": "La déstructuration simplifie l'extraction. Le spread copie (superficiellement). Object.entries() pour itérer.", "code": "const user = { nom:\"Alice\", age:25, ville:\"Paris\", role:\"admin\" };\n\n// Déstructuration\nconst { nom, age } = user;\nconst { ville: city } = user;        // renommer\nconst { pays = \"France\" } = user;    // valeur par défaut\nconst { role, ...base } = user;      // rest\n\n// Dans les paramètres\nconst greet = ({ nom, age = 18 }) =\u003e `${nom} a ${age} ans`;\n\n// Déstructuration de tableau\nconst [a, b, , d] = [1, 2, 3, 4]; // ignorer 3e\nconst [first, ...rest] = arr;\n\n// Spread (copie superficielle)\nconst userMaj = { ...user, age: 26 };\nconst merged  = { ...defaults, ...overrides };\n\n// Méthodes statiques\nObject.keys(user)    // [\"nom\",\"age\",\"ville\",\"role\"]\nObject.values(user)  // [\"Alice\",25,\"Paris\",\"admin\"]\nObject.entries(user) // [[\"nom\",\"Alice\"],...]\n\nObject.assign({}, user, { age: 26 });\nObject.freeze(user);  // immuable\nObject.fromEntries([[\"a\",1],[\"b\",2]]); // { a:1, b:2 }\n\n// Raccourcis ES6\nconst x = 1, y = 2;\nconst point = { x, y };      // { x:1, y:2 }\n\n// Clé dynamique\nconst key = \"couleur\";\nconst obj = { [key]: \"rouge\" }; // { couleur:\"rouge\" }\n\n// Optional chaining\nuser?.adresse?.cp    // undefined sans erreur"}, {"lang": "js", "cat": "DOM", "title": "Sélection \u0026 Manipulation DOM", "desc": "querySelector retourne le 1er. querySelectorAll = NodeList. textContent plus sûr qu'innerHTML (évite XSS).", "code": "// Sélection\nconst el   = document.querySelector(\".btn\");\nconst tous = document.querySelectorAll(\"li\");\nconst form = document.getElementById(\"monForm\");\n\n// Relatif\nconst parent  = el.parentElement;\nconst suivant = el.nextElementSibling;\nconst enfants = el.children;\n\n// Contenu\nel.textContent = \"Texte pur (sécurisé)\";\nel.innerHTML   = \"\u003cb\u003eHTML\u003c/b\u003e\";\nel.value       = \"valeur input\";\nel.checked     = true;\n\n// Attributs\nel.getAttribute(\"href\");\nel.setAttribute(\"aria-expanded\", \"true\");\nel.removeAttribute(\"disabled\");\nel.hasAttribute(\"required\");\nel.dataset.userId;   // data-user-id\n\n// Classes\nel.classList.add(\"active\", \"visible\");\nel.classList.remove(\"hidden\");\nel.classList.toggle(\"open\");\nel.classList.contains(\"active\");  // bool\nel.classList.replace(\"old\",\"new\");\n\n// Créer \u0026 insérer\nconst div = document.createElement(\"div\");\ndiv.className = \"card\";\ndiv.innerHTML = `\u003ch3\u003eTitre\u003c/h3\u003e`;\n\ndocument.body.appendChild(div);\nel.before(div);   el.after(div);\nel.prepend(div);  el.append(div);\n\n// Supprimer\nel.remove();\nel.innerHTML = \"\";  // vider les enfants"}, {"lang": "js", "cat": "DOM", "title": "Événements \u0026 Délégation", "desc": "addEventListener \u003e onclick. La délégation écoute le parent au lieu de chaque enfant (efficace pour listes).", "code": "// Écouter\nbtn.addEventListener(\"click\", handleClick);\nbtn.addEventListener(\"click\", handler, { once: true });\nbtn.addEventListener(\"keydown\", e =\u003e {\n  if (e.key === \"Enter\") submit();\n  if (e.key === \"Escape\") close();\n});\n\n// Supprimer\nbtn.removeEventListener(\"click\", handleClick);\n\n// Objet Event\nfunction handleClick(e) {\n  e.preventDefault();              // bloque comportement\n  e.stopPropagation();             // bloque remontée\n  console.log(e.target);          // élément cliqué\n  console.log(e.currentTarget);   // élément écouté\n  console.log(e.type);            // \"click\"\n}\n\n// Délégation (recommandé pour listes dynamiques)\ndocument.querySelector(\"#liste\")\n  .addEventListener(\"click\", e =\u003e {\n    const item = e.target.closest(\"li\");\n    if (!item) return;\n    console.log(item.dataset.id);\n  });\n\n// Émettre un événement personnalisé\nconst evt = new CustomEvent(\"mon-event\", {\n  detail: { id: 42 },\n  bubbles: true\n});\nel.dispatchEvent(evt);\n\n// DOMContentLoaded\ndocument.addEventListener(\"DOMContentLoaded\", () =\u003e {\n  // DOM prêt (avant les images)\n});"}, {"lang": "js", "cat": "Async", "title": "Promises \u0026 Async/Await", "desc": "async/await = syntaxe lisible sur les Promises. Promise.all = parallèle. Promise.allSettled = attend tous.", "code": "// Créer une Promise\nconst wait = (ms) =\u003e new Promise(res =\u003e setTimeout(res, ms));\n\n// Async / Await\nconst fetchUser = async (id) =\u003e {\n  try {\n    const res = await fetch(`/api/users/${id}`);\n    if (!res.ok) throw new Error(`HTTP ${res.status}`);\n    return await res.json();\n  } catch (err) {\n    console.error(\"Erreur:\", err.message);\n    throw err;\n  }\n};\n\n// Parallèle (plus rapide que séquentiel)\nconst [users, posts] = await Promise.all([\n  fetch(\"/api/users\").then(r =\u003e r.json()),\n  fetch(\"/api/posts\").then(r =\u003e r.json())\n]);\n\n// allSettled (attend tous, même si erreur)\nconst results = await Promise.allSettled([\n  fetch(\"/api/a\"), fetch(\"/api/b\")\n]);\nresults.forEach(r =\u003e {\n  if (r.status === \"fulfilled\") use(r.value);\n  else console.error(r.reason);\n});\n\n// race (premier arrivé gagne)\nconst winner = await Promise.race([\n  fetchData(),\n  wait(5000).then(() =\u003e { throw new Error(\"Timeout\"); })\n]);\n\n// any (premier succès)\nconst premier = await Promise.any([apiA(), apiB()]);"}, {"lang": "js", "cat": "Async", "title": "Fetch API — CRUD", "desc": "Fetch retourne une Promise. res.ok vérifie HTTP 200-299. AbortController annule une requête en cours.", "code": "// GET\nconst getUsers = async () =\u003e {\n  const res = await fetch(\"/api/users\");\n  if (!res.ok) throw new Error(`HTTP ${res.status}`);\n  return res.json();\n};\n\n// POST\nconst createUser = async (data) =\u003e\n  fetch(\"/api/users\", {\n    method:  \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(data)\n  }).then(r =\u003e r.json());\n\n// PUT (remplacement)\nconst updateUser = async (id, data) =\u003e\n  fetch(`/api/users/${id}`, {\n    method: \"PUT\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(data)\n  });\n\n// PATCH (partiel)\nconst patchUser = async (id, changes) =\u003e\n  fetch(`/api/users/${id}`, {\n    method: \"PATCH\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(changes)\n  });\n\n// DELETE\nconst deleteUser = async (id) =\u003e\n  fetch(`/api/users/${id}`, { method: \"DELETE\" });\n\n// AbortController (annuler)\nconst ctrl = new AbortController();\nconst res  = await fetch(\"/api/data\", { signal: ctrl.signal });\nctrl.abort();  // annuler\n\n// Upload fichier\nconst form = new FormData();\nform.append(\"photo\", fileInput.files[0]);\nfetch(\"/api/upload\", { method: \"POST\", body: form });"}, {"lang": "js", "cat": "Stockage", "title": "LocalStorage \u0026 SessionStorage", "desc": "localStorage persiste. sessionStorage = onglet seulement. Toujours JSON.stringify/parse pour les objets.", "code": "// localStorage\nlocalStorage.setItem(\"token\", \"abc123\");\nlocalStorage.getItem(\"token\");      // \"abc123\"\nlocalStorage.removeItem(\"token\");\nlocalStorage.clear();\n\n// Stocker un objet\nconst user = { nom: \"Alice\", role: \"admin\" };\nlocalStorage.setItem(\"user\", JSON.stringify(user));\nconst saved = JSON.parse(localStorage.getItem(\"user\"));\n\n// Utilitaire sécurisé\nconst storage = {\n  get: (k)    =\u003e {\n    try { return JSON.parse(localStorage.getItem(k) ?? \"null\"); }\n    catch { return null; }\n  },\n  set: (k, v) =\u003e localStorage.setItem(k, JSON.stringify(v)),\n  del: (k)    =\u003e localStorage.removeItem(k),\n};\n\n// sessionStorage (onglet seulement)\nsessionStorage.setItem(\"temp\", JSON.stringify(data));\n\n// Écouter les changements (entre onglets)\nwindow.addEventListener(\"storage\", (e) =\u003e {\n  console.log(e.key, e.newValue, e.oldValue);\n});"}, {"lang": "js", "cat": "Modules", "title": "Modules ES6", "desc": "Les modules ES6 sont le standard. type=module active le mode strict. Import dynamique pour le lazy loading.", "code": "// ── utils.js — Exporter ──\nexport const PI = 3.14159;\nexport const add = (a, b) =\u003e a + b;\nexport class User {\n  constructor(nom) { this.nom = nom; }\n}\n// Export par défaut (un seul par fichier)\nexport default class Api {\n  static get(url) { return fetch(url).then(r =\u003e r.json()); }\n}\n\n// ── main.js — Importer ──\nimport Api              from \"./utils.js\"; // défaut\nimport { PI, add }      from \"./utils.js\"; // nommés\nimport { add as sum }   from \"./utils.js\"; // alias\nimport * as utils       from \"./utils.js\"; // namespace\n\n// Import dynamique (lazy)\nconst { default: Chart } = await import(\"./chart.js\");\n\n// Re-exporter\nexport { add } from \"./utils.js\";\n\n// HTML\n// \u003cscript type=\"module\" src=\"main.js\"\u003e\u003c/script\u003e"}, {"lang": "js", "cat": "Classes", "title": "Classes ES6 \u0026 Héritage", "desc": "Les classes ES6 sont du sucre syntaxique sur les prototypes. # = privé (ES2022). static = méthode de classe.", "code": "class Animal {\n  static nombreTotal = 0;    // champ statique\n  nom;                       // champ public\n  #age;                      // champ privé (ES2022)\n\n  constructor(nom, age) {\n    this.nom = nom;\n    this.#age = age;\n    Animal.nombreTotal++;\n  }\n\n  // Getter / Setter\n  get age() { return this.#age; }\n  set age(v) {\n    if (v \u003c 0) throw new RangeError(\"Age invalide\");\n    this.#age = v;\n  }\n\n  parler() { return `${this.nom} fait un bruit`; }\n  toString() { return `Animal(${this.nom}, ${this.#age})`; }\n\n  static creer(nom, age) { return new Animal(nom, age); }\n}\n\n// Héritage\nclass Chien extends Animal {\n  #race;\n\n  constructor(nom, age, race) {\n    super(nom, age);   // OBLIGATOIRE avant this\n    this.#race = race;\n  }\n\n  parler() { return `${this.nom} aboie`; }\n}\n\nconst rex = new Chien(\"Rex\", 3, \"Labrador\");\nrex.parler();           // \"Rex aboie\"\nrex instanceof Animal;  // true\nAnimal.nombreTotal;     // 1"}, {"lang": "js", "cat": "Avancé", "title": "Map \u0026 Set", "desc": "Map = clés de tout type. Set = valeurs uniques. Utiles pour dédoublonner ou gérer des relations clé-valeur.", "code": "// ── Map ──\nconst map = new Map();\nmap.set(\"cle\", \"valeur\");\nmap.set(42, \"nombre comme clé\");\n\nmap.get(\"cle\");      // \"valeur\"\nmap.has(\"cle\");      // true\nmap.delete(\"cle\");\nmap.size;            // nb de paires\nmap.clear();\n\n// Créer depuis tableau\nconst users = new Map([\n  [1, { nom: \"Alice\" }],\n  [2, { nom: \"Bob\" }]\n]);\n\n// Itérer\nfor (const [key, val] of users) console.log(key, val);\n\n// Convertir\nconst obj = Object.fromEntries(map);\nconst m   = new Map(Object.entries(obj));\n\n// ── Set ──\nconst set = new Set([1, 2, 3, 2, 1]); // {1,2,3}\nset.add(4);\nset.has(3);    // true\nset.delete(2);\nset.size;      // 3\n\n// Dédoublonner un tableau\nconst unique = [...new Set([1, 2, 2, 3])]; // [1,2,3]\n\n// Opérations ensemblistes\nconst a = new Set([1,2,3,4]);\nconst b = new Set([3,4,5,6]);\nconst union        = new Set([...a, ...b]);          // {1,2,3,4,5,6}\nconst intersection = new Set([...a].filter(x =\u003e b.has(x))); // {3,4}\nconst difference   = new Set([...a].filter(x =\u003e !b.has(x))); // {1,2}"}, {"lang": "js", "cat": "Avancé", "title": "Gestion d'erreurs avancée", "desc": "Créer des classes d'erreur personnalisées permet de les distinguer et de les traiter différemment en cascade.", "code": "// Classes d'erreur personnalisées\nclass AppError extends Error {\n  constructor(message, code, data = null) {\n    super(message);\n    this.name = this.constructor.name;\n    this.code = code;\n    this.data = data;\n  }\n}\nclass ValidationError extends AppError {\n  constructor(field, message) {\n    super(message, \"VALIDATION_ERROR\", { field });\n  }\n}\nclass NotFoundError extends AppError {\n  constructor(resource, id) {\n    super(`${resource} #${id} introuvable`, \"NOT_FOUND\");\n  }\n}\n\n// Utilisation\nconst fetchUser = async (id) =\u003e {\n  if (!Number.isInteger(id))\n    throw new ValidationError(\"id\", \"L'ID doit être un entier\");\n\n  const res = await fetch(`/api/users/${id}`);\n  if (res.status === 404) throw new NotFoundError(\"User\", id);\n  if (!res.ok) throw new AppError(`HTTP ${res.status}`, \"NETWORK\");\n  return res.json();\n};\n\n// Attraper sélectivement\ntry {\n  const user = await fetchUser(\"abc\");\n} catch (err) {\n  if (err instanceof ValidationError)\n    showFieldError(err.data.field, err.message);\n  else if (err instanceof NotFoundError)\n    redirect(\"/404\");\n  else {\n    console.error(\"Erreur inconnue:\", err);\n    throw err; // re-throw\n  }\n}"}, {"lang": "js", "cat": "Avancé", "title": "RegExp — Expressions régulières", "desc": "Drapeaux : g=global, i=insensible, m=multiline. Groupes nommés (?\u003cnom\u003e...) pour lisibilité.", "code": "// Créer\nconst re = /hello/gi;\nconst re2 = new RegExp(\"hello\", \"gi\"); // dynamique\n\n// Méthodes\nconst str = \"Bonjour Alice, bonjour Bob !\";\n/bonjour/i.test(str);           // true\nstr.match(/bonjour/gi);         // [\"Bonjour\",\"bonjour\"]\nstr.search(/Alice/);            // 8\nstr.replace(/bonjour/gi, \"Salut\");\nstr.split(/,\\s*/);\n\n// Patterns courants\nconst emailRe    = /^[\\w.+-]+@[\\w-]+\\.[a-z]{2,}$/i;\nconst phoneRe    = /^(?:0|\\+33)[1-9]\\d{8}$/;\nconst cpRe       = /^\\d{5}$/;\nconst passwordRe = /^(?=.*[A-Z])(?=.*\\d).{8,}$/;\nconst slugRe     = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;\n\n// Groupes capturants\nconst dateRe = /(\\d{2})\\/(\\d{2})\\/(\\d{4})/;\nconst m = \"15/06/2024\".match(dateRe);\n// m[1]=\"15\", m[2]=\"06\", m[3]=\"2024\"\n\n// Groupes nommés\nconst { groups: { jour, mois, annee } } =\n  \"15/06/2024\".match(\n    /(?\u003cjour\u003e\\d{2})\\/(?\u003cmois\u003e\\d{2})\\/(?\u003cannee\u003e\\d{4})/\n  );\n\n// matchAll (toutes occurrences + groupes)\nconst matches = [...str.matchAll(/\\b(\\w+)/g)];\n\n// Caractères spéciaux\n// .  → tout  \\d → chiffre  \\w → [a-zA-Z0-9_]\n// \\s → espace  \\b → limite de mot\n// ?  → 0 ou 1   +  → 1+   *  → 0+   {n,m} → n à m\n// ^  → début  $  → fin  [abc] → a, b ou c"}, {"lang": "php", "cat": "Bases", "title": "Variables, Types \u0026 Affichage", "desc": "PHP est dynamiquement typé mais supporte le typage strict depuis PHP 7. Toujours === jamais ==.", "code": "\u003c?php\ndeclare(strict_types=1);\n\n$texte   = \"Bonjour\";     // string\n$nombre  = 42;            // int\n$decimal = 3.14;          // float\n$bool    = true;          // bool\n$vide    = null;          // null\n\n// Vérification\ngettype($texte);          // \"string\"\nis_string($texte);        // true\nis_int($nombre);          // true\nis_null($vide);           // true\n\n// Conversion\n$str = (string) 42;      // \"42\"\n$int = (int) \"42.5\";    // 42\n\n// Affichage\necho $texte;\necho \"Bonjour $texte !\";    // interpolation\necho \"Objet: {$obj-\u003enom}\";  // expression\nprint_r($tableau);           // lisible\nvar_dump($valeur);           // type + valeur\n\n// Heredoc (interpolation active)\n$html = \u003c\u003c\u003cEOT\n  \u003cdiv class=\"card\"\u003e\n    \u003ch2\u003e$texte\u003c/h2\u003e\n  \u003c/div\u003e\nEOT;\n\n// Nowdoc (pas d'interpolation)\n$raw = \u003c\u003c\u003c'EOT'\n  Le symbole $texte ne sera PAS remplacé.\nEOT;"}, {"lang": "php", "cat": "Bases", "title": "Conditions \u0026 Match", "desc": "match() = switch modernisé PHP 8 : strict, retourne une valeur, pas de fallthrough.", "code": "\u003c?php\n// if / elseif / else\nif ($age \u003e= 18) {\n    echo \"Majeur\";\n} elseif ($age \u003e= 16) {\n    echo \"Presque\";\n} else {\n    echo \"Mineur\";\n}\n\n// Ternaire\n$statut = $age \u003e= 18 ? \"Adulte\" : \"Enfant\";\n\n// Null coalescing (PHP 7+)\n$nom = $_GET[\"nom\"] ?? \"Inconnu\";\n$val = $a ?? $b ?? $c ?? \"défaut\"; // chaînable\n\n// Null coalescing assignment (PHP 7.4)\n$config[\"debug\"] ??= false;\n\n// Match (PHP 8+) — strict, sans fallthrough\n$label = match(true) {\n    $age \u003e= 65  =\u003e \"Sénior\",\n    $age \u003e= 18  =\u003e \"Adulte\",\n    $age \u003e= 13  =\u003e \"Adolescent\",\n    default     =\u003e \"Enfant\",\n};\n\n// Match sur valeur exacte\n$texte = match($code) {\n    200     =\u003e \"OK\",\n    404     =\u003e \"Non trouvé\",\n    500     =\u003e \"Erreur serveur\",\n    401,403 =\u003e \"Non autorisé\",  // plusieurs valeurs\n    default =\u003e \"Code inconnu\",\n};"}, {"lang": "php", "cat": "Tableaux", "title": "Tableaux PHP", "desc": "Les tableaux PHP sont des maps ordonnées polyvalentes. array_* offre de nombreuses fonctions natives.", "code": "\u003c?php\n// Indexé\n$fruits = [\"pomme\", \"poire\", \"banane\"];\n$fruits[] = \"kiwi\";          // ajouter en fin\ncount($fruits);               // 4\n\n// Associatif\n$user = [\n    \"nom\"   =\u003e \"Alice\",\n    \"age\"   =\u003e 25,\n    \"roles\" =\u003e [\"admin\", \"editor\"],\n];\necho $user[\"nom\"];            // Alice\necho $user[\"roles\"][0];      // admin\n\n// Fonctions utiles\narray_push($arr, $val);       // ajouter fin\narray_unshift($arr, $val);   // ajouter début\narray_pop($arr);              // supprimer fin\narray_shift($arr);            // supprimer début\n\nin_array(\"pomme\", $fruits);   // bool\narray_search(\"pomme\", $fruits); // index ou false\narray_key_exists(\"nom\", $user); // bool\n\n// Transformation\narray_map(fn($x) =\u003e $x * 2, $arr);\narray_filter($arr, fn($x) =\u003e $x \u003e 0);\narray_reduce($arr, fn($c, $i) =\u003e $c + $i, 0);\narray_unique($arr);\narray_flip($arr);             // échange clés/valeurs\narray_chunk($arr, 3);        // découper\narray_column($users, \"nom\"); // extraire colonne\narray_merge($a, $b);\n\n// Tri\nsort($arr);                   // indexé croissant\narsort($arr);                 // assoc par valeur desc\nksort($arr);                  // par clé\nusort($arr, fn($a,$b) =\u003e $a[\"age\"] \u003c=\u003e $b[\"age\"]);"}, {"lang": "php", "cat": "Boucles", "title": "Boucles PHP", "desc": "foreach est idéal pour les tableaux. \u0026 modifie par référence. break/continue acceptent un niveau.", "code": "\u003c?php\n// foreach simple\nforeach ($fruits as $fruit) {\n    echo $fruit . PHP_EOL;\n}\n\n// foreach avec clé\nforeach ($user as $cle =\u003e $valeur) {\n    echo \"$cle : $valeur\\n\";\n}\n\n// Modifier par référence (\u0026)\nforeach ($prix as \u0026$p) {\n    $p *= 1.20;   // +20%\n}\nunset($p); // LIBÉRER la référence !\n\n// for\nfor ($i = 0; $i \u003c 10; $i++) {\n    if ($i === 5) continue;\n    if ($i === 8) break;\n    echo $i;\n}\n\n// while\n$i = 0;\nwhile ($i \u003c 10) { $i++; }\n\n// do…while\ndo { $n = rand(1, 10); } while ($n !== 7);\n\n// Boucle BDD\nwhile ($row = $stmt-\u003efetch()) {\n    echo $row[\"nom\"];\n}\n\n// Déstructuration dans foreach\nforeach ($rows as [$id, $nom, $email]) { }\nforeach ($users as [\"nom\" =\u003e $nom]) { }"}, {"lang": "php", "cat": "Fonctions", "title": "Fonctions \u0026 Arrow Functions", "desc": "PHP 7 : typer paramètres et retour. PHP 7.4 : fn() = arrow function. PHP 8 : named arguments.", "code": "\u003c?php\n// Typée\nfunction add(int $a, int $b): int {\n    return $a + $b;\n}\n\n// Union types (PHP 8)\nfunction process(int|string $val): int|string {\n    return is_string($val) ? strtoupper($val) : $val * 2;\n}\n\n// Nullable\nfunction find(int $id): ?array { return null; }\n\n// Valeur par défaut\nfunction greet(string $nom, string $titre = \"M.\"): string {\n    return \"Bonjour $titre $nom\";\n}\n\n// Variadic\nfunction sum(int ...$nums): int {\n    return array_sum($nums);\n}\nsum(1, 2, 3); // 6\n\n// Named arguments (PHP 8)\ncreateUser(nom: \"Alice\", role: \"admin\"); // sauter age\n\n// Arrow function (PHP 7.4) — capture le scope parent\n$multiplicateur = 3;\n$triple = fn(int $x): int =\u003e $x * $multiplicateur;\n\n// Anonyme avec use\n$base = 10;\n$addBase = function(int $x) use ($base): int {\n    return $x + $base;\n};\n\n// Callable\nfunction appliquer(array $arr, callable $fn): array {\n    return array_map($fn, $arr);\n}"}, {"lang": "php", "cat": "Chaînes", "title": "Fonctions de chaînes", "desc": "PHP 8 ajoute str_contains/starts_with/ends_with. Utiliser mb_ pour les caractères Unicode (accents, emojis).", "code": "\u003c?php\n$str = \"  Bonjour le monde !  \";\n\nstrlen($str);                     // longueur octets\nmb_strlen($str, \"UTF-8\");        // longueur caractères\n\n// Nettoyage\ntrim($str);  ltrim($str);  rtrim($str);\n\n// Casse\nstrtolower($str);  strtoupper($str);\nucfirst($str);     ucwords($str);\n\n// Recherche (PHP 8)\nstr_contains($str, \"Bonjour\");   // bool\nstr_starts_with($str, \"Bonj\");   // bool\nstr_ends_with($str, \"!\");        // bool\nstrpos($str, \"monde\");           // position ou false\n\n// Remplacement\nstr_replace(\"monde\", \"terre\", $str);\npreg_replace(\"/\\s+/\", \" \", $str);\n\n// Extraction\nsubstr($str, 7, 5);              // sous-chaîne\n\n// Séparation / Assemblage\nexplode(\" \", $str);              // → tableau\nimplode(\", \", $arr);             // → chaîne\n\n// Formatage\nsprintf(\"Bonjour %s, tu as %d ans\", $nom, $age);\nnumber_format(1234567.89, 2, \",\", \" \"); // \"1 234 567,89\"\nstr_pad($val, 10, \"0\", STR_PAD_LEFT);\nstr_repeat(\"=-\", 20);\n\n// Nettoyage HTML\nstrip_tags($html);               // supprimer balises\nhtmlspecialchars_decode($str);   // décoder entités\nnl2br($str);                     // \\n → \u003cbr\u003e"}, {"lang": "php", "cat": "Superglobales", "title": "Superglobales, Sessions \u0026 Cookies", "desc": "JAMAIS faire confiance aux données $_GET/$_POST. Toujours valider avec filter_input avant utilisation.", "code": "\u003c?php\n// GET \u0026 POST\n$nom  = $_POST[\"nom\"]  ?? \"\";\n$page = $_GET[\"page\"]  ?? 1;\n\n// Filtrer (recommandé)\n$email = filter_input(INPUT_POST, \"email\",\n    FILTER_VALIDATE_EMAIL);\n$id    = filter_input(INPUT_GET, \"id\",\n    FILTER_VALIDATE_INT,\n    [\"options\" =\u003e [\"min_range\" =\u003e 1]]);\n\nfilter_var(\"42\", FILTER_VALIDATE_INT);\nfilter_var(\"test@mail.fr\", FILTER_VALIDATE_EMAIL);\nfilter_var(\"https://site.fr\", FILTER_VALIDATE_URL);\n\n// Sessions\nsession_start();\n$_SESSION[\"user_id\"] = 42;\n$_SESSION[\"role\"]    = \"admin\";\n$userId = $_SESSION[\"user_id\"] ?? null;\n\nsession_regenerate_id(true);  // anti-fixation\n$_SESSION = [];\nsession_destroy();\n\n// Cookies\nsetcookie(\"theme\", \"dark\", [\n    \"expires\"  =\u003e time() + 30 * 24 * 3600,\n    \"path\"     =\u003e \"/\",\n    \"secure\"   =\u003e true,    // HTTPS seulement\n    \"httponly\" =\u003e true,    // non accessible en JS\n    \"samesite\" =\u003e \"Lax\"\n]);\n$theme = $_COOKIE[\"theme\"] ?? \"light\";\n\n// Upload\n$file = $_FILES[\"photo\"];\nif ($file[\"error\"] === UPLOAD_ERR_OK) {\n    $ext     = strtolower(pathinfo($file[\"name\"], PATHINFO_EXTENSION));\n    $allowed = [\"jpg\",\"jpeg\",\"png\",\"webp\"];\n    if (in_array($ext, $allowed)) {\n        move_uploaded_file(\n            $file[\"tmp_name\"],\n            \"uploads/\" . uniqid() . \".\" . $ext\n        );\n    }\n}"}, {"lang": "php", "cat": "Sécurité", "title": "Sécurité PHP", "desc": "Hacher avec bcrypt/argon2. Échapper avec htmlspecialchars(). CSRF token sur chaque formulaire POST.", "code": "\u003c?php\n// ── Échapper l'affichage HTML (TOUJOURS) ──\necho htmlspecialchars($nom, ENT_QUOTES | ENT_HTML5, \"UTF-8\");\n\n// Utilitaire\nfunction h(string $str): string {\n    return htmlspecialchars($str, ENT_QUOTES | ENT_HTML5, \"UTF-8\");\n}\n\n// ── Mots de passe ──\n$hash = password_hash($mdp, PASSWORD_BCRYPT, [\"cost\" =\u003e 12]);\n// ou\n$hash = password_hash($mdp, PASSWORD_ARGON2ID);\n\nif (password_verify($mdp, $hash)) {\n    // Connexion OK\n}\nif (password_needs_rehash($hash, PASSWORD_ARGON2ID)) {\n    $hash = password_hash($mdp, PASSWORD_ARGON2ID);\n}\n\n// ── CSRF Token ──\nsession_start();\nif (empty($_SESSION[\"csrf\"])) {\n    $_SESSION[\"csrf\"] = bin2hex(random_bytes(32));\n}\n// Dans le HTML :\n// \u003cinput type=\"hidden\" name=\"csrf\" value=\"\u003c?= $_SESSION['csrf'] ?\u003e\"\u003e\n\n// Vérifier\nif (!hash_equals($_SESSION[\"csrf\"], $_POST[\"csrf\"] ?? \"\")) {\n    http_response_code(403);\n    die(\"Token CSRF invalide\");\n}\n\n// ── Headers de sécurité ──\nheader(\"X-Content-Type-Options: nosniff\");\nheader(\"X-Frame-Options: DENY\");\nheader(\"Content-Security-Policy: default-src 'self'\");\nheader(\"Referrer-Policy: strict-origin-when-cross-origin\");"}, {"lang": "php", "cat": "PDO", "title": "PDO — Connexion \u0026 SELECT", "desc": "PDO avec requêtes préparées empêche les injections SQL. FETCH_ASSOC retourne des tableaux associatifs.", "code": "\u003c?php\n// Connexion\ntry {\n    $pdo = new PDO(\n        \"mysql:host=localhost;dbname=ma_base;charset=utf8mb4\",\n        \"user\", \"password\",\n        [\n            PDO::ATTR_ERRMODE            =\u003e PDO::ERRMODE_EXCEPTION,\n            PDO::ATTR_DEFAULT_FETCH_MODE =\u003e PDO::FETCH_ASSOC,\n            PDO::ATTR_EMULATE_PREPARES   =\u003e false,\n        ]\n    );\n} catch (PDOException $e) {\n    error_log($e-\u003egetMessage());\n    die(\"Erreur de connexion\");\n}\n\n// SELECT tous\n$users = $pdo-\u003equery(\"SELECT * FROM users\")-\u003efetchAll();\n\n// SELECT paramétré (:nom)\n$stmt = $pdo-\u003eprepare(\"SELECT * FROM users WHERE id = :id\");\n$stmt-\u003eexecute([\"id\" =\u003e $id]);\n$user = $stmt-\u003efetch();\n\n// SELECT avec ? (ordre)\n$stmt = $pdo-\u003eprepare(\"SELECT * FROM users WHERE email = ?\");\n$stmt-\u003eexecute([$email]);\n\n// Pagination\n$page    = max(1, (int)($_GET[\"page\"] ?? 1));\n$perPage = 10;\n$offset  = ($page - 1) * $perPage;\n$stmt = $pdo-\u003eprepare(\n    \"SELECT * FROM users LIMIT :limit OFFSET :offset\"\n);\n$stmt-\u003ebindValue(\":limit\",  $perPage, PDO::PARAM_INT);\n$stmt-\u003ebindValue(\":offset\", $offset,  PDO::PARAM_INT);\n$stmt-\u003eexecute();\n$users = $stmt-\u003efetchAll();"}, {"lang": "php", "cat": "PDO", "title": "PDO — INSERT, UPDATE, DELETE \u0026 Transactions", "desc": "lastInsertId() récupère l'ID. rowCount() compte les lignes. Transactions pour opérations atomiques.", "code": "\u003c?php\n// INSERT\n$stmt = $pdo-\u003eprepare(\n    \"INSERT INTO users (nom, email, mdp)\n     VALUES (:nom, :email, :mdp)\"\n);\n$stmt-\u003eexecute([\n    \"nom\"   =\u003e $nom,\n    \"email\" =\u003e $email,\n    \"mdp\"   =\u003e password_hash($mdp, PASSWORD_BCRYPT),\n]);\n$newId = $pdo-\u003elastInsertId();\n\n// UPDATE\n$pdo-\u003eprepare(\"UPDATE users SET nom = :nom WHERE id = :id\")\n    -\u003eexecute([\"nom\" =\u003e $nom, \"id\" =\u003e $id]);\n$lignesMaj = $stmt-\u003erowCount();\n\n// DELETE\n$pdo-\u003eprepare(\"DELETE FROM users WHERE id = :id\")\n    -\u003eexecute([\"id\" =\u003e $id]);\n\n// TRANSACTION\ntry {\n    $pdo-\u003ebeginTransaction();\n\n    $stmt = $pdo-\u003eprepare(\n        \"INSERT INTO commandes (user_id, total) VALUES (?,?)\"\n    );\n    $stmt-\u003eexecute([$userId, $total]);\n    $cmdId = $pdo-\u003elastInsertId();\n\n    $stmtStock = $pdo-\u003eprepare(\n        \"UPDATE produits SET stock = stock - ? WHERE id = ?\"\n    );\n    foreach ($items as $item) {\n        $stmtStock-\u003eexecute([$item[\"qte\"], $item[\"id\"]]);\n    }\n\n    $pdo-\u003ecommit();\n} catch (PDOException $e) {\n    $pdo-\u003erollBack();\n    error_log($e-\u003egetMessage());\n    throw $e;\n}"}, {"lang": "php", "cat": "POO", "title": "Classes, Héritage \u0026 Interfaces", "desc": "PHP supporte la POO complète. Visibilité : public/protected/private. Interface = contrat. Trait = mixin.", "code": "\u003c?php\n// Interface\ninterface Repository {\n    public function find(int $id): ?array;\n    public function findAll(): array;\n    public function save(array $data): int;\n    public function delete(int $id): bool;\n}\n\n// Trait\ntrait Timestampable {\n    private ?DateTime $createdAt = null;\n    public function touch(): void {\n        $this-\u003ecreatedAt ??= new DateTime();\n    }\n}\n\n// Classe abstraite\nabstract class BaseModel {\n    abstract public function validate(): bool;\n    public function toArray(): array {\n        return get_object_vars($this);\n    }\n}\n\n// Classe concrète\nclass User extends BaseModel implements Repository {\n    use Timestampable;\n\n    public readonly string $email;\n\n    // Promoted properties (PHP 8)\n    public function __construct(\n        private string $nom,\n        string $email,\n        private string $role = \"user\"\n    ) {\n        $this-\u003eemail = strtolower($email);\n    }\n\n    public function validate(): bool {\n        return !empty($this-\u003enom)\n            \u0026\u0026 filter_var($this-\u003eemail, FILTER_VALIDATE_EMAIL);\n    }\n\n    public function __toString(): string {\n        return \"{$this-\u003enom} \u003c{$this-\u003eemail}\u003e\";\n    }\n\n    // … implémenter Repository\n}"}, {"lang": "php", "cat": "POO", "title": "Enum, Namespace \u0026 Autoload", "desc": "Enum remplace les constantes de classe depuis PHP 8.1. Les namespaces évitent les conflits de noms.", "code": "\u003c?php\n// Backed enum (PHP 8.1)\nenum Role: string {\n    case Admin  = \"admin\";\n    case Editor = \"editor\";\n    case User   = \"user\";\n\n    public function label(): string {\n        return match($this) {\n            Role::Admin  =\u003e \"Administrateur\",\n            Role::Editor =\u003e \"Éditeur\",\n            Role::User   =\u003e \"Utilisateur\",\n        };\n    }\n    public function canEdit(): bool {\n        return $this !== Role::User;\n    }\n}\n\n$role = Role::Admin;\n$role-\u003evalue;            // \"admin\"\n$role-\u003elabel();          // \"Administrateur\"\nRole::from(\"editor\");    // Role::Editor\nRole::tryFrom(\"x\");      // null (pas d'exception)\nRole::cases();           // [Role::Admin, ...]\n\n// Namespace\n// app/Models/User.php\nnamespace App\\Models;\n\nuse App\\Contracts\\Identifiable;\nuse DateTime;\n\nclass User implements Identifiable { }\n\n// Composer + PSR-4 (composer.json) :\n// \"autoload\": {\n//   \"psr-4\": { \"App\\\\\": \"src/\" }\n// }\n// composer dump-autoload"}, {"lang": "php", "cat": "Avancé", "title": "Gestion des fichiers", "desc": "PHP lit/écrit des fichiers facilement. Toujours valider les chemins et extensions en production.", "code": "\u003c?php\n// Lire\n$contenu = file_get_contents(\"fichier.txt\");\n$lignes  = file(\"fichier.txt\", FILE_IGNORE_NEW_LINES);\n\n// Gros fichiers\n$handle = fopen(\"data.csv\", \"r\");\nwhile (($row = fgetcsv($handle)) !== false) {\n    [$id, $nom, $email] = $row;\n}\nfclose($handle);\n\n// Écrire\nfile_put_contents(\"fichier.txt\", $contenu);\nfile_put_contents(\"log.txt\", $ligne, FILE_APPEND | LOCK_EX);\n\n// JSON\n$data = json_decode(file_get_contents(\"data.json\"), true);\nfile_put_contents(\"data.json\",\n    json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_UNICODE));\n\n// Infos\nfile_exists(\"chemin\");\nis_file(\"f.txt\");   is_dir(\"dossier/\");\nfilesize(\"f.txt\");  filemtime(\"f.txt\");\npathinfo(\"img/a.jpg\"); // dirname, basename, extension\n\n// Dossiers\nmkdir(\"nouveau\", 0755, true);     // récursif\nrmdir(\"dossier_vide\");\nscandir(\"./\");\nglob(\"images/*.{jpg,png}\", GLOB_BRACE);\n\n// Copier / déplacer\ncopy(\"src.txt\", \"dst.txt\");\nrename(\"old.txt\", \"new.txt\");\nunlink(\"fichier.txt\");"}, {"lang": "react", "cat": "Bases", "title": "Composant fonctionnel \u0026 JSX", "desc": "Un composant = une fonction qui retourne du JSX. className remplace class. Les expressions JS sont dans {}.", "code": "function Alerte({ type = \"info\", titre, children }) {\n  const couleurs = {\n    info: \"blue\", success: \"green\", error: \"red\"\n  };\n  return (\n    \u003cdiv\n      className={`alerte alerte-${type}`}\n      style={{ borderColor: couleurs[type] }}\n      role=\"alert\"\n    \u003e\n      {titre \u0026\u0026 \u003ch3\u003e{titre}\u003c/h3\u003e}\n      \u003cp\u003e{children}\u003c/p\u003e\n    \u003c/div\u003e\n  );\n}\n\n// Règles JSX importantes :\n// 1. Un seul élément racine (ou \u003c\u003e \u003c/\u003e fragment)\n// 2. className pas class, htmlFor pas for\n// 3. Attributs camelCase : onClick, onChange\n// 4. Expressions JS dans { }\n// 5. Style = objet : style={{ color: \"red\" }}\n// 6. Commentaires : {/* ... */}\n// 7. Fermer les balises auto-fermantes : \u003cbr/\u003e\n\n// Utilisation\nfunction App() {\n  return (\n    \u003c\u003e\n      \u003cAlerte type=\"success\" titre=\"Bravo !\"\u003e\n        Connexion réussie\n      \u003c/Alerte\u003e\n      \u003cAlerte type=\"error\"\u003e\n        Mot de passe incorrect\n      \u003c/Alerte\u003e\n    \u003c/\u003e\n  );\n}\n\nexport default App;"}, {"lang": "react", "cat": "Hooks", "title": "useState — Gestion d'état", "desc": "Ne jamais muter l'état directement. Passer une fonction à setState pour accéder à la valeur précédente.", "code": "import { useState } from \"react\";\n\nfunction TodoList() {\n  const [todos,  setTodos]  = useState([]);\n  const [input,  setInput]  = useState(\"\");\n  const [filter, setFilter] = useState(\"all\");\n\n  const addTodo = () =\u003e {\n    if (!input.trim()) return;\n    // Passer une fn quand la valeur dépend de prev\n    setTodos(prev =\u003e [...prev, {\n      id: Date.now(), texte: input.trim(), done: false\n    }]);\n    setInput(\"\");\n  };\n\n  const toggle = (id) =\u003e {\n    setTodos(prev =\u003e\n      prev.map(t =\u003e t.id === id ? { ...t, done: !t.done } : t)\n    );\n  };\n\n  const remove = (id) =\u003e {\n    setTodos(prev =\u003e prev.filter(t =\u003e t.id !== id));\n  };\n\n  return (\n    \u003cdiv\u003e\n      \u003cinput\n        value={input}\n        onChange={e =\u003e setInput(e.target.value)}\n        onKeyDown={e =\u003e e.key === \"Enter\" \u0026\u0026 addTodo()}\n      /\u003e\n      \u003cbutton onClick={addTodo}\u003eAjouter\u003c/button\u003e\n      \u003cul\u003e\n        {todos.map(t =\u003e (\n          \u003cli key={t.id}\n              style={{ textDecoration: t.done ? \"line-through\" : \"\"}}\u003e\n            \u003cinput type=\"checkbox\" checked={t.done}\n                   onChange={() =\u003e toggle(t.id)}/\u003e\n            {t.texte}\n            \u003cbutton onClick={() =\u003e remove(t.id)}\u003e✕\u003c/button\u003e\n          \u003c/li\u003e\n        ))}\n      \u003c/ul\u003e\n      \u003cp\u003e{todos.filter(t =\u003e !t.done).length} tâche(s) restante(s)\u003c/p\u003e\n    \u003c/div\u003e\n  );\n}"}, {"lang": "react", "cat": "Hooks", "title": "useEffect — Effets de bord", "desc": "[] = montage. [dep] = quand dep change. return = cleanup. Éviter setState sur composant démonté.", "code": "import { useState, useEffect } from \"react\";\n\nfunction UserDetail({ userId }) {\n  const [user,    setUser]    = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error,   setError]   = useState(null);\n\n  useEffect(() =\u003e {\n    let cancelled = false;\n\n    const load = async () =\u003e {\n      setLoading(true); setError(null);\n      try {\n        const res = await fetch(`/api/users/${userId}`);\n        if (!res.ok) throw new Error(`HTTP ${res.status}`);\n        const data = await res.json();\n        if (!cancelled) setUser(data);\n      } catch (e) {\n        if (!cancelled) setError(e.message);\n      } finally {\n        if (!cancelled) setLoading(false);\n      }\n    };\n\n    load();\n    return () =\u003e { cancelled = true; };\n  }, [userId]);   // re-lance si userId change\n\n  // Synchroniser le titre de la page\n  useEffect(() =\u003e {\n    if (user) document.title = `Profil de ${user.nom}`;\n    return () =\u003e { document.title = \"Mon App\"; };\n  }, [user]);\n\n  // Timer avec cleanup\n  useEffect(() =\u003e {\n    const interval = setInterval(() =\u003e {}, 1000);\n    return () =\u003e clearInterval(interval);\n  }, []);\n\n  if (loading) return \u003cdiv className=\"spinner\"/\u003e;\n  if (error)   return \u003cp\u003e{error}\u003c/p\u003e;\n  return \u003cdiv\u003e\u003ch1\u003e{user.nom}\u003c/h1\u003e\u003cp\u003e{user.email}\u003c/p\u003e\u003c/div\u003e;\n}"}, {"lang": "react", "cat": "Hooks", "title": "useReducer — État complexe", "desc": "Préférer useReducer quand plusieurs actions modifient l'état ou quand des sous-états sont liés.", "code": "import { useReducer } from \"react\";\n\nconst init = { items:[], loading:false, error:null };\n\nfunction reducer(state, action) {\n  switch (action.type) {\n    case \"FETCH_START\":\n      return { ...state, loading: true, error: null };\n    case \"FETCH_OK\":\n      return { ...state, loading: false, items: action.data };\n    case \"FETCH_ERR\":\n      return { ...state, loading: false, error: action.error };\n    case \"ADD\":\n      return { ...state, items: [...state.items, action.item] };\n    case \"REMOVE\":\n      return {\n        ...state,\n        items: state.items.filter(i =\u003e i.id !== action.id)\n      };\n    default: return state;\n  }\n}\n\nfunction Liste() {\n  const [state, dispatch] = useReducer(reducer, init);\n\n  const fetch_ = async () =\u003e {\n    dispatch({ type: \"FETCH_START\" });\n    try {\n      const data = await fetch(\"/api/items\").then(r=\u003er.json());\n      dispatch({ type: \"FETCH_OK\", data });\n    } catch (e) {\n      dispatch({ type: \"FETCH_ERR\", error: e.message });\n    }\n  };\n\n  return (\n    \u003cdiv\u003e\n      {state.loading \u0026\u0026 \u003cp\u003eChargement…\u003c/p\u003e}\n      {state.error   \u0026\u0026 \u003cp\u003e{state.error}\u003c/p\u003e}\n      \u003cbutton onClick={fetch_}\u003eCharger\u003c/button\u003e\n      \u003cul\u003e\n        {state.items.map(i =\u003e (\n          \u003cli key={i.id}\u003e\n            {i.nom}\n            \u003cbutton onClick={() =\u003e\n              dispatch({ type:\"REMOVE\", id: i.id })}\u003e✕\n            \u003c/button\u003e\n          \u003c/li\u003e\n        ))}\n      \u003c/ul\u003e\n    \u003c/div\u003e\n  );\n}"}, {"lang": "react", "cat": "Hooks", "title": "useContext — Contexte global", "desc": "Évite le prop drilling. Créer un hook personnalisé par contexte. Provider le plus haut possible dans l'arbre.", "code": "import { createContext, useContext, useState, useCallback }\n  from \"react\";\n\n// 1. Créer le contexte\nconst AuthCtx = createContext(null);\n\n// 2. Créer le Provider\nexport function AuthProvider({ children }) {\n  const [user, setUser] = useState(null);\n\n  const login = useCallback(async (credentials) =\u003e {\n    const u = await authApi.login(credentials);\n    setUser(u);\n    localStorage.setItem(\"user\", JSON.stringify(u));\n  }, []);\n\n  const logout = useCallback(() =\u003e {\n    setUser(null);\n    localStorage.removeItem(\"user\");\n  }, []);\n\n  return (\n    \u003cAuthCtx.Provider value={{ user, login, logout, isAuth: !!user }}\u003e\n      {children}\n    \u003c/AuthCtx.Provider\u003e\n  );\n}\n\n// 3. Hook personnalisé (type-safe + erreur explicite)\nexport function useAuth() {\n  const ctx = useContext(AuthCtx);\n  if (!ctx) throw new Error(\"useAuth doit être dans AuthProvider\");\n  return ctx;\n}\n\n// 4. Utilisation\nfunction Header() {\n  const { user, logout, isAuth } = useAuth();\n  return (\n    \u003cheader\u003e\n      {isAuth\n        ? \u003c\u003e\n            \u003cspan\u003eBonjour {user.nom}\u003c/span\u003e\n            \u003cbutton onClick={logout}\u003eDéconnexion\u003c/button\u003e\n          \u003c/\u003e\n        : \u003ca href=\"/login\"\u003eConnexion\u003c/a\u003e\n      }\n    \u003c/header\u003e\n  );\n}"}, {"lang": "react", "cat": "Performance", "title": "memo, useMemo \u0026 useCallback", "desc": "memo évite les re-renders inutiles. useMemo mémoïse un calcul. useCallback stabilise une fonction.", "code": "import { memo, useMemo, useCallback } from \"react\";\n\n// React.memo — re-rend seulement si props changent\nconst UserCard = memo(function UserCard({ user, onDelete }) {\n  console.log(\"Render UserCard\", user.id);\n  return (\n    \u003cdiv\u003e\n      \u003ch3\u003e{user.nom}\u003c/h3\u003e\n      \u003cbutton onClick={() =\u003e onDelete(user.id)}\u003eSupprimer\u003c/button\u003e\n    \u003c/div\u003e\n  );\n});\n\n// useMemo — calcul coûteux\nfunction Analytics({ data }) {\n  const stats = useMemo(() =\u003e {\n    const total = data.reduce((s, d) =\u003e s + d.valeur, 0);\n    const max   = Math.max(...data.map(d =\u003e d.valeur));\n    return { total, max, avg: (total / data.length).toFixed(2) };\n  }, [data]); // recalculé seulement si data change\n\n  return \u003cdiv\u003eMoyenne: {stats.avg}€\u003c/div\u003e;\n}\n\n// useCallback — fonction stable\nfunction Parent({ items }) {\n  const [sel, setSel] = useState(null);\n\n  // Sans useCallback : nouvelle référence → UserCard re-rend toujours\n  // Avec useCallback : référence stable → mémo fonctionne\n  const handleDelete = useCallback((id) =\u003e {\n    setSel(null);\n    deleteItem(id);\n  }, []); // dépendances vides = jamais recréée\n\n  return items.map(item =\u003e (\n    \u003cUserCard\n      key={item.id}\n      user={item}\n      onDelete={handleDelete}\n    /\u003e\n  ));\n}"}, {"lang": "react", "cat": "Rendu", "title": "Rendu conditionnel \u0026 Listes", "desc": "key doit être unique et stable. Composant séparé par item = meilleure performance et lisibilité.", "code": "function ProductList({ products, loading, error }) {\n  if (loading) return \u003cSpinner/\u003e;\n  if (error)   return \u003cErrorMessage message={error}/\u003e;\n  if (!products.length) return \u003cEmptyState/\u003e;\n\n  return (\n    \u003cdiv\u003e\n      {/* \u0026\u0026 pour condition simple */}\n      {products.length \u003e 10 \u0026\u0026 \u003cp\u003eScroll pour voir plus\u003c/p\u003e}\n\n      {/* Ternaire pour if/else */}\n      {products.length === 1\n        ? \u003cp\u003eUn seul produit\u003c/p\u003e\n        : \u003cp\u003e{products.length} produits\u003c/p\u003e}\n\n      {/* Liste */}\n      \u003cul\u003e\n        {products.map(product =\u003e (\n          \u003cProductCard\n            key={product.id}    // OBLIGATOIRE, unique, stable\n            product={product}\n          /\u003e\n        ))}\n      \u003c/ul\u003e\n\n      {/* Fragment avec key */}\n      \u003cdl\u003e\n        {products.map(p =\u003e (\n          \u003cReact.Fragment key={p.id}\u003e\n            \u003cdt\u003e{p.nom}\u003c/dt\u003e\n            \u003cdd\u003e{p.prix}€\u003c/dd\u003e\n          \u003c/React.Fragment\u003e\n        ))}\n      \u003c/dl\u003e\n    \u003c/div\u003e\n  );\n}\n\nconst ProductCard = memo(function ProductCard({ product }) {\n  return (
