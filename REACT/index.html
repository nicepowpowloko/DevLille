<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../favicon-32x32.png" type="image/png">
    <title> React - Formation DWWM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        /* Icônes technologiques flottantes */
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .tech-icon {
            position: absolute;
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .tech-icon:nth-child(1) {
            top: 10%;
            left: 5%;
            animation-delay: 0s;
            animation-duration: 25s;
        }

        .tech-icon:nth-child(2) {
            top: 20%;
            right: 8%;
            animation-delay: 3s;
            animation-duration: 20s;
        }

        .tech-icon:nth-child(3) {
            top: 60%;
            left: 10%;
            animation-delay: 5s;
            animation-duration: 30s;
        }

        .tech-icon:nth-child(4) {
            top: 70%;
            right: 15%;
            animation-delay: 2s;
            animation-duration: 22s;
        }

        .tech-icon:nth-child(5) {
            top: 40%;
            left: 15%;
            animation-delay: 7s;
            animation-duration: 28s;
        }

        .tech-icon:nth-child(6) {
            top: 50%;
            right: 5%;
            animation-delay: 4s;
            animation-duration: 26s;
        }

        .tech-icon:nth-child(7) {
            top: 85%;
            left: 20%;
            animation-delay: 6s;
            animation-duration: 24s;
        }

        .tech-icon:nth-child(8) {
            top: 30%;
            right: 20%;
            animation-delay: 1s;
            animation-duration: 27s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
            }
            50% {
                transform: translateY(0) rotate(0deg);
            }
            75% {
                transform: translateY(20px) rotate(-5deg);
            }
        }

        .tech-icon svg {
            width: 80px;
            height: 80px;
            fill: white;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }

        /* Container principal */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        /* Logo avec animation pulse */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-container img {
            width: 120px;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            }
            50% {
                box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6),
                            0 0 40px rgba(118, 75, 162, 0.4),
                            0 0 60px rgba(240, 147, 251, 0.3);
            }
        }

        /* Titre avec dégradé animé + effet 3D au hover */
        h1 {
            color: white;
            text-align: center;
            padding-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 40px;
            
            /* Dégradé animé */
            background: linear-gradient(90deg, 
                #ffffff 0%, 
                #a8b5ff 25%, 
                #2C3F77 50%, 
            #ffd4ff 75%, 
            #A0866B 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 10s ease infinite;
            
            transition: all 0.3s ease;
            cursor: default;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
            100% {
                background-position: 0% center;
            }
        }

        /* Effet 3D au hover sur le titre */
        h1:hover {
            transform: translateY(-5px);
            text-shadow: 
                0 10px 20px rgba(0,0,0,0.3),
                0 15px 30px rgba(102, 126, 234, 0.4),
                0 20px 40px rgba(118, 75, 162, 0.3);
        }

        h3 {
            color: #A0866B;
            margin-top: 0;
            border-left: 4px solid #A0866B;
            padding-left: 10px;
            font-size: 1.3em;
            margin-bottom: 15px;
        }

        /* Sections/Cartes avec effet glow */
        .section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.4s ease;
            border: 2px solid transparent;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3),
                        0 0 40px rgba(102, 126, 234, 0.5),
                        0 0 60px rgba(118, 75, 162, 0.3),
                        inset 0 0 20px rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
        }

        /* Liens */
        a {
            color: #2C3F77;
            text-decoration: none;
            font-size: 16px;
            display: block;
            padding: 12px;
            margin: 8px 0;
            border-left: 3px solid #2C3F77;
            padding-left: 15px;
            transition: all 0.3s ease;
            border-radius: 5px;
        }

        a:hover {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.1), transparent);
            border-left-color: #667eea;
            padding-left: 20px;
        }

        /* Bouton */
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white !important;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: inline-block;
            text-align: center;
            border-left: none !important;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #764ba2, #667eea);
            padding-left: 30px !important;
        }

        /* Footer */
        footer {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            text-align: center;
            margin-top: 50px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            color: #666;
        }

        footer p {
            margin: 10px 0;
        }

        footer a {
            display: inline;
            border: none;
            padding: 0;
            color: #667eea;
        }

        footer a:hover {
            background: none;
            text-decoration: underline;
            padding-left: 0;
        }

        footer img {
            max-width: 100px;
            margin-bottom: 15px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .tech-icon svg {
                width: 60px;
                height: 60px;
            }

            .container {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
