<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* TOOLBAR TOP */
  #topbar {
    background: #181825;
    border-bottom: 1px solid #313244;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .toolbar-title {
    font-size: 15px;
    font-weight: 600;
    color: #cba6f7;
    letter-spacing: 1px;
  }
  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 4px;
    border-right: 1px solid #313244;
    padding-right: 12px;
  }
  .toolbar-group:last-child { border-right: none; }
  .tool-btn {
    width: 36px; height: 36px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: #cdd6f4;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all 0.15s;
  }
  .tool-btn:hover { background: #313244; border-color: #45475a; }
  .tool-btn.active { background: #313244; border-color: #cba6f7; color: #cba6f7; }
  .tool-btn span { font-size: 18px; line-height: 1; }

  /* SIZE SLIDER */
  .size-group { display: flex; align-items: center; gap: 8px; }
  .size-group label { font-size: 12px; color: #a6adc8; }
  #sizeSlider { width: 80px; accent-color: #cba6f7; }
  #sizeValue { font-size: 12px; min-width: 24px; color: #cba6f7; font-weight: 600; }

  /* OPACITY */
  #opacitySlider { width: 70px; accent-color: #89b4fa; }

  /* MAIN AREA */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* LEFT TOOLS */
  #sidebar {
    width: 52px;
    background: #181825;
    border-right: 1px solid #313244;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    gap: 4px;
  }
  .side-btn {
    width: 40px; height: 40px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: transparent;
    color: #cdd6f4;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    transition: all 0.15s;
    position: relative;
  }
  .side-btn:hover { background: #313244; }
  .side-btn.active { background: #2a2745; border-color: #cba6f7; }
  .side-btn title { display: none; }
  .tooltip {
    position: absolute;
    left: 48px;
    background: #313244;
    color: #cdd6f4;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 10;
  }
  .side-btn:hover .tooltip { opacity: 1; }

  /* CANVAS AREA */
  #canvasArea {
    flex: 1;
    overflow: auto;
    background: #11111b;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 20px;
  }
  #mainCanvas {
    cursor: crosshair;
    display: block;
    box-shadow: 0 4px 32px rgba(0,0,0,0.5);
  }

  /* BOTTOM COLOR BAR */
  #bottombar {
    background: #181825;
    border-top: 1px solid #313244;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* CURRENT COLORS */
  #colorPreview {
    position: relative;
    width: 44px; height: 44px;
    flex-shrink: 0;
  }
  #bgColorBox {
    position: absolute;
    bottom: 0; right: 0;
    width: 28px; height: 28px;
    border: 2px solid #181825;
    border-radius: 4px;
    cursor: pointer;
  }
  #fgColorBox {
    position: absolute;
    top: 0; left: 0;
    width: 28px; height: 28px;
    border: 2px solid #cdd6f4;
    border-radius: 4px;
    cursor: pointer;
    z-index: 1;
  }
  input[type="color"] {
    opacity: 0;
    position: absolute;
    width: 0; height: 0;
  }

  /* PALETTE */
  #palette {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    flex: 1;
  }
  .pal-color {
    width: 24px; height: 24px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s, border-color 0.1s;
    flex-shrink: 0;
  }
  .pal-color:hover { transform: scale(1.2); border-color: #cdd6f4; }

  /* STATUS */
  #status {
    font-size: 11px;
    color: #6c7086;
    margin-left: auto;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="toolbar-title">🎨 PAINT</span>

  <div class="toolbar-group">
    <button class="tool-btn" id="btnUndo" title="Annuler (Ctrl+Z)"><span>↩</span></button>
    <button class="tool-btn" id="btnRedo" title="Refaire (Ctrl+Y)"><span>↪</span></button>
  </div>

  <div class="toolbar-group">
    <button class="tool-btn" id="btnClear" title="Effacer tout">🗑</button>
    <button class="tool-btn" id="btnSave" title="Télécharger (PNG)">💾</button>
  </div>

  <div class="toolbar-group size-group">
    <label>Taille</label>
    <input type="range" id="sizeSlider" min="1" max="60" value="5">
    <span id="sizeValue">5</span>
  </div>

  <div class="toolbar-group size-group" id="eraserSizes" style="display:none;">
    <label>Gomme</label>
    <button class="tool-btn eraser-size-btn active" data-esize="5" title="Petite (5px)" style="font-size:11px;width:30px;height:30px;">XS</button>
    <button class="tool-btn eraser-size-btn" data-esize="15" title="Moyenne (15px)" style="font-size:11px;width:30px;height:30px;">S</button>
    <button class="tool-btn eraser-size-btn" data-esize="30" title="Grande (30px)" style="font-size:11px;width:30px;height:30px;">M</button>
    <button class="tool-btn eraser-size-btn" data-esize="50" title="Très grande (50px)" style="font-size:11px;width:30px;height:30px;">L</button>
    <button class="tool-btn eraser-size-btn" data-esize="80" title="Énorme (80px)" style="font-size:11px;width:30px;height:30px;">XL</button>
  </div>

  <div class="toolbar-group size-group">
    <label>Opacité</label>
    <input type="range" id="opacitySlider" min="1" max="100" value="100">
    <span id="opacityValue">100%</span>
  </div>

  <div class="toolbar-group">
    <label style="font-size:12px;color:#a6adc8;">Fond</label>
    <div style="display:flex;gap:4px;">
      <div class="pal-color" style="background:#ffffff" data-bg="true"></div>
      <div class="pal-color" style="background:#1e1e2e" data-bg="true"></div>
      <div class="pal-color" style="background:#11111b" data-bg="true"></div>
    </div>
    <button class="tool-btn" id="btnBgColor" title="Couleur de fond personnalisée">🎨
      <input type="color" id="bgColorPicker" value="#ffffff">
    </button>
  </div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <button class="side-btn active" data-tool="pencil">✏️<span class="tooltip">Crayon</span></button>
    <button class="side-btn" data-tool="brush">🖌️<span class="tooltip">Pinceau</span></button>
    <button class="side-btn" data-tool="spray">💨<span class="tooltip">Aérographe</span></button>
    <button class="side-btn" data-tool="eraser">🧹<span class="tooltip">Gomme</span></button>
    <button class="side-btn" data-tool="fill">🪣<span class="tooltip">Remplissage</span></button>
    <button class="side-btn" data-tool="eyedropper">💉<span class="tooltip">Pipette</span></button>
    <hr style="width:80%;border-color:#313244;margin:4px 0;">
    <button class="side-btn" data-tool="line">╱<span class="tooltip" style="font-size:11px">Ligne</span></button>
    <button class="side-btn" data-tool="rect">▭<span class="tooltip">Rectangle</span></button>
    <button class="side-btn" data-tool="rectFill">■<span class="tooltip">Rect. plein</span></button>
    <button class="side-btn" data-tool="circle">◯<span class="tooltip">Ellipse</span></button>
    <button class="side-btn" data-tool="circleFill">⬤<span class="tooltip">Ellipse pleine</span></button>
    <button class="side-btn" data-tool="triangle">△<span class="tooltip">Triangle</span></button>
    <button class="side-btn" data-tool="text">T<span class="tooltip">Texte</span></button>
    <hr style="width:80%;border-color:#313244;margin:4px 0;">
    <button class="side-btn" data-tool="select">⬚<span class="tooltip">Sélection</span></button>
  </div>

  <!-- CANVAS -->
  <div id="canvasArea">
    <canvas id="mainCanvas" width="1200" height="700"></canvas>
  </div>
</div>

<!-- BOTTOM COLOR BAR -->
<div id="bottombar">
  <div id="colorPreview">
    <div id="bgColorBox" title="Couleur de fond (clic droit)"></div>
    <div id="fgColorBox" title="Couleur principale (clic gauche)">
      <input type="color" id="fgColorPicker" value="#000000">
    </div>
  </div>

  <div id="palette"></div>
  <div id="status">1200 × 700 | x:0 y:0</div>
</div>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');

// = STATE =
let tool = 'pencil';
let drawing = false;
let fgColor = '#000000';
let bgColor = '#ffffff';
let brushSize = 5;
let opacity = 1;
let startX, startY;
let snapshot;
let history = [];
let historyIndex = -1;
let textMode = false;
let selectionRect = null;
let selectionDragging = false;
let selectionData = null;
let selStart = {};

// Init white canvas
ctx.fillStyle = '#ffffff';
ctx.fillRect(0, 0, canvas.width, canvas.height);
saveHistory();

// = PALETTE =
const COLORS = [
  '#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080',
  '#ffffff','#c0c0c0','#ff0000','#ffff00','#00ff00','#00ffff','#0000ff','#ff00ff',
  '#ff8040','#804000','#80ff00','#004040','#0080ff','#8000ff','#ff0080','#ff80ff',
  '#ffcc00','#ff6600','#66ff66','#66ccff','#cc99ff','#ff99cc','#99ffcc','#ccffff',
];
const palette = document.getElementById('palette');
COLORS.forEach(c => {
  const div = document.createElement('div');
  div.className = 'pal-color';
  div.style.background = c;
  div.addEventListener('click', e => { e.button === 0 && setFgColor(c); });
  div.addEventListener('contextmenu', e => { e.preventDefault(); setBgColor(c); });
  palette.appendChild(div);
});

// Add custom color button
const customBtn = document.createElement('div');
customBtn.className = 'pal-color';
customBtn.style.background = 'linear-gradient(135deg,red,yellow,lime,cyan,blue,magenta)';
customBtn.title = 'Couleur personnalisée';
const customInput = document.createElement('input');
customInput.type = 'color';
customInput.style.cssText = 'opacity:0;position:absolute;width:0;height:0';
customInput.addEventListener('change', e => setFgColor(e.target.value));
customBtn.addEventListener('click', () => customInput.click());
customBtn.appendChild(customInput);
palette.appendChild(customBtn);

// = COLOR FUNCTIONS =
function setFgColor(c) {
  fgColor = c;
  document.getElementById('fgColorBox').style.background = c;
  document.getElementById('fgColorPicker').value = c;
}
function setBgColor(c) {
  bgColor = c;
  document.getElementById('bgColorBox').style.background = c;
}
setFgColor('#000000');
setBgColor('#ffffff');

document.getElementById('fgColorBox').addEventListener('click', () => document.getElementById('fgColorPicker').click());
document.getElementById('fgColorPicker').addEventListener('input', e => setFgColor(e.target.value));
document.getElementById('bgColorBox').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = bgColor;
  inp.addEventListener('change', e => setBgColor(e.target.value));
  inp.click();
});

// bg color quick picks
document.querySelectorAll('.pal-color[data-bg]').forEach(el => {
  el.addEventListener('click', () => setBgColor(el.style.background));
});
document.getElementById('btnBgColor').addEventListener('click', () => document.getElementById('bgColorPicker').click());
document.getElementById('bgColorPicker').addEventListener('change', e => {
  setBgColor(e.target.value);
  ctx.fillStyle = e.target.value;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  saveHistory();
});

// = TOOLS =
document.querySelectorAll('.side-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const eraserPanel = document.getElementById('eraserSizes');
    if (tool === 'eraser') {
      eraserPanel.style.display = 'flex';
      const activeSize = document.querySelector('.eraser-size-btn.active');
      if (activeSize) { brushSize = parseInt(activeSize.dataset.esize); sizeSlider.value = Math.min(brushSize,60); sizeValue.textContent = brushSize; }
    } else {
      eraserPanel.style.display = 'none';
    }
  });
});

document.querySelectorAll('.eraser-size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.eraser-size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    brushSize = parseInt(btn.dataset.esize);
    sizeSlider.value = Math.min(brushSize, 60);
    sizeValue.textContent = brushSize;
  });
});

// = SIZE & OPACITY =
const sizeSlider = document.getElementById('sizeSlider');
const sizeValue = document.getElementById('sizeValue');
sizeSlider.addEventListener('input', () => {
  brushSize = parseInt(sizeSlider.value);
  sizeValue.textContent = brushSize;
});
const opacitySlider = document.getElementById('opacitySlider');
const opacityValue = document.getElementById('opacityValue');
opacitySlider.addEventListener('input', () => {
  opacity = parseInt(opacitySlider.value) / 100;
  opacityValue.textContent = Math.round(opacity * 100) + '%';
});

// = HISTORY =
function saveHistory() {
  history = history.slice(0, historyIndex + 1);
  history.push(canvas.toDataURL());
  historyIndex++;
  if (history.length > 50) { history.shift(); historyIndex--; }
}
function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    loadFromHistory();
  }
}
function redo() {
  if (historyIndex < history.length - 1) {
    historyIndex++;
    loadFromHistory();
  }
}
function loadFromHistory() {
  const img = new Image();
  img.src = history[historyIndex];
  img.onload = () => { ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
}
document.getElementById('btnUndo').addEventListener('click', undo);
document.getElementById('btnRedo').addEventListener('click', redo);
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); redo(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
});

// = CLEAR & SAVE =
document.getElementById('btnClear').addEventListener('click', () => {
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  saveHistory();
});
async function saveFile() {
  canvas.toBlob(async (blob) => {
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: 'dessin.png',
          types: [{ description: 'Image PNG', accept: { 'image/png': ['.png'] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } catch (e) {
        if (e.name !== 'AbortError') {
          const a = document.createElement('a');
          a.download = 'dessin.png';
          a.href = URL.createObjectURL(blob);
          a.click();
        }
      }
    } else {
      const a = document.createElement('a');
      a.download = 'dessin.png';
      a.href = URL.createObjectURL(blob);
      a.click();
    }
  }, 'image/png');
}
document.getElementById('btnSave').addEventListener('click', saveFile);

// = DRAWING HELPERS =
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  if (e.touches) {
    return { x: Math.round((e.touches[0].clientX - rect.left) * scaleX), y: Math.round((e.touches[0].clientY - rect.top) * scaleY) };
  }
  return { x: Math.round((e.clientX - rect.left) * scaleX), y: Math.round((e.clientY - rect.top) * scaleY) };
}

function setCtx(useEraser) {
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = useEraser ? bgColor : fgColor;
  ctx.fillStyle = fgColor;
  ctx.lineWidth = brushSize;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
}

// = FILL (FLOOD FILL) =
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return [r,g,b];
}
function floodFill(x, y, fillColor) {
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = data.data;
  const idx = (y * canvas.width + x) * 4;
  const [tr,tg,tb,ta] = [pixels[idx],pixels[idx+1],pixels[idx+2],pixels[idx+3]];
  const [fr,fg,fb] = hexToRgb(fillColor);
  if (tr===fr&&tg===fg&&tb===fb) return;
  const stack = [[x,y]];
  while (stack.length) {
    const [cx,cy] = stack.pop();
    if (cx<0||cx>=canvas.width||cy<0||cy>=canvas.height) continue;
    const i = (cy*canvas.width+cx)*4;
    if (pixels[i]!==tr||pixels[i+1]!==tg||pixels[i+2]!==tb||pixels[i+3]!==ta) continue;
    pixels[i]=fr; pixels[i+1]=fg; pixels[i+2]=fb; pixels[i+3]=255;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  ctx.putImageData(data,0,0);
}

// = EYEDROPPER =
function pickColor(x, y) {
  const d = ctx.getImageData(x, y, 1, 1).data;
  const hex = '#' + [d[0],d[1],d[2]].map(v => v.toString(16).padStart(2,'0')).join('');
  setFgColor(hex);
}

// = SPRAY =
function spray(x, y) {
  setCtx(false);
  const density = Math.max(10, brushSize * 3);
  for (let i = 0; i < density; i++) {
    const angle = Math.random() * 2 * Math.PI;
    const radius = Math.random() * brushSize * 2;
    ctx.fillStyle = fgColor;
    ctx.fillRect(x + radius * Math.cos(angle), y + radius * Math.sin(angle), 1, 1);
  }
}

// = DRAW SHAPE (preview) =
function drawShape(x2, y2) {
  if (!snapshot) return;
  ctx.putImageData(snapshot, 0, 0);
  setCtx(false);
  const w = x2 - startX, h = y2 - startY;
  ctx.globalAlpha = opacity;
  ctx.strokeStyle = fgColor;
  ctx.fillStyle = fgColor;
  ctx.lineWidth = brushSize;
  switch(tool) {
    case 'line':
      ctx.beginPath(); ctx.moveTo(startX, startY); ctx.lineTo(x2, y2); ctx.stroke(); break;
    case 'rect':
      ctx.beginPath(); ctx.strokeRect(startX, startY, w, h); break;
    case 'rectFill':
      ctx.fillRect(startX, startY, w, h); break;
    case 'circle':
      ctx.beginPath(); ctx.ellipse(startX+w/2, startY+h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI*2); ctx.stroke(); break;
    case 'circleFill':
      ctx.beginPath(); ctx.ellipse(startX+w/2, startY+h/2, Math.abs(w/2), Math.abs(h/2), 0, 0, Math.PI*2); ctx.fill(); break;
    case 'triangle':
      ctx.beginPath(); ctx.moveTo(startX+w/2, startY); ctx.lineTo(x2, y2); ctx.lineTo(startX, y2); ctx.closePath(); ctx.stroke(); break;
    case 'select':
      ctx.setLineDash([5,3]);
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1;
      ctx.strokeRect(startX, startY, w, h);
      ctx.setLineDash([]);
      break;
  }
}

// = TEXT =
let textInputEl = null;
function startTextTool(x, y) {
  if (textInputEl) finishText();
  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = 'Tapez ici...';
  const rect = canvas.getBoundingClientRect();
  const scaleX = rect.width / canvas.width;
  const scaleY = rect.height / canvas.height;
  input.style.cssText = `
    position: fixed;
    left: ${rect.left + x * scaleX}px;
    top: ${rect.top + y * scaleY}px;
    font-size: ${Math.max(12, brushSize * 3)}px;
    color: ${fgColor};
    background: transparent;
    border: 1px dashed #cba6f7;
    outline: none;
    min-width: 100px;
    z-index: 999;
  `;
  document.body.appendChild(input);
  input.focus();
  textInputEl = { el: input, x, y };
  input.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') finishText(); });
  input.addEventListener('blur', finishText);
}
function finishText() {
  if (!textInputEl) return;
  const { el, x, y } = textInputEl;
  const text = el.value;
  if (text) {
    ctx.globalAlpha = opacity;
    ctx.fillStyle = fgColor;
    ctx.font = `${Math.max(12, brushSize * 3)}px sans-serif`;
    ctx.fillText(text, x, y);
    saveHistory();
  }
  el.remove();
  textInputEl = null;
}

// = MOUSE EVENTS =
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  const { x, y } = getPos(e);
  drawing = true;
  startX = x; startY = y;

  if (tool === 'fill') { ctx.globalAlpha = opacity; floodFill(x, y, fgColor); saveHistory(); drawing = false; return; }
  if (tool === 'eyedropper') { pickColor(x, y); drawing = false; return; }
  if (tool === 'text') { startTextTool(x, y); drawing = false; return; }

  const shapeTools = ['line','rect','rectFill','circle','circleFill','triangle','select'];
  if (shapeTools.includes(tool)) {
    snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }

  if (tool === 'pencil' || tool === 'eraser') {
    setCtx(tool === 'eraser');
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 0.1, y);
    ctx.stroke();
  }
});

canvas.addEventListener('mousemove', e => {
  const { x, y } = getPos(e);
  document.getElementById('status').textContent = `1200 × 700 | x:${x} y:${y}`;

  if (!drawing) return;
  if (tool === 'pencil' || tool === 'eraser') {
    setCtx(tool === 'eraser');
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  } else if (tool === 'brush') {
    setCtx(false);
    ctx.beginPath();
    ctx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
    ctx.fill();
  } else if (tool === 'spray') {
    spray(x, y);
  } else {
    drawShape(x, y);
  }
});

canvas.addEventListener('mouseup', e => {
  if (!drawing) return;
  const { x, y } = getPos(e);
  drawing = false;
  const shapeTools = ['line','rect','rectFill','circle','circleFill','triangle'];
  if (shapeTools.includes(tool)) {
    drawShape(x, y);
    snapshot = null;
  }
  if (tool === 'select') {
    selectionRect = { x: Math.min(startX, x), y: Math.min(startY, y), w: Math.abs(x - startX), h: Math.abs(y - startY) };
    snapshot = null;
  }
  ctx.globalAlpha = 1;
  if (tool !== 'select') saveHistory();
  ctx.beginPath();
});

canvas.addEventListener('mouseleave', () => { if (drawing) { drawing = false; ctx.beginPath(); } });

// Touch support
canvas.addEventListener('touchstart', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: e.touches[0].clientX, clientY: e.touches[0].clientY })); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); canvas.dispatchEvent(new MouseEvent('mouseup', {})); }, { passive: false });

// Right click = use bg color
canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  const tmp = fgColor;
  fgColor = bgColor;
  setTimeout(() => { fgColor = tmp; }, 0);
});
</script>
</body>
</html>
