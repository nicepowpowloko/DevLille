    example:'// Trouver le max d\'un tableau\nfunction trouverMax(arr) {\n  let max = arr[0];\n  for (const n of arr) {\n    if (n \\u003e max) max = n;\n  }\n  return max;\n}\n// Complexité : O(n) — parcourt 1 fois',
    interview_tip:'' },
  { cat:'algo', term:'Complexité (Big O)', interview:true,
    short:'Mesure de la performance d\'un algorithme selon la taille des données.',
    full:'O(1) constant, O(log n) logarithmique, O(n) linéaire, O(n²) quadratique. Plus le n est petit, mieux c\'est.',
    example:'O(1)   → arr[42]           // accès direct\nO(log n) → binary search  // divise par 2\nO(n)   → boucle simple     // parcourt tout\nO(n log n) → tri efficace  // quicksort\nO(n²)  → boucles imbriquées // à éviter',
    interview_tip:'En entretien : "cette solution est O(n²), on pourrait l\'optimiser à O(n) avec un Set."' },
  { cat:'algo', term:'Récursivité', interview:true,
    short:'Technique où une fonction s\'appelle elle-même pour des sous-problèmes.',
    full:'Toujours : un cas de base (arrêt) + un cas récursif. Élégante pour les arbres et les structures hiérarchiques.',
    example:'// Factorielle\nfunction fact(n) {\n  if (n \\u003c= 1) return 1;     // cas de base\n  return n * fact(n - 1);   // cas récursif\n}\nfact(5); // 5*4*3*2*1 = 120\n\n// Parcourir un arbre DOM\nfunction parcourir(node) {\n  console.log(node.tagName);\n  node.children.forEach(parcourir);\n}',
    interview_tip:'' },
  { cat:'algo', term:'Structure de données', interview:true,
    short:'Façon d\'organiser les données en mémoire pour faciliter certaines opérations.',
    full:'Tableau (accès O(1)), Objet/Map (clé→valeur O(1)), Set (unicité O(1)), File (FIFO), Pile (LIFO).',
    example:'// Tableau → accès par index\narr[42]; // O(1)\n\n// Set → vérifier existence rapidement\nconst seen = new Set();\nseen.has("alice"); // O(1)\n\n// Map → clé de tout type\nconst cache = new Map();\ncache.set(userId, userData); // O(1)',
    interview_tip:'' },
  { cat:'algo', term:'Tri', interview:false,
    short:'Algorithmes pour ordonner une collection de données.',
    full:'Bubble Sort O(n²), Quick Sort O(n log n), Merge Sort O(n log n). JS sort() utilise TimSort.',
    example:'// Tri natif JS\narr.sort((a, b) =\\u003e a - b);         // croissant\narr.sort((a, b) =\\u003e b - a);         // décroissant\narr.sort((a, b) =\\u003e\n  a.nom.localeCompare(b.nom, "fr")); // alphabétique\n\n// Par propriété\nusers.sort((a, b) =\\u003e a.age - b.age);',
    interview_tip:'' },
  { cat:'algo', term:'Recherche', interview:false,
    short:'Algorithmes pour trouver un élément dans une collection.',
    full:'Linéaire O(n) : parcourir tout. Binaire O(log n) : diviser par 2 à chaque étape (nécessite un tableau trié).',
    example:'// Recherche linéaire O(n)\nconst found = arr.find(x =\\u003e x.id === 42);\n\n// Recherche binaire O(log n)\nfunction binarySearch(arr, target) {\n  let lo = 0, hi = arr.length - 1;\n  while (lo \\u003c= hi) {\n    const mid = Math.floor((lo + hi) / 2);\n    if (arr[mid] === target) return mid;\n    arr[mid] \\u003c target ? lo = mid+1 : hi = mid-1;\n  }\n  return -1;\n}',
    interview_tip:'' },
  { cat:'algo', term:'Programmation fonctionnelle', interview:true,
    short:'Style utilisant des fonctions pures sans effets de bord.',
    full:'Fonctions pures (même entrée → même sortie), immutabilité, composition. map/filter/reduce sont fonctionnels.',
    example:'// Impératif\nconst result = [];\nfor (const p of produits)\n  if (p.prix \\u003c 100) result.push(p.nom);\n\n// Fonctionnel\nconst result = produits\n  .filter(p =\\u003e p.prix \\u003c 100)\n  .map(p =\\u003e p.nom);\n\n// Composition de fonctions\nconst process = x =\\u003e format(validate(parse(x)));',
    interview_tip:'' },
  { cat:'algo', term:'DRY / SOLID', interview:true,
    short:'Principes de conception pour un code maintenable et évolutif.',
    full:'DRY : Don\'t Repeat Yourself — factoriser le code dupliqué. SOLID : 5 principes POO (Single Responsibility, Open/Closed, Liskov, Interface Segregation, Dependency Inversion).',
    example:'// DRY — mauvais\nfunction validerEmail() { /* ... */ }\nfunction validerEmailAdmin() { /* ... */ }\n// → même logique dupliquée\n\n// DRY — bon\nfunction validerEmail(email, options = {}) {\n  // logique unique, paramétrable\n}',
    interview_tip:'' },
  { cat:'algo', term:'Pattern MVC', interview:true,
    short:'Patron d\'architecture séparant données, affichage et logique de contrôle.',
    full:'Model (données/BDD), View (HTML/UI), Controller (reçoit requêtes, coordonne). Utilisé par Laravel, Symfony.',
    example:'// Requête HTTP\nGET /users/42\n\n// Routing\n→ UserController::show(42)\n\n// Controller\npublic function show(int $id): Response {\n  $user = User::find($id);  // Model\n  return view("user.show",  // View\n              ["user" =\\u003e $user]);\n}',
    interview_tip:'' },
  { cat:'algo', term:'Récursion vs Itération', interview:false,
    short:'Deux approches pour répéter des opérations.',
    full:'L\'itération (boucles) est généralement plus performante et sans risque de stack overflow. La récursion est plus élégante pour les structures arborescentes.',
    example:'// Itératif — somme tableau\nfunction sum(arr) {\n  let total = 0;\n  for (const n of arr) total += n;\n  return total;\n}\n\n// Récursif — même résultat\nfunction sum(arr) {\n  if (!arr.length) return 0;\n  return arr[0] + sum(arr.slice(1));\n}',
    interview_tip:'' },
  { cat:'react', term:'JSX', interview:true,
    short:'Syntaxe permettant d\'écrire du HTML dans du JavaScript.',
    full:'JavaScript XML. Extension syntaxique de JS compilée par Babel en appels React.createElement(). Ressemble à du HTML mais c\'est du JS : les attributs sont en camelCase, class devient className, for devient htmlFor.',
    example:'// JSX\nconst el = \u003cdiv className="card"\u003e\u003ch1\u003e{titre}\u003c/h1\u003e\u003c/div\u003e;\n\n// Ce que Babel génère\nconst el = React.createElement("div",\n  { className: "card" },\n  React.createElement("h1", null, titre)\n);',
    interview_tip:'JSX n\'est pas du HTML. C\'est du sucre syntaxique compilé en JS. C\'est pourquoi on écrit className au lieu de class.' },

  { cat:'react', term:'Composant', interview:true,
    short:'Brique réutilisable encapsulant UI et logique.',
    full:'En React, tout est composant. Un composant est une fonction qui reçoit des props et retourne du JSX. Les composants se composent entre eux pour former l\'interface. Convention : nom en PascalCase.',
    example:'// Composant fonctionnel\nfunction Card({ titre, description, image }) {\n  return (\n    \u003cdiv className="card"\u003e\n      \u003cimg src={image} alt={titre} /\u003e\n      \u003ch2\u003e{titre}\u003c/h2\u003e\n      \u003cp\u003e{description}\u003c/p\u003e\n    \u003c/div\u003e\n  );\n}\n\n// Utilisation\n\u003cCard titre="React" description="Une lib JS" image="/react.png" /\u003e',
    interview_tip:'Un composant = une responsabilité. Si un composant fait trop de choses, le diviser en sous-composants.' },

  { cat:'react', term:'Props', interview:true,
    short:'Paramètres passés d\'un composant parent à un composant enfant.',
    full:'Properties. Les props sont en lecture seule dans l\'enfant : un composant ne doit jamais modifier ses propres props. Pour communiquer de l\'enfant vers le parent, on passe une fonction callback en prop.',
    example:'// Parent passe les props\n\u003cBouton\n  label="Valider"\n  couleur="bleu"\n  onClick={() =\u003e handleSubmit()}\n/\u003e\n\n// Enfant reçoit et utilise\nfunction Bouton({ label, couleur, onClick }) {\n  return \u003cbutton className={couleur} onClick={onClick}\u003e{label}\u003c/button\u003e;\n}',
    interview_tip:'Les données vont toujours du parent vers l\'enfant (unidirectionnel). Pour remonter, on passe une fonction.' },

  { cat:'react', term:'useState', interview:true,
    short:'Hook gérant l\'état local d\'un composant.',
    full:'Retourne un tableau [valeur, setter]. Chaque appel du setter déclenche un re-render du composant. Ne jamais muter l\'état directement — toujours utiliser le setter. Pour les objets/tableaux : créer une copie.',
    example:'const [count, setCount] = useState(0);\nconst [user, setUser] = useState(null);\n\n// Correct\nsetCount(prev =\u003e prev + 1);\nsetUser(prev =\u003e ({ ...prev, nom: "Alice" }));\n\n// MAUVAIS — mute directement\ncount++; // rien ne se passe\nuser.nom = "Alice"; // pas de re-render',
    interview_tip:'Quand le nouvel état dépend de l\'ancien, toujours utiliser la forme fonctionnelle : setState(prev => ...).' },

  { cat:'react', term:'useEffect', interview:true,
    short:'Hook gérant les effets de bord (fetch, abonnements, DOM).',
    full:'S\'exécute après chaque render. Le tableau de dépendances contrôle quand il se relance. Retourner une fonction = cleanup (évite les fuites mémoire). Règle : ne jamais mentir sur les dépendances.',
    example:'// Au montage seulement\nuseEffect(() =\u003e {\n  fetchUser(id).then(setUser);\n}, []);\n\n// À chaque changement de id\nuseEffect(() =\u003e {\n  fetchUser(id).then(setUser);\n}, [id]);\n\n// Avec cleanup\nuseEffect(() =\u003e {\n  const timer = setInterval(tick, 1000);\n  return () =\u003e clearInterval(timer); // cleanup\n}, []);',
    interview_tip:'[] = au montage. [dep] = quand dep change. Pas de tableau = à chaque render. Le cleanup évite les fuites mémoire.' },

  { cat:'react', term:'useContext', interview:true,
    short:'Hook accédant à un contexte global sans passer les props manuellement.',
    full:'Évite le "prop drilling" (passer des props à travers de nombreux composants intermédiaires). Créer un contexte avec createContext(), fournir la valeur avec Provider, consommer avec useContext.',
    example:'// Créer\nconst ThemeCtx = createContext("light");\n\n// Fournir (haut de l\'arbre)\nfunction App() {\n  return (\n    \u003cThemeCtx.Provider value="dark"\u003e\n      \u003cPage /\u003e\n    \u003c/ThemeCtx.Provider\u003e\n  );\n}\n\n// Consommer (n\'importe où dans l\'arbre)\nfunction Bouton() {\n  const theme = useContext(ThemeCtx);\n  return \u003cbutton className={theme}\u003eClic\u003c/button\u003e;\n}',
    interview_tip:'Context n\'est pas un remplaçant de Redux. Pour un état global complexe avec beaucoup de mises à jour, préférer Zustand ou Redux Toolkit.' },

  { cat:'react', term:'useRef', interview:true,
    short:'Hook créant une référence persistante sans déclencher de re-render.',
    full:'Deux usages principaux : 1) Accéder directement à un élément DOM (focus, lecture vidéo). 2) Stocker une valeur persistante entre renders sans déclencher de re-render (timer ID, valeur précédente).',
    example:'// Accès DOM\nconst inputRef = useRef(null);\n\u003cinput ref={inputRef} /\u003e\nbutton onClick={() =\u003e inputRef.current.focus()}\n\n// Valeur persistante sans re-render\nconst timerRef = useRef(null);\ntimerRef.current = setInterval(tick, 1000);\n// Plus tard\nclearInterval(timerRef.current);',
    interview_tip:'useRef ne déclenche pas de re-render quand .current change. C\'est la différence clé avec useState.' },

  { cat:'react', term:'useMemo / useCallback', interview:true,
    short:'Hooks mémorisant une valeur ou une fonction pour éviter des recalculs coûteux.',
    full:'useMemo : mémorise le résultat d\'un calcul. useCallback : mémorise une fonction. N\'utiliser que si la performance est vraiment un problème — ils ont un coût. La règle : profiler d\'abord, optimiser ensuite.',
    example:'// useMemo — calcul coûteux\nconst total = useMemo(() =\u003e\n  items.reduce((acc, i) =\u003e acc + i.prix, 0),\n  [items] // recalcule si items change\n);\n\n// useCallback — fonction stable\nconst handleClick = useCallback(() =\u003e {\n  setCount(c =\u003e c + 1);\n}, []); // jamais recrée',
    interview_tip:'La plupart du temps inutile. Utile si la valeur est passée à un composant enfant mémoïsé (React.memo) ou dans un useEffect.' },

  { cat:'react', term:'Rendu conditionnel', interview:true,
    short:'Affichage conditionnel d\'éléments JSX selon l\'état ou les props.',
    full:'Plusieurs patterns : opérateur ternaire pour choisir entre deux éléments, && pour afficher ou rien, variable JSX pour une logique plus complexe.',
    example:'// Ternaire\n{isLoading ? \u003cSpinner /\u003e : \u003cContent /\u003e}\n\n// && (attention aux 0 !)\n{items.length \u003e 0 \u0026\u0026 \u003cListe items={items} /\u003e}\n\n// Variable JSX\nlet contenu;\nif (erreur) contenu = \u003cErreur /\u003e;\nelse if (loading) contenu = \u003cSpinner /\u003e;\nelse contenu = \u003cData /\u003e;\nreturn \u003cdiv\u003e{contenu}\u003c/div\u003e;',
    interview_tip:'Piège classique : {0 \u0026\u0026 \u003cComposant /\u003e} affiche "0" ! Toujours convertir en booléen : {!!items.length \u0026\u0026 ...} ou {items.length \u003e 0 \u0026\u0026 ...}.' },

  { cat:'react', term:'Listes et clés (key)', interview:true,
    short:'Rendu de listes avec map() et attribut key obligatoire.',
    full:'React utilise les key pour identifier les éléments lors du re-render et optimiser les mises à jour du DOM. La key doit être unique parmi les frères, stable (pas l\'index si la liste peut changer d\'ordre).',
    example:'// Correct : key stable et unique\n{users.map(user =\u003e (\n  \u003cli key={user.id}\u003e{user.nom}\u003c/li\u003e\n))}\n\n// Mauvais : index comme key\n{users.map((user, index) =\u003e (\n  \u003cli key={index}\u003e{user.nom}\u003c/li\u003e // problème si tri/suppression\n))}',
    interview_tip:'La key ne doit jamais être l\'index d\'un tableau susceptible d\'être réordonné ou filtré. Utiliser un identifiant unique stable (id BDD).' },

  { cat:'react', term:'React Router', interview:true,
    short:'Bibliothèque gérant la navigation entre pages dans une SPA React.',
    full:'Single Page Application : une seule page HTML, le JS simule la navigation. React Router intercepte les changements d\'URL et affiche le bon composant sans recharger la page.',
    example:'// App.jsx\n\u003cBrowserRouter\u003e\n  \u003cRoutes\u003e\n    \u003cRoute path="/" element={\u003cAccueil /\u003e} /\u003e\n    \u003cRoute path="/users" element={\u003cUsers /\u003e} /\u003e\n    \u003cRoute path="/users/:id" element={\u003cUserDetail /\u003e} /\u003e\n    \u003cRoute path="*" element={\u003cNotFound /\u003e} /\u003e\n  \u003c/Routes\u003e\n\u003c/BrowserRouter\u003e\n\n// Récupérer un paramètre\nconst { id } = useParams();',
    interview_tip:'useNavigate() pour naviguer programmatiquement. useParams() pour les paramètres d\'URL. Link au lieu de a pour éviter le rechargement.' },

  { cat:'react', term:'Cycle de vie (hooks)', interview:true,
    short:'Équivalents des méthodes de cycle de vie de classe avec les hooks.',
    full:'Avec les composants fonctionnels et les hooks, les anciennes méthodes de cycle de vie (componentDidMount, etc.) sont remplacées par useEffect.',
    example:'// componentDidMount → montage\nuseEffect(() =\u003e { fetchData(); }, []);\n\n// componentDidUpdate → mise à jour\nuseEffect(() =\u003e { fetchData(id); }, [id]);\n\n// componentWillUnmount → démontage\nuseEffect(() =\u003e {\n  return () =\u003e cleanup();\n}, []);\n\n// getDerivedStateFromProps → useMemo ou useEffect',
    interview_tip:'Savoir mapper les anciennes méthodes de classe aux hooks montre une bonne compréhension de React.' },

  { cat:'react', term:'Formulaire contrôlé', interview:true,
    short:'Formulaire dont l\'état est entièrement géré par React via useState.',
    full:'La valeur de chaque champ est stockée dans le state React. À chaque frappe, onChange met à jour le state, React re-render et affiche la nouvelle valeur. React est la "source de vérité".',
    example:'const [form, setForm] = useState({ email: "", mdp: "" });\n\nconst handleChange = (e) =\u003e {\n  setForm(prev =\u003e ({\n    ...prev,\n    [e.target.name]: e.target.value\n  }));\n};\n\n\u003cinput\n  name="email"\n  value={form.email}\n  onChange={handleChange}\n/\u003e',
    interview_tip:'Formulaire contrôlé = React contrôle la valeur. Non-contrôlé = le DOM gère la valeur (via useRef). Préférer les contrôlés pour la validation.' },

  { cat:'react', term:'Custom Hook', interview:true,
    short:'Fonction réutilisable encapsulant de la logique avec des hooks React.',
    full:'Un custom hook est une fonction dont le nom commence par "use" et qui peut appeler d\'autres hooks. Permet de partager de la logique (pas de l\'UI) entre plusieurs composants.',
    example:'// useFetch.js\nfunction useFetch(url) {\n  const [data, setData] = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState(null);\n\n  useEffect(() =\u003e {\n    fetch(url)\n      .then(r =\u003e r.json())\n      .then(setData)\n      .catch(setError)\n      .finally(() =\u003e setLoading(false));\n  }, [url]);\n\n  return { data, loading, error };\n}\n\n// Utilisation\nconst { data, loading } = useFetch("/api/users");',
    interview_tip:'Les custom hooks permettent de tester la logique indépendamment de l\'UI. C\'est la meilleure façon de réutiliser de la logique stateful.' },
];


//  MÉTADONNÉES DES CATÉGORIES

const CAT_META = {
  web:      { label:'Web général',     color:'var(--web)',      tc:'#0071e3', bg:'rgba(0,113,227,.07)'     },
  html:     { label:'HTML',            color:'var(--html)',     tc:'#e8572a', bg:'rgba(232,87,42,.07)'     },
  css:      { label:'CSS',             color:'var(--css)',      tc:'#2997ff', bg:'rgba(41,151,255,.07)'    },
  js:       { label:'JavaScript',      color:'var(--js)',       tc:'#bf8700', bg:'rgba(191,135,0,.08)'     },
  php:      { label:'PHP',             color:'var(--php)',      tc:'#7d4fc7', bg:'rgba(125,79,199,.07)'    },
  bdd:      { label:'Base de données', color:'var(--bdd)',      tc:'#28b560', bg:'rgba(40,181,96,.07)'     },
  git:      { label:'Git',             color:'var(--git)',      tc:'#d63f53', bg:'rgba(214,63,83,.07)'     },
  devops:   { label:'DevOps',          color:'var(--devops)',   tc:'#00878a', bg:'rgba(0,135,138,.07)'     },
  securite: { label:'Sécurité',        color:'var(--securite)', tc:'#c93535', bg:'rgba(201,53,53,.07)'     },
  algo:     { label:'Algorithmique',   color:'var(--algo)',     tc:'#8040bf', bg:'rgba(128,64,191,.07)'    },
  react:    { label:'React',            color:'var(--react)',    tc:'#0ea5e9', bg:'rgba(14,165,233,.07)'    },
};


//  ÉTAT

let currentFilter = 'all';
let currentSearch = '';
let expandedId    = null;
let recentTerms   = [];


//  RECHERCHE & FILTRES

function setFilter(cat, btn) {
  currentFilter = cat;
  expandedId    = null;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function doSearch() {
  const val = document.getElementById('search').value;
  currentSearch = val.toLowerCase().trim();
  document.getElementById('clear-btn').classList.toggle('visible', currentSearch.length > 0);
  expandedId = null;
  render();
}

function clearSearch() {
  document.getElementById('search').value = '';
  currentSearch = '';
  document.getElementById('clear-btn').classList.remove('visible');
  render();
  document.getElementById('search').focus();
}

function showRandom() {
  const pool = getFiltered();
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  // Reset tout
  currentSearch = '';
  currentFilter = 'all';
  document.getElementById('search').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-pill[data-cat="all"]').classList.add('active');
  expandedId = pick.term;
  render();
  setTimeout(() => {
    const el = document.querySelector('.term-card.expanded');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 80);
}

function getFiltered() {
  return GLOSSARY.filter(t => {
    if (currentFilter !== 'all' && t.cat !== currentFilter) return false;
    if (!currentSearch) return true;
    const s = currentSearch;
    return t.term.toLowerCase().includes(s)
        || t.short.toLowerCase().includes(s)
        || (t.full||'').toLowerCase().includes(s)
        || (t.example||'').toLowerCase().includes(s);
  });
}


//  RENDU

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q || !text) return esc(text||'');
  const escaped = esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function render() {
  const main     = document.getElementById('main');
  const metaEl   = document.getElementById('search-meta');
  const navCount = document.getElementById('nav-count');
  const filtered = getFiltered();

  // Méta
  navCount.textContent = GLOSSARY.length + ' termes';
  if (currentSearch) {
    metaEl.innerHTML = filtered.length
      ? `<strong>${filtered.length}</strong> résultat${filtered.length>1?'s':''} pour « <strong>${esc(currentSearch)}</strong> »`
      : `Aucun résultat pour « <strong>${esc(currentSearch)}</strong> »`;
  } else {
    metaEl.innerHTML = currentFilter === 'all'
      ? `<strong>${filtered.length}</strong> termes`
      : `<strong>${filtered.length}</strong> termes · ${CAT_META[currentFilter]?.label||''}`;
  }

  if (!filtered.length) {
    main.innerHTML = `<div class="empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">Aucun terme trouvé pour « ${esc(currentSearch)} »</div>
    </div>`;
    return;
  }

  // Grouper par catégorie
  const groups = {};
  filtered.forEach(t => { (groups[t.cat] = groups[t.cat]||[]).push(t); });

  let html = '';
  for (const [cat, terms] of Object.entries(groups)) {
    const m = CAT_META[cat] || { label: cat, color:'#86868b', tc:'#86868b', bg:'rgba(134,134,139,.07)' };
    html += `<div class="section-group">
      <div class="section-header">
        <div class="section-color-bar" style="background:${m.color}"></div>
        <span class="section-name">${m.label}</span>
        <span class="section-count">· ${terms.length} terme${terms.length>1?'s':''}</span>
      </div>
      <div class="grid">`;

    for (const t of terms) {
      const exp = expandedId === t.term;
      const m2  = CAT_META[t.cat] || { tc:'#86868b', bg:'rgba(0,0,0,.04)', label: t.cat };

      html += `<div class="term-card${exp?' expanded':''}"
               onclick="toggleCard(this)"
               data-term="${t.term.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">

        <div class="card-stripe" style="background:${m2.tc}"></div>

        <div class="card-top">
          <div class="term-name">${highlight(t.term, currentSearch)}</div>
          <div class="badge-row">
            ${t.interview ? '<span class="interview-chip"></span>' : ''}
            <span class="cat-chip"
              style="background:${m2.bg};color:${m2.tc}">${m2.label}</span>
          </div>
        </div>

        <div class="term-short">${highlight(t.short, currentSearch)}</div>

        <div class="term-detail">
          <div class="detail-section">
            <div class="detail-label">Explication</div>
            <div class="detail-text">${esc(t.full||'').replace(/\n/g,'<br>')}</div>
          </div>

          ${t.example ? `<div class="detail-section">
            <div class="detail-label">Exemple</div>
            <div class="code-block">${esc(t.example)}</div>
          </div>` : ''}

          ${t.interview && t.interview_tip ? `<div class="detail-section">
            <div class="detail-label">En entretien</div>
            <div class="interview-box">
              <div class="detail-text">${esc(t.interview_tip).replace(/\n/g,'<br>')}</div>
            </div>
          </div>` : ''}
        </div>

        <div class="card-footer">
          <span class="expand-btn">
            ${exp ? 'Réduire' : 'Voir plus'}
            <span class="chevron">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </span>
          </span>
        </div>
      </div>`;
    }
    html += '</div></div>';
  }
  main.innerHTML = html;
}

function toggleCard(el) {
  const termName = el.dataset.term;
  if (expandedId === termName) {
    expandedId = null;
  } else {
    expandedId = termName;
    addRecent(termName);
  }
  render();
}


//  RÉCENTS

async function addRecent(name) {
  recentTerms = [name, ...recentTerms.filter(t => t !== name)].slice(0, 8);
  renderRecent();
  try { await window.storage.set('glossaire-recent', JSON.stringify(recentTerms)); } catch {}
}

function renderRecent() {
  const section = document.getElementById('recent-section');
  const row     = document.getElementById('recent-row');
  if (!recentTerms.length) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  row.innerHTML = recentTerms.map(t =>
    `<span class="recent-chip" onclick="jumpTo(this)" data-term="${t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">${esc(t)}</span>`
  ).join('');
}

function jumpTo(el) {
  const termName = el.dataset.term;
  currentSearch = '';
  currentFilter = 'all';
  expandedId    = termName;
  document.getElementById('search').value = '';
  document.getElementById('clear-btn').classList.remove('visible');
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-pill[data-cat="all"]').classList.add('active');
  render();
  setTimeout(() => {
    const el = document.querySelector('.term-card.expanded');
    if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 80);
}


//  CLAVIER

document.addEventListener('keydown', e => {
  const src = e.target;
  if (e.key === '/' && src.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('search').focus();
  }
  if (e.key === 'Escape') {
    if (document.activeElement.id === 'search') {
      clearSearch();
      document.getElementById('search').blur();
    } else {
      expandedId = null;
      render();
    }
  }
});


//  NAVIGATION MAC

function macGoBack() {
  // Transition douce avant de partir
  document.body.style.transition = 'opacity .25s ease';
  document.body.style.opacity    = '0';
  setTimeout(() => {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      // Remonte d'un niveau si pas d'historique
      const parts = window.location.pathname.split('/');
      parts.splice(-2, 2); // retire /GLOSSAIRE/glossaire-dwwm.html
      window.location.href = parts.join('/') + '/index.html';
    }
  }, 220);
}

//  INIT

async function init() {
  try {
    const saved = await window.storage.get('glossaire-recent');
    if (saved?.value) { recentTerms = JSON.parse(saved.value); renderRecent(); }
  } catch {}
  render();
}
init();
</script>
<script src="/Cursor.js"></script>
